<!DOCTYPE html>
<html lang="ko" data-mode="__MODE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 증시 히트맵</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23000'/%3E%3Crect x='2' y='2' width='7' height='7' fill='%232bb553'/%3E%3Crect x='10' y='2' width='4' height='7' fill='%238b444e'/%3E%3Crect x='2' y='10' width='4' height='4' fill='%23414554'/%3E%3Crect x='7' y='10' width='7' height='4' fill='%23f63538'/%3E%3C/svg%3E">
<!--__FONT__-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --page:#131418; --panel:#191a1f; --panel2:#202228; --line:#2b2d34; --line2:#373a42;
  --fg:#eef0f3; --fg2:#bcc0c8; --muted:#8a8f99; --faint:#858993;
  --amber:#ffb547; --amber-soft:rgba(255,181,71,.14);
  --up-text:#ff5c66; --dn-text:#2fd67a;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up-text)} .dn{color:var(--dn-text)} .flat{color:var(--muted)}

/* ── Top bar ───────────────────────────── */
.top{display:flex;align-items:center;gap:20px;padding:12px 18px 10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;display:inline-grid;grid-template-columns:1fr 1fr;gap:1.5px}
.brand i b{display:block;border-radius:1px}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{padding:6px 14px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--amber)}
.tabs button:hover{color:var(--fg)}
.idx{display:flex;gap:18px;font-size:13px;margin-left:auto}
.idx div{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.idx .k{color:var(--muted)} .idx .v{font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live .dot{background:var(--amber);box-shadow:0 0 0 0 rgba(255,181,71,.6);animation:pulse 1.8s infinite}
.status .badge{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.status.live .badge{color:var(--amber);border-color:rgba(255,181,71,.35);background:var(--amber-soft)}
.status.err .dot{background:var(--dn-text);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.55)}70%{box-shadow:0 0 0 7px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}

/* ── Toolbar ───────────────────────────── */
.tools{display:flex;align-items:center;gap:16px;padding:0 18px 10px;flex-wrap:wrap}
.search{position:relative;flex:0 1 260px;min-width:200px}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:14px;padding:0 34px 0 34px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--amber)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:8px;top:7px;font:500 11px var(--sans);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
.search input:focus ~ kbd{display:none}
.sugg{position:absolute;left:0;right:0;top:40px;z-index:60;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none;max-height:340px;overflow:auto}
.sugg.open{display:block}
.sugg button{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:14px}
.sugg button[aria-selected="true"],.sugg button:hover{background:rgba(255,255,255,.06)}
.sugg .sw{width:10px;height:10px;border-radius:2px}
.sugg .meta{color:var(--muted);font-size:12px}
.sugg .empty{padding:10px;color:var(--muted);font-size:13px;line-height:1.5}
.sugg .empty small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl > span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--fg2);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg .pal{display:inline-flex;gap:1px;margin-right:6px;vertical-align:-1px}
.seg .pal b{width:6px;height:11px;display:block}
.seg .pal b:first-child{border-radius:2px 0 0 2px} .seg .pal b:last-child{border-radius:0 2px 2px 0}

/* ── Layout ───────────────────────────── */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:0 18px 14px;flex:1;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0}
.stagebar{display:flex;align-items:center;gap:12px;padding-bottom:6px;min-height:36px}
.crumbs{display:flex;align-items:center;gap:6px;min-height:30px;font-size:13.5px;flex-wrap:wrap;flex:1;min-width:0}
.viewseg button{padding:3px 10px;font-size:12.5px}
.crumbs button.c{color:var(--fg2);padding:3px 6px;border-radius:5px}
.crumbs button.c:hover{background:var(--panel2);color:var(--fg)}
.crumbs button.c.cur{color:var(--fg);font-weight:600;cursor:default;background:none}
.crumbs .sep{color:var(--faint)}
.crumbs .ci{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.crumbs .back{margin-right:4px;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--amber);border:1px solid rgba(255,181,71,.35);background:var(--amber-soft);padding:3px 9px;border-radius:6px}
.crumbs .stat{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.crumbs .stat b{font-weight:600}
.crumbs .hint{color:var(--faint);font-size:12.5px;margin-left:8px}

.map{position:relative;background:#000;border-radius:6px;overflow:hidden;height:calc(100vh - 168px);min-height:520px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.node{position:absolute;overflow:hidden}
.map.anim .node{transition:opacity .3s,background-color .6s}
.node.entering{opacity:0}
.node.leaving{opacity:0!important;pointer-events:none}
.node.leaving .hd{pointer-events:none}
.sec,.ind{pointer-events:none}
.sec{z-index:1}
.ind{z-index:2}
.sec .hd,.ind .hd{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:0 5px;pointer-events:auto;cursor:zoom-in;white-space:nowrap;overflow:hidden;text-align:left;border-radius:0;width:100%}
.sec .hd:focus-visible,.ind .hd:focus-visible{outline-offset:-2px;z-index:5}
.sec .hd{background:#000;font-size:12px;font-weight:700;color:#f2f3f5}
.ind .hd{background:#0d0e11;font-size:10.5px;font-weight:500;color:#a6abb5}
.sec .hd .t,.ind .hd .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec .hd .v,.ind .hd .v{font-variant-numeric:tabular-nums;flex:none;font-weight:600}
.sec .hd:hover,.ind .hd:hover{color:#fff}
.sec .hd:hover .t,.ind .hd:hover .t{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--amber)}
.focus-leaf .ind .hd,.focus-leaf .sec .hd{cursor:default}
.focus-leaf .sec .hd:hover .t,.focus-leaf .ind .hd:hover .t{text-decoration:none}
.sec.hot{box-shadow:inset 0 0 0 2px var(--amber);z-index:4;pointer-events:none}
.tile{z-index:3;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.tile .lab{display:flex;flex-direction:column;align-items:center;max-width:100%;padding:0 3px;line-height:1.08;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tile .lab[hidden]{display:none}
.tile .nm{font-weight:600;white-space:nowrap;letter-spacing:-.02em;max-width:100%}
.tile .nm.ell{overflow:hidden;text-overflow:ellipsis}
.tile .pc{font-size:.74em;font-weight:500;margin-top:.12em;font-variant-numeric:tabular-nums;opacity:.96}
.tile .px{font-size:.52em;font-weight:500;margin-top:.3em;opacity:.78;font-variant-numeric:tabular-nums}
.tile .pc[hidden],.tile .px[hidden]{display:none}
.tile:hover,.tile.hov{box-shadow:inset 0 0 0 2px rgba(255,255,255,.92);z-index:5}
.tile.sel{box-shadow:inset 0 0 0 3px var(--amber),0 0 0 1px #000;z-index:6}
.tile.dim{filter:saturate(.25) brightness(.38)}
.map.anim .tile{transition:opacity .3s,background-color .6s,filter .2s}
.tile{transition:filter .2s}
.tile.flash-up::after,.tile.flash-dn::after{content:"";position:absolute;inset:0;pointer-events:none;animation:flash .9s ease-out}
.tile.flash-up::after{background:rgba(255,255,255,.38)}
.tile.flash-dn::after{background:rgba(0,0,0,.45)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* table view */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;height:calc(100vh - 168px);min-height:520px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.list th button{display:block;width:100%;padding:9px 12px;font-size:inherit;font-weight:inherit;color:inherit;text-align:inherit;white-space:nowrap}
.list th button:hover{color:var(--fg)}
.list th button:focus-visible,.list tbody tr:focus-visible{outline-offset:-2px}
.list th:first-child,.list td:first-child,.list th:nth-child(2),.list td:nth-child(2){text-align:left}
.list th[aria-sort]{color:var(--fg)}
.list th[aria-sort="descending"]::after{content:" ▾"} .list th[aria-sort="ascending"]::after{content:" ▴"}
.list td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:rgba(255,255,255,.035)}
.list tbody tr.sel{background:var(--amber-soft)}
.list .nmcell{display:flex;align-items:center;gap:9px;font-weight:600}
.list .nmcell i{width:10px;height:10px;border-radius:2px;flex:none}
.list .nmcell small{color:var(--faint);font-weight:400;font-size:11.5px}
.list .indc{color:var(--muted);font-size:12.5px}

/* ── Side ───────────────────────────── */
.side{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:42px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{margin:0 0 10px;font-size:13.5px;font-weight:600;color:var(--fg);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.wavg{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.wavg b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wavg span{font-size:12.5px;color:var(--muted)}
.breadth{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:transparent}
.breadth i{display:block;height:100%}
.breadth-lab{display:flex;justify-content:space-between;font-size:12.5px;margin-top:7px;font-variant-numeric:tabular-nums}
.hist{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;align-items:end;height:86px;margin-top:16px}
.hist button{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border-radius:3px}
.hist button .bar{display:block;border-radius:3px 3px 1px 1px;min-height:2px;transition:opacity .15s}
.hist button .cnt{font-size:10.5px;color:var(--fg2);text-align:center;margin-bottom:3px;font-variant-numeric:tabular-nums}
.hist.has-sel button:not([aria-pressed="true"]) .bar{opacity:.28}
.hist button[aria-pressed="true"] .cnt{color:var(--amber);font-weight:600}
.hist button:hover .bar{opacity:1!important;filter:brightness(1.15)}
.hist-axis{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;font-size:10.5px;color:var(--muted);margin-top:5px;text-align:center;font-variant-numeric:tabular-nums}
.hist-note{font-size:11.5px;color:var(--faint);margin-top:8px}
.secs{display:flex;flex-direction:column;gap:1px}
.secs button{display:grid;grid-template-columns:minmax(0,1fr) 92px 58px;align-items:center;gap:8px;padding:6px 6px;margin:0 -6px;border-radius:6px;font-size:13px;text-align:left}
.secs button:hover{background:rgba(255,255,255,.045)}
.secs button.cur{background:var(--amber-soft)}
.secs .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secs .nm small{color:var(--faint);font-size:11px;margin-left:4px}
.secs .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.dbar{position:relative;height:10px}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.dbar i{position:absolute;top:1px;height:8px;border-radius:2px}
.movers-tabs{display:flex;gap:2px;margin-bottom:8px}
.movers-tabs button{font-size:12.5px;padding:4px 9px;border-radius:6px;color:var(--muted)}
.movers-tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.movers{display:flex;flex-direction:column;gap:1px}
.movers button{display:grid;grid-template-columns:10px minmax(0,1fr) auto 66px;gap:9px;align-items:center;padding:6px;margin:0 -6px;border-radius:6px;font-size:13px;text-align:left}
.movers button:hover{background:rgba(255,255,255,.045)}
.movers i{width:10px;height:10px;border-radius:2px}
.movers .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.movers .px{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.movers .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

footer{padding:4px 18px 18px;font-size:12px;color:var(--faint);line-height:1.6}
footer p{margin:0;max-width:92ch}
footer a{color:var(--muted)}

/* ── Tooltip & detail ───────────────────────────── */
.tip{position:fixed;z-index:80;pointer-events:none;width:300px;background:rgba(24,25,30,.97);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;backdrop-filter:blur(6px)}
.tip.show{opacity:1;transform:none}
.card-head{padding:11px 13px 10px;border-bottom:1px solid var(--line)}
.card-head .path{font-size:11.5px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .nmrow{display:flex;align-items:baseline;gap:7px}
.card-head .nmrow b,.card-head .nmrow .nmbtn{font-size:17px;font-weight:700;letter-spacing:-.02em;text-align:left}
.card-head .nmrow .nmbtn{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px;border-radius:4px}
.card-head .nmrow small{color:var(--faint);font-size:11.5px}
.card-head .px{display:flex;align-items:baseline;gap:9px;margin-top:4px;font-variant-numeric:tabular-nums}
.card-head .px b{font-size:21px;font-weight:700;letter-spacing:-.01em}
.card-head .px span{font-weight:600;font-size:13.5px}
.card-head .meta{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-head .meta em{font-style:normal;color:var(--fg2)}
.peers{padding:7px 7px 8px}
.peers .ttl{font-size:11.5px;color:var(--muted);padding:2px 6px 5px}
.peer{display:grid;grid-template-columns:9px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;padding:3px 6px;border-radius:5px;font-size:12.5px}
.peer.me{background:rgba(255,255,255,.07);font-weight:600}
.peer i{width:9px;height:9px;border-radius:2px}
.peer .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer .v{text-align:right;font-variant-numeric:tabular-nums}
.peer .dbar{height:8px}
.peer .dbar i{height:6px;top:1px}

.sheet{position:fixed;z-index:90;right:18px;bottom:18px;width:340px;max-height:min(640px,calc(100vh - 36px));overflow:auto;background:rgba(24,25,30,.98);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:none;font-size:13px}
.sheet.open{display:block;animation:sheetIn .2s ease-out}
.sheet:focus{outline:none}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet .grab{display:none}
.sheet .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.sheet .x:hover{background:rgba(255,255,255,.07);color:var(--fg)}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 13px 13px;border-top:1px solid var(--line)}
.sheet .acts button,.sheet .acts a{flex:1;display:inline-flex;justify-content:center;align-items:center;height:36px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none}
.sheet .acts .pri{background:var(--amber);color:#1b1404;flex:1 1 100%}
.sheet .acts .sec2{border:1px solid var(--line2);color:var(--fg)}
.spark{padding:8px 13px 0}
.spark svg{display:block;width:100%;height:70px}
.spark .note{font-size:11.5px;color:var(--faint);padding:2px 0 6px}

.scrim{display:none}

@media (max-width: 980px){
  .layout{grid-template-columns:1fr}
  .side{padding-top:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (max-width: 760px){
  .top{padding:12px 12px 8px;gap:10px 12px}
  .brand{font-size:16px}
  .idx{order:3;width:100%;margin-left:0;gap:14px;font-size:12.5px}
  .status{order:2;margin-left:auto}
  .status .txt{display:none}
  .tabs{order:4;width:100%}
  .tabs button{flex:1}
  .tools{padding:0 12px 8px;gap:8px}
  .search{flex:1 1 100%;min-width:0}
  .search kbd{display:none}
  .ctls{display:flex;gap:12px;overflow-x:auto;width:calc(100% + 24px);margin:0 -12px;padding:2px 12px 4px;scrollbar-width:none}
  .ctls::-webkit-scrollbar{display:none}
  .layout{padding:0 12px 12px;gap:12px}
  .crumbs .stat{margin-left:0;width:100%;order:9}
  .crumbs .hint{display:none}
  .map,.tablewrap{height:72svh;min-height:440px}
  .side{display:flex}
  .tip{display:none}
  .sheet{left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;max-height:78svh;padding-bottom:env(safe-area-inset-bottom)}
  .sheet .grab{display:block;width:38px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
  .scrim.open{display:block;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.45)}
  footer{padding:4px 12px 24px}
  .tabs button,.seg button,.movers-tabs button,.crumbs button.c,.crumbs .back{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .crumbs .back{padding:3px 12px}
  .secs button,.movers button{min-height:40px}
  .sheet .x{width:40px;height:40px;right:6px;top:6px}
  .list th:nth-child(2),.list td:nth-child(2){display:none}
  table.list{font-size:12.5px}
  .list th{font-size:12px}
  .list th button{min-height:40px;padding:0 6px}
  .list td{padding:10px 6px}

<script>

const PALETTES = {

/* ───────────────── state ───────────────── */
const state = {

  sizeBy: store.get('sizeBy', 'cap'),
  topN: store.get('topN', narrowMQ.matches ? 100 : 300),

/* ───────────────── data ───────────────── */
const INDUSTRY = new Map(SNAP.stocks.map(s => [s.c, [s.s || '기타', s.i || '기타']]));
let DATA = null;
function setData(raw) {

  for (const x of raw.stocks || []) {
    const map = INDUSTRY.get(x.c);
    const st = {
      c: String(x.c), n: String(x.n), m: x.m === 'K' ? 'K' : 'Q',
      s: x.s || (map ? map[0] : '기타'), i: x.i || (map ? map[1] : '기타'),
      cap: +x.cap || 0, p: +x.p || 0, d: +x.d || 0, r: +x.r || 0, tv: +x.tv || 0, v: +x.v || 0,

}
setData(SNAP);

const val = st => state.sizeBy === 'tv' ? st.tv : st.cap;

let uniCache = { data: null, key: '', out: null };

}
function inFocus(s) { const f = state.focus; return !f || (s.s === f.s && (!f.i || s.i === f.i)); }

function groupChange(list) {

  for (const s of list) { if (!s.cap) continue; now += s.cap; before += s.cap / (1 + s.r / 100); }

}

/* ───────────────── colour ───────────────── */
let colorScale;
function rebuildColor() {
  const R = state.range, p = PALETTES[state.palette];
  colorScale = d3.scaleLinear().domain([-R, -R * 2 / 3, -R / 3, 0, R / 3, R * 2 / 3, R]).range(p.stops).interpolate(d3.interpolateLab).clamp(true);
  document.documentElement.style.setProperty('--up-text', p.upText);
  document.documentElement.style.setProperty('--dn-text', p.dnText);
}
const colorOf = r => r === 0 ? PALETTES[state.palette].stops[3] : colorScale(r);

/* buckets for the histogram legend */
function bucketEdges() { const R = state.range, t = R / 3; return [-R, -2 * t, -t, 0, t, 2 * t, R]; }
function bucketOf(r) {
  const R = state.range, t = R / 3;
  if (r === 0) return 4;
  if (r < 0) return r <= -R ? 0 : r <= -2 * t ? 1 : r <= -t ? 2 : 3;
  return r >= R ? 8 : r >= 2 * t ? 7 : r >= t ? 6 : 5;
}
function bucketMid(b) { const R = state.range, t = R / 3; return [-R, -2.5 * t, -1.5 * t, -.5 * t, 0, .5 * t, 1.5 * t, 2.5 * t, R][b]; }

/* ───────────────── treemap ───────────────── */
const mapEl = $('#map');
const nodes = new Map();

function buildRoot(list) {
  const grouped = d3.group(list, s => s.s, s => s.i);
  const data = { id: 'root', children: Array.from(grouped, ([s, inds]) => ({
    id: 'S|' + s, kind: 'sector', s,
    children: Array.from(inds, ([i, arr]) => ({ id: 'I|' + s + '|' + i, kind: 'ind', s, i, children: arr.map(st => ({ id: 'T|' + st.c, kind: 'tile', st })) })),
  })) };
  return d3.hierarchy(data).sum(d => d.kind === 'tile' ? Math.max(val(d.st), 0) : 0).sort((a, b) => b.value - a.value);
}
function layout(root, W, H) {
  const narrow = W < 560;
  const SH = narrow ? 18 : 20, IH = narrow ? 14 : 15;
  const zoomedInd = state.focus && state.focus.i;
  d3.treemap().size([W, H]).round(true)
    .tile(d3.treemapSquarify.ratio(1))
    .paddingInner(n => n.depth === 0 ? 3 : n.depth === 1 ? 2 : 1)
    .paddingTop(n => {

      if (n.depth === 1) v = (w > 44 && hh > 34) ? SH : 0;
      else if (n.depth === 2) v = (zoomedInd || (w > 62 && hh > 48)) ? IH : 0;
      n._hd = v;
      return v;
    })(root);

}

function textUnits(str) {

    if (c >= 0xAC00 && c <= 0xD7A3 || c >= 0x3130 && c <= 0x318F || c >= 0x4E00 && c <= 0x9FFF) u += 1.0;

    else if (ch === '&' || ch === 'W' || ch === 'M') u += 0.8;
    else if (ch >= 'A' && ch <= 'Z') u += 0.66;
    else if (ch >= '0' && ch <= '9') u += 0.62;

function createNode(n) {

    return h('div', { class: 'node tile', 'data-c': n.data.st.c, tabindex: '-1' },
      h('div', { class: 'lab' }, h('span', { class: 'nm' }), h('span', { class: 'pc' }), h('span', { class: 'px' })));
  }

  if (k === 'ind') attrs['data-i'] = n.data.i;
  const lbl = (k === 'sector' ? n.data.s : n.data.i) + ' 확대';

const isHangul = ch => { const c = ch.codePointAt(0); return c >= 0xAC00 && c <= 0xD7A3; };

function placeNode(el, n, secGroups) {
  const x = n.x0, y = n.y0, w = Math.max(0, n.x1 - n.x0), hh = Math.max(0, n.y1 - n.y0);
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = hh + 'px';
  if (n.data.kind === 'tile') { paintTile(el, n.data.st, w, hh); return; }

  const r = groupChange(n.data.kind === 'sector' && secGroups.get(n.data.s) ? secGroups.get(n.data.s) : n.leaves().map(l => l.data.st));
  hd.children[0].textContent = name;
  const v = hd.children[1];
  const room = w - textUnits(name) * (n.data.kind === 'sector' ? 12 : 10.5) - 12;

let lastFocusKey = '';

async function loadSpark(st) {
  const id = ++sparkReq;
  const box = () => document.getElementById('spark');
  try {
    const res = await fetch(`api/chart/${encodeURIComponent(st.c)}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    if (id !== sparkReq || !box()) return;
    const pts = (j.points || []).filter(p => p && isFinite(p[1]));
    if (pts.length < 2) { box().replaceChildren(h('div', { class: 'note', text: '오늘 체결 흐름이 아직 없어요.' })); return; }
    const W = 314, H = 70, base = (st.p - st.d) || pts[0][1];
    const ys = pts.map(p => p[1]).concat(base);
    const y0 = Math.min(...ys), y1 = Math.max(...ys);
    const x = i => (i / (pts.length - 1)) * W;
    const y = v => y1 === y0 ? H / 2 : H - 4 - ((v - y0) / (y1 - y0)) * (H - 8);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join('');
    const last = pts[pts.length - 1][1];
    const col = last > base ? 'var(--up-text)' : last < base ? 'var(--dn-text)' : 'var(--muted)';
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio', 'none');
    const bl = document.createElementNS(NS, 'line');
    Object.entries({ x1: 0, x2: W, y1: y(base), y2: y(base), stroke: '#555963', 'stroke-dasharray': '3 3', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }).forEach(([k, v]) => bl.setAttribute(k, v));
    const path = document.createElementNS(NS, 'path');
    Object.entries({ d, fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }).forEach(([k, v]) => path.setAttribute(k, v));
    svg.append(bl, path);
    const day = j.day ? `${+j.day.slice(4, 6)}월 ${+j.day.slice(6, 8)}일` : '오늘';
    box().replaceChildren(svg, h('div', { class: 'note', text: `${day} 정규장 5분 흐름. 점선은 전일 종가 ${fmtInt(base)}` }));
  } catch (e) {
    if (id === sparkReq && box()) box().replaceChildren(h('div', { class: 'note', text: '장중 차트를 불러오지 못했어요.' }));
  }
}

  wrap.replaceChildren(h('table', { class: 'list' }, thead, tbody));
  wrap.scrollTop = prevTop;
  if (fc) { const tr = $(`#tablewrap tr[data-c="${fc}"]`); if (tr) tr.focus({ preventScroll: true }); }
}

/* ───────────────── header bits ───────────────── */
function renderHeader() {
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-pressed', String(b.dataset.mkt === state.market));
  const idx = $('#idx');
  const kids = [];
  for (const [k, label] of [['KOSPI', '코스피'], ['KOSDAQ', '코스닥']]) {
    const x = DATA.index && DATA.index[k];
    if (!x || !isFinite(+x.value)) continue;
    kids.push(h('div', {}, h('span', { class: 'k', text: label }), h('span', { class: 'v num', text: (+x.value).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }),
      h('span', { class: 'num ' + cls(+x.ratio), text: fmtPct(+x.ratio) })));
  }
  idx.replaceChildren(...kids);
}
let liveState = { ok: true, last: null, timer: null };
function renderStatus() {
  const el = $('#status');
  const asOf = DATA.asOf ? new Date(DATA.asOf) : null;
  const open = Object.values(DATA.marketStatus || {}).some(v => v === 'OPEN');
  el.classList.toggle('live', MODE === 'live' && liveState.ok && (open || DATA.afterHours));
  el.classList.toggle('err', MODE === 'live' && !liveState.ok);
  const txt = el.querySelector('.txt'), badge = el.querySelector('.badge');
  if (MODE === 'snapshot') {
    txt.textContent = asOf ? `${kstFmt.format(asOf)} 기준` : '';
    badge.textContent = '스냅샷';
  } else if (!liveState.ok) {
    txt.textContent = '연결이 끊겼어요. 다시 시도하는 중';
    badge.textContent = '재연결';
  } else {
    // while quotes are moving show when we fetched; once the market is closed show the data's own time
    txt.textContent = (open || DATA.afterHours) ? (liveState.last ? `${kstClock.format(liveState.last)} 갱신` : '') : (asOf && !isNaN(asOf) ? `${kstFmt.format(asOf)} 기준` : (liveState.last ? `${kstClock.format(liveState.last)} 갱신` : ''));
    badge.textContent = open ? '실시간' : DATA.afterHours ? '시간외 가격' : '장 마감';
    badge.title = DATA.afterHours ? '정규장 밖 시간이라 NXT·시간외 가격이 반영돼요' : '';
  }
}
function renderFooter() {
  const asOf = DATA.asOf ? kstFmt.format(new Date(DATA.asOf)) : '';
  const parts = [h('p', {}, `데이터: ${DATA.source || '네이버 증권'}. 크기는 ${state.sizeBy === 'tv' ? '거래대금' : '시가총액'}, 색은 전일 대비 등락률이에요. 섹터 분류는 네이버 업종(WICS 기준)을 따랐어요. 투자 판단의 근거로 쓰지 마세요.`)];
  if (MODE === 'live') parts.push(h('p', {}, '정규장 중에는 10초마다 새 시세를 받아 와요. 정규장 밖 시간에는 NXT·시간외 가격이 반영될 수 있어요.'));
  if (MODE === 'snapshot') parts.push(h('p', {}, `이 화면은 ${asOf} 시세를 담은 스냅샷이라 자동으로 갱신되지 않아요. 같은 코드를 Cloudflare Worker로 배포하면 10초마다 새 시세를 받아 와요.`));
  $('#foot').replaceChildren(...parts);
}

/* ───────────────── controls ───────────────── */
function buildPaletteSeg() {
  const seg = $('#palseg');
  seg.replaceChildren(...Object.entries(PALETTES).map(([k, p]) => h('button', { 'data-v': k },
    h('span', { class: 'pal', 'aria-hidden': 'true' }, h('b', { style: `background:${p.stops[0]}` }), h('b', { style: `background:${p.stops[3]}` }), h('b', { style: `background:${p.stops[6]}` })), p.label)));
}
function trimControlsForMode() {
  if (MODE === 'live') { const b = document.querySelector('.seg[data-key="topN"] button[data-v="500"]'); if (b) b.remove(); }
}
function syncControls() {
  for (const seg of document.querySelectorAll('.seg[data-key]')) {
    const k = seg.dataset.key;
    for (const b of seg.children) b.setAttribute('aria-pressed', String(String(state[k]) === b.dataset.v));
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('.seg[data-key] button');
  if (!b) return;
  const k = b.closest('.seg').dataset.key;
  let v = b.dataset.v;
  if (k === 'topN' || k === 'range') v = +v;
  if (state[k] === v) return;
  state[k] = v;
  if (k !== 'view') store.set(k === 'palette' ? 'palette2' : k, v);
  if (k === 'range' || k === 'palette') { rebuildColor(); state.bucket = null; document.dispatchEvent(new CustomEvent('kh:palette')); }
  if (k === 'view') {
    $('#map').hidden = v !== 'map';
    $('#tablewrap').hidden = v !== 'table';
    tip.classList.remove('show');
  }
  syncControls();
  render({ animate: k !== 'palette' && k !== 'range' && k !== 'view' });
  if (k === 'palette' || k === 'range') render();
  renderCrumbs(); renderSide(); renderFooter();
});
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-mkt]');
  if (!b) return;
  setMarket(b.dataset.mkt, true);
});
function setMarket(m, writeHash) {
  if (!MKT_NAME[m] || m === state.market) return;
  state.market = m; store.set('market', m);
  state.focus = null; state.bucket = null; state.selected = null; state.forced.clear();
  closeSheet();
  if (writeHash && location.hash.slice(1) !== TO_HASH[m]) location.hash = TO_HASH[m];
  renderHeader(); render({ animate: true }); renderCrumbs(); renderSide();
}
const bootMarket = state.market;   // what an address without #kospi/#kosdaq/#all shows
addEventListener('hashchange', () => { const hsh = location.hash.slice(1); if (stockOpen() || hsh.startsWith('s-')) return; const m = HASH_TO[hsh] || (!hsh ? bootMarket : null); if (m) setMarket(m, false); });

/* search */
const qEl = $('#q'), sugg = $('#sugg');
let suggIdx = 0, suggList = [];
function searchList(q) {
  if (!q) return [];
  const ql = q.toLowerCase();
  const pool = DATA.stocks.filter(inMarket);
  const starts = [], has = [];
  for (const s of pool) {
    const n = s.n.toLowerCase();
    if (n.startsWith(ql) || s.c.startsWith(q)) starts.push(s); else if (n.includes(ql)) has.push(s);
  }
  const by = (a, b) => b.cap - a.cap;
  return starts.sort(by).concat(has.sort(by)).slice(0, 8);
}
function renderSugg() {
  const q = qEl.value.trim();
  suggList = searchList(q);
  if (!q) { sugg.classList.remove('open'); qEl.setAttribute('aria-expanded', 'false'); qEl.removeAttribute('aria-activedescendant'); return; }
  sugg.replaceChildren(...(suggList.length ? suggList.map((s, i) => h('button', { role: 'option', id: 'sg-' + i, type: 'button', tabindex: '-1', 'aria-selected': String(i === suggIdx), onmousedown: ev => { ev.preventDefault(); pick(s); } },
    h('i', { class: 'sw', style: `background:${colorOf(s.r)}` }), h('span', {}, s.n, ' ', h('span', { class: 'meta', text: `${s.c} · ${s.i}` })),
    h('span', { class: 'meta num', text: fmtInt(s.p) }), h('span', { class: 'num ' + cls(s.r), text: fmtPct(s.r) })))
    : [h('div', { class: 'empty' }, `'${q}'와 맞는 ${MKT_NAME[state.market]} 종목이 없어요.`,
        MODE === 'live' ? h('small', { text: '실시간 대상(시장별 시총 상위 300종목) 안에서만 찾을 수 있어요' }) : null)]));
  sugg.classList.add('open'); qEl.setAttribute('aria-expanded', 'true');
  if (suggList.length) qEl.setAttribute('aria-activedescendant', 'sg-' + suggIdx); else qEl.removeAttribute('aria-activedescendant');
}
function pick(s) {
  qEl.value = ''; state.query = ''; suggIdx = 0;
  sugg.classList.remove('open'); qEl.blur();
  state.forced.add(s.c);
  state.focus = { s: s.s };
  render({ animate: true }); renderCrumbs(); renderSide();
  openStock(s.c, nodes.get('T|' + s.c) || null);
}
qEl.addEventListener('input', () => { state.query = qEl.value; suggIdx = 0; renderSugg(); applyHighlights(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!suggList.length) return; suggIdx = (suggIdx + (e.key === 'ArrowDown' ? 1 : -1) + suggList.length) % suggList.length; renderSugg(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (suggList[suggIdx]) pick(suggList[suggIdx]); }
  else if (e.key === 'Escape') { qEl.value = ''; state.query = ''; renderSugg(); applyHighlights(); qEl.blur(); }
});
qEl.addEventListener('blur', () => setTimeout(() => sugg.classList.remove('open'), 120));
qEl.addEventListener('focus', () => { if (qEl.value.trim()) renderSugg(); });
addEventListener('keydown', e => {
  if (stockOpen() || e.defaultPrevented) return;   // the stock page owns / and Esc while it is open
  if (e.key === '/' && document.activeElement !== qEl && !e.metaKey && !e.ctrlKey) { e.preventDefault(); qEl.focus(); }
  else if (e.key === 'Escape' && document.activeElement !== qEl) {
    if (sheet.classList.contains('open')) closeSheet();
    else if (state.bucket != null) { state.bucket = null; applyHighlights(); renderSide(); }
    else zoomOut();
  }
});

/* the map fills whatever height the header and toolbar leave (the toolbar wraps on narrower desktops) */
function fitMapHeight() {
  const tw = $('#tablewrap');
  if (narrowMQ.matches) { mapEl.style.height = ''; tw.style.height = ''; return; }
  const ref = state.view === 'map' ? mapEl : tw;
  const top = ref.getBoundingClientRect().top + scrollY;
  const hgt = Math.max(520, Math.round(innerHeight - top - 14)) + 'px';
  mapEl.style.height = hgt; tw.style.height = hgt;
}
let fh = 0;
addEventListener('resize', () => { cancelAnimationFrame(fh); fh = requestAnimationFrame(fitMapHeight); });
narrowMQ.addEventListener('change', fitMapHeight);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitMapHeight);

/* resize */
let rz = 0;
new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => render()); }).observe(mapEl);

/* ───────────────── live mode ───────────────── */
async function poll() {
  let open = false;
  const ac = new AbortController();
  const killer = setTimeout(() => ac.abort(), 8000);   // a stalled request must not stop the polling loop
  try {
    const res = await fetch('api/quotes', { cache: 'no-store', signal: ac.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    if (!raw || !Array.isArray(raw.stocks) || !raw.stocks.length) throw new Error('empty');
    const changed = setData(raw);
    liveState.ok = true; liveState.last = new Date();
    open = Object.values(DATA.marketStatus || {}).some(v => v === 'OPEN');
    render({ animate: true }); renderSide(); renderCrumbs(); renderHeader();
    if (!reduceMotion) for (const [c, dir] of changed) {
      const el = nodes.get('T|' + c);
      if (!el) continue;
      el.classList.remove('flash-up', 'flash-dn'); void el.offsetWidth;
      el.classList.add(dir > 0 ? 'flash-up' : 'flash-dn');
      setTimeout(() => el.classList.remove('flash-up', 'flash-dn'), 950);
    }
    if (state.hover && tip.classList.contains('show')) { const st = DATA.byCode.get(state.hover); if (st) fillTip(st); }
  } catch (e) {
    liveState.ok = false;
    try { if (!DATA.stocks.length) render(); } catch (e2) {}
  } finally {
    clearTimeout(killer);
    try { renderStatus(); } catch (e3) {}
    clearTimeout(liveState.timer);
    liveState.timer = setTimeout(poll, !liveState.ok ? 15000 : open ? 10000 : 60000);
  }
}
document.addEventListener('visibilitychange', () => { if (MODE === 'live' && !document.hidden) { clearTimeout(liveState.timer); poll(); } });

/* ───────────────── API for the stock page (src/stock/stock.js) ───────────────── */
// Contract: AGENTS.md §3. Events on document: 'kh:data' after quotes change, 'kh:palette' after palette/range change.
window.KH = {
  MODE,
  LIVE_URL: 'https://korea-market-heatmap.ssslot.workers.dev/',
  MKT_NAME,
  stock: code => (DATA && DATA.byCode.get(code)) || null,
  stocks: () => (DATA ? DATA.stocks : []),
  asOf: () => (DATA ? DATA.asOf : null),
  colorOf: r => colorOf(r),
  palette: () => { const p = PALETTES[state.palette]; return { key: state.palette, label: p.label, stops: p.stops.slice(), up: p.stops[6], down: p.stops[0], flat: p.stops[3], upText: p.upText, dnText: p.dnText }; },
  fmt: { pct: fmtPct, int: fmtInt, chg: fmtChg, eok: fmtEok, cls },
  h,
};

/* ───────────────── boot ───────────────── */
rebuildColor();
buildPaletteSeg();
trimControlsForMode();
syncControls();
fitMapHeight();
renderHeader();
renderStatus();
renderFooter();
render();
renderCrumbs();
renderSide();
if (MODE === 'live') poll();
})();
</script>
