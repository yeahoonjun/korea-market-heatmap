<!DOCTYPE html>
<html lang="ko" data-mode="__MODE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 증시 히트맵</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23000'/%3E%3Crect x='2' y='2' width='7' height='7' fill='%232bb553'/%3E%3Crect x='10' y='2' width='4' height='7' fill='%238b444e'/%3E%3Crect x='2' y='10' width='4' height='4' fill='%23414554'/%3E%3Crect x='7' y='10' width='7' height='4' fill='%23f63538'/%3E%3C/svg%3E">
<!--__FONT__-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --page:#131418; --panel:#191a1f; --panel2:#202228; --line:#2b2d34; --line2:#373a42;
  --fg:#eef0f3; --fg2:#bcc0c8; --muted:#8a8f99; --faint:#858993;
  --amber:#ffb547; --amber-soft:rgba(255,181,71,.14);
  --up-text:#ff5c66; --dn-text:#2fd67a;
  --nodata:#26282e;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up-text)} .dn{color:var(--dn-text)} .flat{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Top bar ───────────────────────────── */
.top{display:flex;align-items:center;gap:20px;padding:12px 18px 10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;display:inline-grid;grid-template-columns:1fr 1fr;gap:1.5px}
.brand i b{display:block;border-radius:1px}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{padding:6px 14px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--amber)}
.tabs button:hover{color:var(--fg)}
.tabs .st{color:var(--amber);margin-right:2px;font-size:.9em}
.tabs .tsep{width:1px;margin:5px 3px;background:var(--line2)}
.idx{display:flex;gap:18px;font-size:13px;margin-left:auto}
.idx div{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.idx .k{color:var(--muted)} .idx .v{font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live .dot{background:var(--amber);box-shadow:0 0 0 0 rgba(255,181,71,.6);animation:pulse 1.8s infinite}
.status .badge{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.status.live .badge,.status.replay .badge{color:var(--amber);border-color:rgba(255,181,71,.35);background:var(--amber-soft)}
.status.replay .dot{background:var(--amber);animation:none}
.status.err .dot{background:var(--dn-text);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.55)}70%{box-shadow:0 0 0 7px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}

/* ── Toolbar ───────────────────────────── */
.tools{position:relative;display:flex;align-items:center;gap:12px;padding:0 18px 10px;flex-wrap:wrap}
.search{position:relative;flex:0 1 210px;min-width:170px}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:14px;padding:0 34px 0 34px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--amber)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:8px;top:7px;font:500 11px var(--sans);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
.search input:focus ~ kbd{display:none}
.sugg{position:absolute;left:0;right:0;top:40px;z-index:60;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none;max-height:340px;overflow:auto}
.sugg.open{display:block}
.sugg button{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:14px}
.sugg button[aria-selected="true"],.sugg button:hover{background:rgba(255,255,255,.06)}
.sugg .sw{width:10px;height:10px;border-radius:2px}
.sugg .meta{color:var(--muted);font-size:12px}
.sugg .empty{padding:10px;color:var(--muted);font-size:13px;line-height:1.5}
.sugg .empty small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl[hidden]{display:none}
.ctl > span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ddbtn{display:none}
.ctl.off{opacity:.42}
.ctl.off .seg button{cursor:not-allowed}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 9px;border-radius:6px;font-size:13px;color:var(--fg2);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg .pal{display:inline-flex;gap:1px;margin-right:6px;vertical-align:-1px}
.seg .pal b{width:6px;height:11px;display:block}
.seg .pal b:first-child{border-radius:2px 0 0 2px} .seg .pal b:last-child{border-radius:0 2px 2px 0}
.setbtn{display:none;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg2);font-size:13px;white-space:nowrap}
.setbtn svg{width:16px;height:16px;color:var(--muted);flex:none}
.setbtn:hover{color:var(--fg);border-color:var(--line2)}
.setbtn[aria-expanded="true"]{color:var(--amber);border-color:rgba(255,181,71,.45);background:var(--amber-soft)}
.setbtn[aria-expanded="true"] svg{color:var(--amber)}
.ctls-hd{display:none}
#extras-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
#extras-tools:empty{display:none}
.scrim2{display:none}
/* wide desktop: every control in one row; 색 기준 and 순매수 기간 open as small popovers; palette names from 1800px */
@media (min-width:1280px){
  .ctls{display:contents}
  .seg button{padding:5px 8px}
  .seg[data-key="palette"] button{padding:5px 7px}
  .seg[data-key="palette"] .pl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .seg[data-key="palette"] .pal{margin-right:0}
  .wide-hide{display:none}
  .ctl[data-ctl="colorBy"].off{display:none}
  .ctl.dd{position:relative}
  .ddbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px 0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:13px;white-space:nowrap}
  .ddbtn svg{width:12px;height:12px;color:var(--muted);flex:none}
  .ddbtn:hover{border-color:var(--line2)}
  .ddbtn[aria-expanded="true"]{border-color:rgba(255,181,71,.5)}
  .ctl.dd > .seg{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:75;flex-direction:column;min-width:128px;padding:4px;background:var(--panel2);border-color:var(--line2);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .ctl.dd.open > .seg{display:flex}
  .ctl.dd > .seg button{text-align:left;padding:8px 11px}
  .ctl.dd > .seg button[aria-pressed="true"]{color:var(--amber);box-shadow:none}
}
@media (min-width:1600px){ .tools{gap:16px} }
@media (min-width:1800px){
  .seg[data-key="palette"] .pl{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  .seg[data-key="palette"] .pal{margin-right:6px}
}
/* narrower screens: one "표시 설정" button opens the controls (popover on tablets, bottom sheet on phones) */
@media (max-width:1279px){
  .setbtn{display:inline-flex}
  .ctls{display:none;flex-direction:column;gap:13px}
  .ctls.open{display:flex}
  .ctls-hd{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:700}
  .ctls-hd .x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:19px;margin-right:-6px}
  .ctls-hd .x:hover{background:rgba(255,255,255,.07);color:var(--fg)}
  .ctls .ctl{flex-direction:column;align-items:stretch;gap:6px}
  .ctls .seg{flex-wrap:wrap}
  .ctls .seg button{flex:1 1 auto}
  .ctls .seg[data-key="palette"]{display:grid;grid-template-columns:1fr 1fr}
}
@media (min-width:761px) and (max-width:1279px){
  .ctls{position:absolute;z-index:70;top:42px;width:410px;max-width:calc(100vw - 36px);background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px 15px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .ctls .seg{background:var(--panel)}
}

/* ── Layout ───────────────────────────── */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:0 18px 14px;flex:1;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0}
.stagebar{display:flex;align-items:center;gap:12px;padding-bottom:6px;min-height:36px}
.crumbs{display:flex;align-items:center;gap:6px;min-height:30px;font-size:13.5px;flex-wrap:wrap;flex:1;min-width:0}
.viewseg button{padding:3px 10px;font-size:12.5px}
.crumbs button.c{color:var(--fg2);padding:3px 6px;border-radius:5px}
.crumbs button.c:hover{background:var(--panel2);color:var(--fg)}
.crumbs button.c.cur{color:var(--fg);font-weight:600;cursor:default;background:none}
.crumbs .sep{color:var(--faint)}
.crumbs .ci{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-width:0;max-width:100%}
.crumbs .ci .c{overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumbs .back{margin-right:4px;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--amber);border:1px solid rgba(255,181,71,.35);background:var(--amber-soft);padding:3px 9px;border-radius:6px;white-space:nowrap}
.crumbs .stat{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.crumbs .stat b{font-weight:600}
.crumbs .hint{color:var(--faint);font-size:12.5px;margin-left:8px}

.map{position:relative;background:#000;border-radius:6px;overflow:hidden;height:calc(100vh - 200px);min-height:520px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.node{position:absolute;overflow:hidden}
.map.anim .node{transition:opacity .3s,background-color .6s}
.node.entering{opacity:0}
.node.leaving{opacity:0!important;pointer-events:none}
.node.leaving .hd{pointer-events:none}
.sec,.ind{pointer-events:none}
.sec{z-index:1}
.ind{z-index:2}
.sec .hd,.ind .hd{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:0 5px;pointer-events:auto;cursor:zoom-in;white-space:nowrap;overflow:hidden;text-align:left;border-radius:0;width:100%}
.sec .hd:focus-visible,.ind .hd:focus-visible{outline-offset:-2px;z-index:5}
.sec .hd{background:#000;font-size:12px;font-weight:700;color:#f2f3f5}
.ind .hd{background:#0d0e11;font-size:10.5px;font-weight:500;color:#a6abb5}
.sec .hd .t,.ind .hd .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec .hd .v,.ind .hd .v{font-variant-numeric:tabular-nums;flex:none;font-weight:600}
.sec .hd:hover,.ind .hd:hover{color:#fff}
.sec .hd:hover .t,.ind .hd:hover .t{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--amber)}
.focus-leaf .ind .hd,.focus-leaf .sec .hd{cursor:default}
.focus-leaf .sec .hd:hover .t,.focus-leaf .ind .hd:hover .t{text-decoration:none}
.sec.hot{box-shadow:inset 0 0 0 2px var(--amber);z-index:4;pointer-events:none}
.tile{z-index:3;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.tile.nod{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.055) 0 3px,transparent 3px 8px)}
.tile.th:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;z-index:6}
.tile .lab{display:flex;flex-direction:column;align-items:center;max-width:100%;padding:0 3px;line-height:1.08;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tile .lab[hidden]{display:none}
.tile .nm{font-weight:600;white-space:nowrap;letter-spacing:-.02em;max-width:100%}
.tile .nm.ell{overflow:hidden;text-overflow:ellipsis}
.tile .pc{font-size:.74em;font-weight:500;margin-top:.12em;font-variant-numeric:tabular-nums;opacity:.96}
.tile .px{font-size:.52em;font-weight:500;margin-top:.3em;opacity:.78;font-variant-numeric:tabular-nums}
.tile .pc[hidden],.tile .px[hidden]{display:none}
.tile .lim{position:absolute;left:2px;top:2px;font-size:10px;font-weight:700;line-height:14px;padding:0 3px;border-radius:3px;background:rgba(0,0,0,.62);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.tile .lim[hidden]{display:none}
.tile:hover,.tile.hov{box-shadow:inset 0 0 0 2px rgba(255,255,255,.92);z-index:5}
.tile.sel{box-shadow:inset 0 0 0 3px var(--amber),0 0 0 1px #000;z-index:6}
.tile.dim{filter:saturate(.25) brightness(.38)}
.map.anim .tile{transition:opacity .3s,background-color .6s,filter .2s}
.tile{transition:filter .2s}
.tile.flash-up::after,.tile.flash-dn::after{content:"";position:absolute;inset:0;pointer-events:none;animation:flash .9s ease-out}
.tile.flash-up::after{background:rgba(255,255,255,.38)}
.tile.flash-dn::after{background:rgba(0,0,0,.45)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tstar{position:absolute;z-index:7;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.tstar:hover{background:rgba(0,0,0,.85)}
.tstar[aria-pressed="true"]{color:var(--amber)}
.tstar[hidden]{display:none}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center;line-height:1.6}
.map-empty .we{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:340px}
.map-empty .we .big{font-size:30px;color:var(--amber);line-height:1}
.map-empty .we b{font-size:16px;color:var(--fg);font-weight:700}
.map-empty .we button{margin-top:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,181,71,.4);background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:600}

/* legend under the map */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-top:7px;min-height:29px;font-size:12px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend .k{color:var(--muted)}
.legend b{color:var(--fg2);font-weight:600}
.legend .grad{width:140px;height:8px;border-radius:2px;flex:none}
.legend .tk{font-variant-numeric:tabular-nums;color:var(--fg2)}
.legend .sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.legend .nodsw{background-color:var(--nodata);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--line2)}
.legend .rp{color:var(--amber);border:1px solid rgba(255,181,71,.4);background:var(--amber-soft);border-radius:5px;padding:1px 7px;font-weight:600}
.legend .note{color:var(--faint)}
.legend .right{margin-left:auto}

/* table view */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;height:calc(100vh - 200px);min-height:520px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{position:sticky;top:0;z-index:1;background:var(--panel2);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.list th button{display:block;width:100%;padding:9px 12px;font-size:inherit;font-weight:inherit;color:inherit;text-align:inherit;white-space:nowrap}
.list th button:hover{color:var(--fg)}
.list th button:focus-visible,.list tbody tr:focus-visible{outline-offset:-2px}
.list th:first-child,.list td:first-child,.list th:nth-child(2),.list td:nth-child(2){text-align:left}
.list th[aria-sort]{color:var(--fg)}
.list th[aria-sort="descending"]::after{content:" ▾"} .list th[aria-sort="ascending"]::after{content:" ▴"}
.list td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:rgba(255,255,255,.035)}
.list tbody tr.sel{background:var(--amber-soft)}
.list .nmcell{display:flex;align-items:center;gap:9px;font-weight:600}
.list .nmcell i{width:10px;height:10px;border-radius:2px;flex:none}
.list .nmcell i.nod{background-color:var(--nodata)!important;box-shadow:inset 0 0 0 1px var(--line2)}
.list .nmcell small{color:var(--faint);font-weight:400;font-size:11.5px}
.list .indc{color:var(--muted);font-size:12.5px}
.list .nd{color:var(--faint)}
.wbtn{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;margin:-4px -4px -4px -6px;border-radius:6px;font-size:15px;line-height:1;color:var(--faint)}
.wbtn:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.wbtn[aria-pressed="true"]{color:var(--amber)}
.limtag{display:inline-block;flex:none;font-size:11px;font-weight:700;line-height:16px;padding:0 5px;border-radius:4px;border:1px solid currentColor;font-variant-numeric:normal}

/* ── Side ───────────────────────────── */
.side{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:42px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card[hidden]{display:none}
.card h2{margin:0 0 10px;font-size:13.5px;font-weight:600;color:var(--fg);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h2 small{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wavg{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.wavg b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.wavg span{font-size:12.5px;color:var(--muted)}
.breadth{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:transparent}
.breadth i{display:block;height:100%}
.breadth-lab{display:flex;justify-content:space-between;font-size:12.5px;margin-top:7px;font-variant-numeric:tabular-nums;gap:6px}
.hist{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;align-items:end;height:86px;margin-top:16px}
.hist button{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border-radius:3px}
.hist button .bar{display:block;border-radius:3px 3px 1px 1px;min-height:2px;transition:opacity .15s}
.hist button .cnt{font-size:10.5px;color:var(--fg2);text-align:center;margin-bottom:3px;font-variant-numeric:tabular-nums}
.hist.has-sel button:not([aria-pressed="true"]) .bar{opacity:.28}
.hist button[aria-pressed="true"] .cnt{color:var(--amber);font-weight:600}
.hist button:hover .bar{opacity:1!important;filter:brightness(1.15)}
.hist-axis{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;font-size:10.5px;color:var(--muted);margin-top:5px;text-align:center;font-variant-numeric:tabular-nums}
.hist-axis span{white-space:nowrap;overflow:visible}
.hist-note{font-size:11.5px;color:var(--faint);margin-top:8px}
.secs{display:flex;flex-direction:column;gap:1px}
.secs button{display:grid;grid-template-columns:minmax(0,1fr) 92px 58px;align-items:center;gap:8px;padding:6px 6px;margin:0 -6px;border-radius:6px;font-size:13px;text-align:left}
.secs.wide button{grid-template-columns:minmax(0,1fr) 70px 70px}
.secs button:hover{background:rgba(255,255,255,.045)}
.secs button.cur{background:var(--amber-soft)}
.secs .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secs .nm small{color:var(--faint);font-size:11px;margin-left:4px}
.secs .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.secs .rank-h{font-size:11.5px;color:var(--muted);margin:2px 0 3px}
.secs .rank-h + button{margin-top:0}
.secs .rank-h.second{margin-top:10px}
.secs .none{font-size:12.5px;color:var(--faint);padding:4px 0}
.dbar{position:relative;height:10px}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.dbar i{position:absolute;top:1px;height:8px;border-radius:2px}
.movers-tabs{display:flex;gap:2px;margin-bottom:8px}
.movers-tabs button{font-size:12.5px;padding:4px 9px;border-radius:6px;color:var(--muted)}
.movers-tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.movers{display:flex;flex-direction:column;gap:1px}
.movers button{display:grid;grid-template-columns:10px minmax(0,1fr) auto 66px;gap:9px;align-items:center;padding:6px;margin:0 -6px;border-radius:6px;font-size:13px;text-align:left}
.movers.amt button{grid-template-columns:10px minmax(0,1fr) auto 76px}
.movers button:hover{background:rgba(255,255,255,.045)}
.movers i{width:10px;height:10px;border-radius:2px}
.movers .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.movers .px{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.movers .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.movers .none{font-size:12.5px;color:var(--faint);padding:4px 0}

footer{padding:4px 18px 18px;font-size:12px;color:var(--faint);line-height:1.6}
footer p{margin:0;max-width:92ch}
footer a{color:var(--muted)}

/* ── Tooltip & detail ───────────────────────────── */
.tip{position:fixed;z-index:80;pointer-events:none;width:300px;background:rgba(24,25,30,.97);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;backdrop-filter:blur(6px)}
.tip.show{opacity:1;transform:none}
.card-head{padding:11px 13px 10px;border-bottom:1px solid var(--line)}
.card-head .path{font-size:11.5px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .nmrow{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.card-head .nmrow b,.card-head .nmrow .nmbtn{font-size:17px;font-weight:700;letter-spacing:-.02em;text-align:left}
.card-head .nmrow .nmbtn{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px;border-radius:4px}
.card-head .nmrow small{color:var(--faint);font-size:11.5px}
.card-head .nmrow .wmark{color:var(--amber);font-size:12px;font-weight:600}
.card-head .nmrow .limtag{align-self:center}
.card-head .px{display:flex;align-items:baseline;gap:9px;margin-top:4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.card-head .px b{font-size:21px;font-weight:700;letter-spacing:-.01em}
.card-head .px span{font-weight:600;font-size:13.5px}
.card-head .mrow{display:flex;align-items:baseline;gap:8px;margin-top:5px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.card-head .mrow b{font-size:14px;font-weight:700}
.card-head .meta{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.card-head .meta em{font-style:normal;color:var(--fg2)}
.wstar{display:inline-grid;place-items:center;align-self:center;width:30px;height:30px;margin:-6px 0 -6px 0;border-radius:7px;color:var(--muted);font-size:18px;line-height:1}
.wstar:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.wstar[aria-pressed="true"]{color:var(--amber)}
.peers{padding:7px 7px 8px}
.peers .ttl{font-size:11.5px;color:var(--muted);padding:2px 6px 5px}
.peer{display:grid;grid-template-columns:9px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;padding:3px 6px;border-radius:5px;font-size:12.5px}
.peers.amt .peer{grid-template-columns:9px minmax(0,1fr) 60px 70px}
.peer.me{background:rgba(255,255,255,.07);font-weight:600}
.peer i{width:9px;height:9px;border-radius:2px}
.peer .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.peer .dbar{height:8px}
.peer .dbar i{height:6px;top:1px}
.tiphint{padding:6px 13px 9px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line)}

.sheet{position:fixed;z-index:90;right:18px;bottom:18px;width:340px;max-height:min(640px,calc(100vh - 36px));overflow:auto;background:rgba(24,25,30,.98);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:none;font-size:13px}
.sheet.open{display:block;animation:sheetIn .2s ease-out}
.sheet:focus{outline:none}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet .grab{display:none}
.sheet .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.sheet .x:hover{background:rgba(255,255,255,.07);color:var(--fg)}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 13px 13px;border-top:1px solid var(--line)}
.sheet .acts button,.sheet .acts a{flex:1;display:inline-flex;justify-content:center;align-items:center;height:36px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none}
.sheet .acts .pri{background:var(--amber);color:#1b1404;flex:1 1 100%}
.sheet .acts .sec2{border:1px solid var(--line2);color:var(--fg)}
.spark{padding:8px 13px 0}
.spark svg{display:block;width:100%;height:70px}
.spark .note{font-size:11.5px;color:var(--faint);padding:2px 0 6px}

.scrim{display:none}

@media (max-width: 980px){
  .layout{grid-template-columns:1fr}
  .side{padding-top:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (max-width: 760px){
  .top{padding:12px 12px 8px;gap:10px 12px}
  .brand{font-size:16px}
  .idx{order:3;width:100%;margin-left:0;gap:14px;font-size:12.5px}
  .status{order:2;margin-left:auto}
  .status .txt{display:none}
  .tabs{order:4;width:100%}
  .tabs button{flex:1;padding:6px 2px;font-size:13.5px}
  .tabs .tsep{display:none}
  .tools{padding:0 12px 8px;gap:8px}
  .search{flex:1 1 0;min-width:0}
  .search kbd{display:none}
  .setbtn{height:40px;padding:0 12px}
  .ctls{position:fixed;left:0;right:0;bottom:0;z-index:91;max-height:82svh;overflow:auto;background:rgba(24,25,30,.99);border-top:1px solid var(--line2);border-radius:16px 16px 0 0;box-shadow:0 -18px 60px rgba(0,0,0,.6);padding:8px 16px calc(18px + env(safe-area-inset-bottom))}
  .ctls-hd{min-height:44px}
  .ctls-hd .x{width:40px;height:40px}
  .scrim2.open{display:block;position:fixed;inset:0;z-index:89;background:rgba(0,0,0,.45)}
  .layout{padding:0 12px 12px;gap:12px}
  .crumbs .stat{margin-left:0;width:100%;order:9}
  .crumbs .hint{display:none}
  .map,.tablewrap{height:72svh;min-height:440px}
  .legend{gap:6px 14px}
  .legend .right{margin-left:0}
  .side{display:flex}
  .tip{display:none}
  .tstar{display:none}
  .sheet{left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;max-height:78svh;padding-bottom:env(safe-area-inset-bottom)}
  .sheet .grab{display:block;width:38px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
  .scrim.open{display:block;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.45)}
  footer{padding:4px 12px 24px}
  .tabs button,.seg button,.movers-tabs button,.crumbs button.c,.crumbs .back{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .crumbs .back{padding:3px 12px}
  .secs button,.movers button{min-height:40px}
  .sheet .x{width:40px;height:40px;right:6px;top:6px}
  .wstar{width:40px;height:40px;margin:-10px -4px -10px -4px}
  .list th:nth-child(2),.list td:nth-child(2){display:none}
  .list.x7 th:nth-child(7),.list.x7 td:nth-child(7){display:none}
  .list.th5 th:nth-child(5),.list.th5 td:nth-child(5){display:none}
  table.list{font-size:12.5px}
  .list th{font-size:12px}
  .list th button{min-height:40px;padding:0 6px}
  .list td{padding:10px 6px}
  .list .nmcell{gap:6px}
  .list .nmcell small{display:none}
  .list td:first-child{width:100%;max-width:0}
  .list .nmt{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .wbtn{width:32px;height:40px;margin:-10px -4px -10px -4px}
}
@media (prefers-reduced-motion: reduce){
  .map.anim .node,.map.anim .tile{transition:none}
  .status.live .dot{animation:none}
  .tile.flash-up::after,.tile.flash-dn::after{animation:none}
  .sheet.open{animation:none}
  .tip{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i aria-hidden="true"><b style="background:#ef3e4a"></b><b style="background:#1f5a41"></b><b style="background:#383c46"></b><b style="background:#12a15b"></b></i>한국 증시 히트맵</div>
  <div class="tabs" role="group" aria-label="시장">
    <button data-mkt="K">코스피</button>
    <button data-mkt="Q">코스닥</button>
    <button data-mkt="ALL">전체</button>
    <span class="tsep" aria-hidden="true"></span>
    <button data-mkt="THEME">테마</button>
    <button data-mkt="WATCH" aria-label="관심종목"><span class="st" aria-hidden="true">★</span>관심</button>
  </div>
  <div class="idx" id="idx"></div>
  <div class="status" id="status"><span class="dot"></span><span class="txt"></span><span class="badge"></span></div>
</header>
<div id="strip"></div>

<div class="tools">
  <div class="search">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="6"/><path d="m13 13 4.5 4.5" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="종목명·코드 검색" autocomplete="off" spellcheck="false" aria-label="종목 검색" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false">
    <kbd>/</kbd>
    <div class="sugg" id="sugg" role="listbox"></div>
  </div>
  <button type="button" class="setbtn" id="setBtn" aria-expanded="false" aria-controls="ctls"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 6h8M15.5 6h1M3.5 14h1M8.5 14h8"/><circle cx="13.5" cy="6" r="2"/><circle cx="6.5" cy="14" r="2"/></svg>표시 설정</button>
  <div class="ctls" id="ctls" role="group" aria-label="표시 설정">
    <div class="ctls-hd"><span>표시 설정</span><button type="button" class="x" id="ctlsX" aria-label="표시 설정 닫기">×</button></div>
    <div class="ctl" data-ctl="sizeBy"><span>크기</span><div class="seg" data-key="sizeBy"><button data-v="cap">시가총액</button><button data-v="tv">거래대금</button><button data-v="fgn" title="외국인 순매수 금액" aria-label="외국인 순매수">외국인</button><button data-v="inst" title="기관 순매수 금액" aria-label="기관 순매수">기관</button></div></div>
    <div class="ctl dd" data-ctl="flowWin" hidden><span><span class="wide-hide">순매수 </span>기간</span><button type="button" class="ddbtn" aria-expanded="false" aria-haspopup="true" aria-label="순매수 기간 고르기"><span class="ddv"></span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button><div class="seg" data-key="flowWin" role="group" aria-label="순매수 기간"><button data-v="1">1일</button><button data-v="5">5일</button><button data-v="20">20일</button></div></div>
    <div class="ctl dd" data-ctl="colorBy"><span>색 기준</span><button type="button" class="ddbtn" aria-expanded="false" aria-haspopup="true" aria-label="색 기준 고르기"><span class="ddv"></span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button><div class="seg" data-key="colorBy" role="group" aria-label="색 기준"><button data-v="r" title="오늘 등락률">오늘</button><button data-v="w1" title="1주 수익률">1주</button><button data-v="m1" title="1개월 수익률">1개월</button><button data-v="m3" title="3개월 수익률">3개월</button><button data-v="ytd" title="올해 수익률 (작년 마지막 거래일 종가 대비)">올해</button><button data-v="y1" title="1년 수익률">1년</button></div></div>
    <div class="ctl" data-ctl="topN"><span>종목 수</span><div class="seg" data-key="topN"><button data-v="100">100</button><button data-v="200">200</button><button data-v="300">300</button><button data-v="500">500</button></div></div>
    <div class="ctl" data-ctl="range"><span>색 범위</span><div class="seg" data-key="range" id="rangeseg"></div></div>
    <div class="ctl" data-ctl="palette"><span>색상</span><div class="seg" data-key="palette" id="palseg"></div></div>
  </div>
  <div id="extras-tools"></div>
</div>
<div class="scrim2" id="scrim2"></div>

<main class="layout">
  <section class="stage">
    <div class="stagebar">
      <nav class="crumbs" id="crumbs" aria-label="위치"></nav>
      <div class="seg viewseg" data-key="view" role="group" aria-label="보기"><button data-v="map">지도</button><button data-v="table">표</button></div>
    </div>
    <div class="map" id="map" role="group" aria-label="종목별 등락률 트리맵"></div>
    <div class="tablewrap" id="tablewrap" hidden></div>
    <div class="legend" id="legend" aria-live="polite"></div>
  </section>
  <aside class="side">
    <section class="card">
      <h2><span id="distTitle">등락 분포</span> <small id="breadthScope"></small></h2>
      <div class="wavg"><b id="wavg">—</b><span id="wavgLab">시가총액 가중 등락률</span></div>
      <div class="breadth" id="breadth"></div>
      <div class="breadth-lab" id="breadthLab"></div>
      <div class="hist" id="hist"></div>
      <div class="hist-axis" id="histAxis"></div>
      <div class="hist-note" id="histNote">막대를 누르면 그 구간 종목만 지도에서 강조돼요.</div>
    </section>
    <section class="card">
      <h2><span id="secTitle">섹터별 등락</span> <small id="secSub">누르면 확대</small></h2>
      <div class="secs" id="secs"></div>
    </section>
    <section class="card" id="moverCard">
      <h2>눈에 띄는 종목</h2>
      <div class="movers-tabs" id="moverTabs"><button data-v="up">상승률</button><button data-v="dn">하락률</button><button data-v="tv">거래대금</button></div>
      <div class="movers" id="movers"></div>
    </section>
  </aside>
</main>

<footer id="foot"></footer>

<div class="tip" id="tip" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="종목 상세" tabindex="-1"></div>

<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
(() => {
'use strict';

/* ───────────────── window.KH: what the other modules may use ─────────────────
   Contract: AGENTS.md §3 and §3-2. Keep these names and meanings stable.
   §3   MODE 'snapshot'|'live', LIVE_URL, MKT_NAME, stock(code) → live row (main stream, or a row fetched for a theme/관심종목 view) | null,
        stocks() → main-stream rows, asOf(), colorOf(r) → colour for today's % (today's colour range), palette(), fmt.{pct,int,chg,eok,cls}, h().
        events on document: 'kh:data' after quotes change, 'kh:palette' after palette or colour-range change.
   §3-2 loadData(name)   name 'themes'|'periods'|'flows' → Promise<JSON|null>. Snapshot: <script id="kh-data-NAME"> (waits for the DOM);
                         live: GET data/NAME.json. Memoised per name; a failed load is forgotten so the next call retries.
        watch            {has(code), toggle(code) → bool (new state), list() → codes} — localStorage 'khm.watch' (JSON array).
                         Every change fires 'kh:watch' {detail:{code, on, list}} on document (also when another tab changes it).
        layout()         → the map as drawn now: [{kind:'sector'|'ind'|'tile', x, y, w, h, color, label, sub, code?, hd?}] in map pixels
                         (sector/ind: label = group name or '' when its header is hidden, sub = its value text as shown, hd = header
                         height; tile: label = full stock or theme name, sub = the value text as shown, code = stock code (absent on
                         theme tiles), color = fill). [] while the table view is shown.
        setReplay(frame) frame {t:'HHMM', date?, prices: Map(code → {p, r})} (a plain object of code → {p, r} also works).
                         Overrides p/r per code for colours, labels, tooltips, table and side panels; tile size by market cap follows
                         cap × p_frame / p_now; codes missing from the frame keep their live values; sector / industry headers follow
                         the frame. Shows "리플레이 HH:MM" in the status badge and legend. The overlay survives live polls and
                         re-renders until setReplay(null), which restores live data.
        events           'kh:render' {detail:{view, market, theme, replay}} after every map/table render.
        mount points     <div id="strip"> under the header, <div id="extras-tools"> at the end of the toolbar.
        index()          → {KOSPI:{value,change,ratio}, KOSDAQ:…} from the current quotes.
        market()         → the current view: 'K'|'Q'|'ALL'|'theme'|'watch'. */

/* ───────────────── config ───────────────── */
const MODE = document.documentElement.dataset.mode === 'live' ? 'live' : 'snapshot';
const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const MKT_NAME = { K: '코스피', Q: '코스닥', ALL: '전체', THEME: '테마', WATCH: '관심종목' };
const HASH_TO = { kospi: 'K', kosdaq: 'Q', all: 'ALL', theme: 'THEME', watch: 'WATCH' };
const TO_HASH = { K: 'kospi', Q: 'kosdaq', ALL: 'all', THEME: 'theme', WATCH: 'watch' };
function parseHash(hsh) {
  const m = /^theme-(\d{1,7})$/.exec(hsh);
  if (m) return { m: 'THEME', theme: +m[1] };
  return HASH_TO[hsh] ? { m: HASH_TO[hsh], theme: null } : null;
}
const PALETTES = {
  // stops run from −range … 0 … +range
  krg:    { label: '빨강 상승', stops: ['#12a15b', '#15814b', '#1f5a41', '#383c46', '#74303c', '#b8343f', '#ef3e4a'], upText: '#ff5c66', dnText: '#2fd67a' },
  krb:    { label: 'HTS 색',   stops: ['#2f74e6', '#2e5bb0', '#2f4677', '#383c46', '#74303c', '#b8343f', '#ef3e4a'], upText: '#ff5c66', dnText: '#5b9bff' },
  global: { label: '초록 상승', stops: ['#f63538', '#bf4045', '#8b444e', '#414554', '#35764e', '#2f9e4f', '#2bb553'], upText: '#4fd27a', dnText: '#ff6b6e' },
  cvd:    { label: '색각 친화', stops: ['#ef8a1f', '#b8692a', '#7d5940', '#414554', '#3a5f86', '#3878c0', '#3d95ee'], upText: '#69b4ff', dnText: '#ffa046' },
};
// colour metric: today's change, or the return since a base close in periods.json (c[code][ix])

  const id = ++sparkReq;
  const box = () => document.getElementById('spark');
  try {
    const res = await fetch(`api/chart/${encodeURIComponent(st.c)}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    if (id !== sparkReq || !box()) return;
    const pts = (j.points || []).filter(p => p && isFinite(p[1]));

/* ───────────────── live mode ───────────────── */
async function poll() {
  let open = false;
  const ac = new AbortController();
  const killer = setTimeout(() => ac.abort(), 8000);   // a stalled request must not stop the polling loop
  try {
    const res = await fetch('api/quotes', { cache: 'no-store', signal: ac.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    if (!raw || !Array.isArray(raw.stocks) || !raw.stocks.length) throw new Error('empty');
    const changed = setData(raw);
    liveState.ok = true; liveState.last = new Date();
    open = marketOpen();
    render({ animate: !REPLAY }); renderSide(); renderCrumbs(); renderHeader(); renderLegend();
    if (!reduceMotion && !REPLAY && state.market !== 'THEME') for (const [c, dir] of changed) {
      const el = nodes.get('T|' + c);
      if (!el) continue;
      el.classList.remove('flash-up', 'flash-dn'); void el.offsetWidth;
      el.classList.add(dir > 0 ? 'flash-up' : 'flash-dn');
      setTimeout(() => el.classList.remove('flash-up', 'flash-dn'), 950);
    }
    if (state.hover && tip.classList.contains('show') && !String(state.hover).startsWith('#')) { const st = get(state.hover); if (st) fillTip(st); }
    if (extraWanted().length && !EXTRA.size) pollExtra();
  } catch (e) {
    liveState.ok = false;
    try { if (!DATA.stocks.length) render(); } catch (e2) {}
  } finally {
    clearTimeout(killer);
    try { renderStatus(); } catch (e3) {}
    clearTimeout(liveState.timer);
    liveState.timer = setTimeout(poll, !liveState.ok ? 15000 : open ? 10000 : 60000);
  }
}
// quotes for theme members / watched codes outside the main stream (≤300 per call), every 10 s while that map is shown
const extra = { timer: null, busy: false, ok: true, seq: 0 };
function extraWanted() {
  if (MODE !== 'live') return [];
  let codes = [];
  if (state.market === 'THEME' && curTheme()) codes = curTheme().codes.slice(0, MAX_CODES);
  else if (state.market === 'WATCH') codes = WATCH.slice(0, MAX_CODES);
  return codes.filter(c => CODE_RE.test(c) && !DATA.byCode.has(c));
}
async function pollExtra() {
  clearTimeout(extra.timer);
  const want = extraWanted();
  if (!want.length || document.hidden) { extra.busy = false; return; }
  const seq = ++extra.seq;
  const firstTime = want.some(c => !EXTRA.has(c));
  extra.busy = firstTime;
  if (firstTime) { render(); renderCrumbs(); }
  const ac = new AbortController();
  const killer = setTimeout(() => ac.abort(), 8000);
  try {
    const res = await fetch('api/quotes?codes=' + want.join(','), { cache: 'no-store', signal: ac.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    if (seq !== extra.seq) return;
    for (const x of (raw && raw.stocks) || []) if (x && x.c) EXTRA.set(String(x.c), norm(x));
    extra.ok = true;
  } catch (e) {
    if (seq !== extra.seq) return;
    extra.ok = false;
  } finally {
    clearTimeout(killer);
    if (seq === extra.seq) {
      extra.busy = false;
      bump();
      render(); renderCrumbs(); renderSide(); renderLegend();
      if (state.hover && tip.classList.contains('show') && !String(state.hover).startsWith('#')) { const st = get(state.hover); if (st) fillTip(st); }
      extra.timer = setTimeout(pollExtra, !extra.ok ? 15000 : (marketOpen() || DATA.afterHours) ? 10000 : 60000);
    }
  }
}
// theme change rates (Naver's theme list) every 30 s while the theme tab is shown
const themesLive = { timer: null, ok: true };
async function pollThemes() {
  clearTimeout(themesLive.timer);
  if (MODE !== 'live' || state.market !== 'THEME' || document.hidden) return;
  const ac = new AbortController();
  const killer = setTimeout(() => ac.abort(), 8000);
  try {
    const res = await fetch('api/themes', { cache: 'no-store', signal: ac.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j || !Array.isArray(j.themes)) throw new Error('shape');
    THEME_LIVE = { ver: (THEME_LIVE ? THEME_LIVE.ver : 0) + 1, asOf: j.asOf, map: new Map(j.themes.map(t => [+t.id, { ratio: t.ratio == null ? null : +t.ratio, up: t.up, flat: t.flat, down: t.down }])) };
    themesLive.ok = true;
  } catch (e) { themesLive.ok = false; }
  finally {
    clearTimeout(killer);
    if (state.market === 'THEME') { render(); renderCrumbs(); renderSide(); renderLegend(); }
    themesLive.timer = setTimeout(pollThemes, themesLive.ok ? 30000 : 15000);
  }
}
function syncPollers() {
  if (MODE !== 'live') return;
  if (state.market === 'THEME') { if (!themesLive.timer || !THEME_LIVE) pollThemes(); }
  else { clearTimeout(themesLive.timer); themesLive.timer = null; }
  if (extraWanted().length) pollExtra(); else { clearTimeout(extra.timer); extra.seq++; extra.busy = false; }
}
document.addEventListener('visibilitychange', () => {
  if (MODE !== 'live' || document.hidden) return;
  clearTimeout(liveState.timer); poll();
  if (state.market === 'THEME') pollThemes();
  if (extraWanted().length) pollExtra();
});

/* ───────────────── replay (src/extras drives it) ───────────────── */
function setReplay(frame) {
  let next = null;
  if (frame && frame.prices) {
    const pr = frame.prices instanceof Map ? frame.prices : new Map(Object.entries(frame.prices));
    next = { t: frame.t == null ? '' : String(frame.t), date: frame.date || null, prices: pr };
  }
  REPLAY = next;
  bump();
  if (sheet.classList.contains('open') && REPLAY) closeSheet({ restore: false });
  render(); renderSide(); renderCrumbs(); renderStatus(); renderLegend(); renderFooter();
  if (state.hover && tip.classList.contains('show')) {
    if (String(state.hover).startsWith('#')) { const t = themeRow(+state.hover.slice(1)); if (t) fillThemeTip(t); }
    else { const st = get(state.hover); if (st) fillTip(st); }
  }
}
// the map as drawn now (for saving it as an image)
function khLayout() {
  if (state.view !== 'map') return [];
  const out = [];
  for (const el of nodes.values()) {
    if (!el.__g || el.classList.contains('leaving')) continue;
    const [x, y, w, hh] = el.__g;
    if (el.classList.contains('tile')) {
      const t = { kind: 'tile', x, y, w, h: hh, color: el.__col || NODATA, label: el.__name || '', sub: el.__sub || '' };
      if (el.dataset.c) t.code = el.dataset.c;
      out.push(t);
    } else {
      const sec = el.classList.contains('sec'), hd = el.firstChild, H = el.__hd || 0;
      out.push({ kind: sec ? 'sector' : 'ind', x, y, w, h: hh, color: sec ? '#000' : '#0d0e11', label: H ? hd.children[0].textContent : '', sub: H ? hd.children[1].textContent : '', hd: H });
    }
  }
  const order = { sector: 0, ind: 1, tile: 2 };
  return out.sort((a, b) => order[a.kind] - order[b.kind]);
}

/* ───────────────── API for the other modules (see the contract block at the top) ───────────────── */
window.KH = {
  MODE,
  LIVE_URL: 'https://kospimap.pages.dev/',
  MKT_NAME,
  stock: code => (DATA && rawGet(String(code))) || null,
  stocks: () => (DATA ? DATA.stocks : []),
  asOf: () => (DATA ? DATA.asOf : null),
  colorOf: r => dayColor(r),
  palette: () => { const p = PALETTES[state.palette]; return { key: state.palette, label: p.label, stops: p.stops.slice(), up: p.stops[6], down: p.stops[0], flat: p.stops[3], upText: p.upText, dnText: p.dnText }; },
  fmt: { pct: fmtPct, int: fmtInt, chg: fmtChg, eok: fmtEok, cls },
  h,
  loadData,
  watch: watchApi,
  layout: khLayout,
  setReplay,
  index: () => (DATA ? DATA.index : null),
  market: () => (state.market === 'THEME' ? 'theme' : state.market === 'WATCH' ? 'watch' : state.market),
};

/* ───────────────── boot ───────────────── */
rebuildColor();
buildPaletteSeg();
trimControlsForMode();
syncControls();
needForMetric();
fitMapHeight();
renderHeader();
renderStatus();
renderFooter();
render();
renderCrumbs();
renderSide();
renderLegend();
if (MODE === 'live') { poll(); syncPollers(); }
})();
</script>
