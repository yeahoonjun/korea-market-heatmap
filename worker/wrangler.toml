name = "korea-market-heatmap"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Workers Paid plan (2026-11-10). Each /api/quotes cache miss makes 2 subrequests (one batch quote call for
# 600 stocks + one index call); /api/quotes?scope=all makes 4 (three parallel quote calls for ~2,700 stocks + index).
# The edge cache absorbs repeat hits for 8 seconds.

# Intraday replay recorder: scheduled() appends one frame per minute (09:00 to session end) to KV key replay:YYYYMMDD:HHMM; no list() calls.
[[kv_namespaces]]
binding = "REPLAY"
id = "bfdaeef6e5204d0ba223a568f76d3c85"

[triggers]
crons = ["* 0-7 * * MON-FRI"]   # Cloudflare counts weekdays 1 = Sunday … 7 = Saturday: write names, not numbers
