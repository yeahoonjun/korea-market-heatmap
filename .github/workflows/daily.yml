name: daily-data

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST, Mon-Fri: everything (after the 16:30 end on 수능 day / first trading day; the check step also waits for the real endTime)
    - cron: "30 12 * * 1-5"  # 21:30 KST: investor flows again (Naver publishes the day's row in the evening)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests   # build_snapshot.py needs it; build_daily.py is stdlib only

      - name: KRX trading day?
        id: day
        run: |
          if python3 scripts/build_daily.py --check-trading-day --wait-session-end; then
            echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            echo "trading=false" >> "$GITHUB_OUTPUT"
            echo "No KRX trading today - skipping."
          fi

      # .cache/ only lives for this run (KRX closes are reused between the steps below, never across runs)
      - name: Snapshot
        if: steps.day.outputs.trading == 'true' && github.event.schedule != '30 12 * * 1-5'
        run: python3 scripts/build_snapshot.py --close auto --delay 0.1

      - name: Themes, periods, flows
        if: steps.day.outputs.trading == 'true' && github.event.schedule != '30 12 * * 1-5'
        run: python3 scripts/build_daily.py

      - name: Flows only (evening run)
        if: steps.day.outputs.trading == 'true' && github.event.schedule == '30 12 * * 1-5'
        run: python3 scripts/build_daily.py --only flows

      # §3-20: the snapshot's header line needs the day's index spark — the live Worker's market strip, taken after the close
      - name: Market strip for the snapshot
        if: steps.day.outputs.trading == 'true' && github.event.schedule != '30 12 * * 1-5'
        run: |
          if curl -fsS --retry 3 --max-time 20 https://kospimap.pages.dev/api/market -o /tmp/market.json \
             && python3 -c "import json,sys; d=json.load(open('/tmp/market.json')); sys.exit(0 if d else 1)"; then
            mv /tmp/market.json web/market.json
          else
            echo "market.json skipped (Worker unreachable) - the snapshot keeps the previous file or hides the line."
          fi

      - name: Validate
        if: steps.day.outputs.trading == 'true'
        run: python3 scripts/validate_daily.py

      - name: Build pages
        if: steps.day.outputs.trading == 'true'
        run: python3 scripts/build_page.py

      - name: Commit and push
        if: steps.day.outputs.trading == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web dist
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "data: daily refresh $(TZ=Asia/Seoul date +%F)"
          # All of data/ web/ dist/ is this job's own output, so on a rebase conflict our (job) side wins.
          # During `git rebase` "theirs" is the commit being replayed = our regenerated files.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              echo "::warning::rebase conflict (attempt $attempt) - taking the job's generated files"
              # conflicts that -X theirs cannot settle (modify/delete etc.): generated paths -> ours-of-job
              git diff --name-only --diff-filter=U | while read -r f; do
                case "$f" in
                  data/*|web/*|dist/*) git checkout --theirs -- "$f" 2>/dev/null && git add -- "$f" || git rm -q -- "$f" ;;
                esac
              done
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::unresolved conflicts outside generated files:"; git diff --name-only --diff-filter=U
                git rebase --abort || true
                exit 1
              fi
              GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; echo "::error::rebase failed"; exit 1; }
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1
