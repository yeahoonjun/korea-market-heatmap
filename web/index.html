/* ───────────────── summary ───────────────── */
async function loadSummary(quiet) {
  const g = S.gen;
  clearTimeout(S.timers.sum);
  try {
    const j = await api('summary', 'sum');
    if (g !== S.gen) return;
    S.sum = j; S.sumErr = null;
  } catch (e) {
    if (aborted(e) || g !== S.gen) return;
    if (!quiet || !S.sum) S.sumErr = e;
  }
  const before = S.phase;
  S.phase = phaseOf(S.sum);
  root.classList.toggle('sp-nf', !!(S.sumErr && S.sumErr.status === 404 && !KH.stock(S.code)));
  renderHead(); renderMeta(); renderStats(); renderPeers();
  syncChartRef();
  if (before !== S.phase) scheduleIntraday();
  for (const t of TABS) if (t.summary) t.summary(before !== S.phase);
  scheduleSummary();
}
function scheduleSummary() {
  clearTimeout(S.timers.sum);
  if (LIVE && S.open && document.visibilityState === 'visible' && (PHASE[S.phase] || {}).live) S.timers.sum = setTimeout(() => loadSummary(true), SUMMARY_MS);
}

/* ───────────────── chart ───────────────── */
let lwcPromise = null;
function loadLWC() {
  if (window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  if (lwcPromise) return lwcPromise;
  lwcPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = LWC_SRC; s.async = true; s.crossOrigin = 'anonymous'; s.integrity = LWC_SRI;
    s.onload = () => (window.LightweightCharts ? resolve(window.LightweightCharts) : reject(new Error('Lightweight Charts missing')));
    s.onerror = () => { s.remove(); lwcPromise = null; reject(new Error('Lightweight Charts load failed')); };
    document.head.append(s);
  });
  return lwcPromise;
}

const C = { chart: null, candles: null, vol: null, prevLine: null, bars: null, index: new Map(), tf: null, ref: null, cache: new Map() };
const timeKey = t => (t && typeof t === 'object' ? `${t.year}-${pad(t.month)}-${pad(t.day)}` : t);
function timeParts(t) {
  if (typeof t === 'number') { const d = new Date(t * 1000); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay(), hh: d.getUTCHours(), mm: d.getUTCMinutes() }; }
  const [y, m, d] = typeof t === 'string' ? t.split('-').map(Number) : [t.year, t.month, t.day];
  return { y, m, d, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay(), hh: 0, mm: 0 };
}
function timeLabel(t, tf) {
  const p = timeParts(t);
  switch (tf || C.tf) {
    case '1d': return `${p.m}월 ${p.d}일 ${pad(p.hh)}:${pad(p.mm)}`;
    case '5d': return `${p.m}월 ${p.d}일 (${WD[p.wd]}) ${pad(p.hh)}:${pad(p.mm)}`;
    case '3y': { const q = p.wd === 0 ? timeParts(new Date(Date.UTC(p.y, p.m - 1, p.d + 1)).toISOString().slice(0, 10)) : p; return `${q.y}.${pad(q.m)}.${pad(q.d)} 주`; }   // Naver weeks start on Sunday
    case '10y': return `${p.y}년 ${p.m}월`;
    default: return `${p.y}.${pad(p.m)}.${pad(p.d)} (${WD[p.wd]})`;
  }
}
function tickLabel(t, type) {
  const p = timeParts(t);
  if (type === 0) return `${p.y}년`;
  if (type === 1) return `${p.m}월`;
  if (type === 2) return `${p.m}/${p.d}`;
  return `${pad(p.hh)}:${pad(p.mm)}`;
}

async function ensureChart() {
  if (C.chart) return;
  const L = await loadLWC();
  if (C.chart) return;
  const font = getComputedStyle(document.body).fontFamily;
  const chart = L.createChart(R.chart, {
    autoSize: true,
    layout: { background: { type: L.ColorType.Solid, color: '#191a1f' }, textColor: '#8a8f99', fontSize: 11, fontFamily: font, attributionLogo: true,
      panes: { separatorColor: '#2b2d34', separatorHoverColor: 'rgba(255,255,255,.06)', enableResize: false } },
    grid: { vertLines: { color: 'rgba(255,255,255,.035)' }, horzLines: { color: 'rgba(255,255,255,.045)' } },
    crosshair: { mode: L.CrosshairMode.Normal,
      vertLine: { color: '#8a8f99', width: 1, style: L.LineStyle.Dashed, labelBackgroundColor: '#373a42' },
      horzLine: { color: '#8a8f99', width: 1, style: L.LineStyle.Dashed, labelBackgroundColor: '#373a42' } },
    rightPriceScale: { borderColor: '#2b2d34', scaleMargins: { top: 0.16, bottom: 0.06 } },
    timeScale: { borderColor: '#2b2d34', rightOffset: 2, fixLeftEdge: true, fixRightEdge: true, lockVisibleTimeRangeOnResize: true, tickMarkFormatter: tickLabel },
    localization: { locale: 'ko-KR', timeFormatter: t => timeLabel(t) },
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: false }, axisDoubleClickReset: true },
  });
  const P = KH.palette();
  const candles = chart.addSeries(L.CandlestickSeries, {
    upColor: P.up, downColor: P.down, wickUpColor: P.up, wickDownColor: P.down, borderVisible: false,
    priceFormat: { type: 'custom', formatter: p => F.int(Math.round(p)), minMove: 1 }, priceLineStyle: L.LineStyle.Dotted,
    autoscaleInfoProvider: base => {
      const r = base();
      if (r && C.ref != null) { r.priceRange.minValue = Math.min(r.priceRange.minValue, C.ref); r.priceRange.maxValue = Math.max(r.priceRange.maxValue, C.ref); }
      return r;
    },
  });
  const vol = chart.addSeries(L.HistogramSeries, { priceFormat: { type: 'custom', formatter: v => compact(v), minMove: 1 }, priceLineVisible: false, lastValueVisible: false,
    // opening and closing auctions dwarf the 1-minute bars; clip them so the rest stays readable (the legend shows the real number)
    autoscaleInfoProvider: base => { const r = base(); if (r && C.volCap) r.priceRange.maxValue = Math.min(r.priceRange.maxValue, C.volCap); return r; } }, 1);
  vol.priceScale().applyOptions({ scaleMargins: { top: 0.18, bottom: 0 } });
  const panes = chart.panes();
  panes[0].setStretchFactor(4);
  if (panes[1]) panes[1].setStretchFactor(1);
  new ResizeObserver(() => { cancelAnimationFrame(C.raf); C.raf = requestAnimationFrame(fitMargins); }).observe(R.chart);
  chart.subscribeCrosshairMove(param => {
    const i = param && param.point && param.time != null ? C.index.get(timeKey(param.time)) : undefined;
    renderLegend(i);
  });
  Object.assign(C, { chart, candles, vol, L });
}

function sanitize(raw, intraday) {
  const out = new Map();
  for (const b of raw || []) {
    if (!b || !isNum(b.c)) continue;
    const t = intraday ? (isNum(b.t) ? +b.t + KST : null) : (/^\d{4}-\d{2}-\d{2}$/.test(b.t) ? b.t : null);
    if (t == null) continue;
    const c = +b.c, o = isNum(b.o) && +b.o > 0 ? +b.o : c;
    const hi = Math.max(isNum(b.h) && +b.h > 0 ? +b.h : c, o, c), lo = Math.min(isNum(b.l) && +b.l > 0 ? +b.l : c, o, c);
    out.set(t, { time: t, o, h: hi, l: lo, c, v: isNum(b.v) ? +b.v : 0 });
  }
  return [...out.values()].sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
}
const FLAT = '#8a8f99';
function candleData(bars) { return bars.map(b => b.c === b.o ? { time: b.time, open: b.o, high: b.h, low: b.l, close: b.c, color: FLAT, wickColor: FLAT } : { time: b.time, open: b.o, high: b.h, low: b.l, close: b.c }); }
function volData(bars) {
  const P = KH.palette(), up = hexRgba(P.up, 0.55), dn = hexRgba(P.down, 0.55), fl = hexRgba(FLAT, 0.45);
  return bars.map(b => ({ time: b.time, value: b.v, color: b.c > b.o ? up : b.c < b.o ? dn : fl }));
}

function chartState(kind, err) {
  const m = R.chartMsg;
  m.className = 'sp-chartmsg';
  if (kind === 'ok') { m.replaceChildren(); return; }
  m.classList.add('on');
  if (kind === 'loading') {
    if (C.bars && C.bars.length) { m.classList.add('dim'); m.replaceChildren(h('span', { class: 'sp-loading-t', role: 'status', text: '불러오는 중…' })); }
    else { m.classList.add('skel'); m.replaceChildren(h('div', { class: 'sp-chart-skel', role: 'status', 'aria-label': '차트 불러오는 중' }, Array.from({ length: 28 }, (_, i) => h('i', { style: `height:${18 + Math.round(Math.abs(Math.sin(i * 1.7)) * 46)}%` })))); }
  } else if (kind === 'error') m.replaceChildren(msgBox('차트를 불러오지 못했어요.', errSub(err), () => loadChart(true)));
  else if (kind === 'lib') m.replaceChildren(msgBox('차트 도구를 불러오지 못했어요.', '네트워크 연결을 확인하고 다시 시도해 주세요.', () => loadChart(true)));
  else if (kind === 'empty') {
    const pre = (S.tf === '1d') && S.phase === 'pre';
    m.replaceChildren(msgBox(pre ? '오늘은 아직 거래가 없어요.' : '이 기간에는 거래 기록이 없어요.', pre ? '9시에 정규장이 열리면 차트가 그려져요.' : '다른 기간을 골라 보세요.'));
  }
}

async function loadChart(force) {
  const g = S.gen, tf = S.tf, code = S.code;
  const key = code + '|' + tf;
  if (C.code !== code) C.bars = null;   // old candles stay under a dim overlay only while the same stock changes period
  chartState('loading');
  try { await ensureChart(); } catch (e) { if (g === S.gen && tf === S.tf) chartState('lib'); return; }
  if (g !== S.gen || tf !== S.tf) return;
  const hit = C.cache.get(key);
  let j = !force && hit && Date.now() - hit.at < (tf === '1d' || tf === '5d' ? 20e3 : 600e3) ? hit.j : null;
  if (!j) {
    try { j = await api('chart?tf=' + tf, 'chart'); } catch (e) {
      if (aborted(e) || g !== S.gen || tf !== S.tf) return;
      C.bars = null; C.candles.setData([]); C.vol.setData([]); renderLegend(); renderPeriod();
      chartState('error', e); return;
    }
    if (g !== S.gen || tf !== S.tf) return;
    C.cache.set(key, { at: Date.now(), j });
  }
  setChartData(j, code, tf, false);
  scheduleIntraday();
}

/* References.
 * 전일 종가 (the dashed line on 1일·5일, and the base of the 1일 change) is the KRX 기준가 that the header and the order
 * book use: price − change from /summary. The chart API's prevClose is the close of the bar *before the first bar*
 * (for 1d the previous day's KRX+NXT close, which can differ from 기준가), so it only serves as the period's base. */
function sumRef() {
  const s = S.sum;
  return s && s.code === S.code && isNum(s.price) && isNum(s.change) && +s.price - +s.change > 0 ? +s.price - +s.change : null;
}
const dayOf = t => Math.floor(t / 86400);   // intraday times are KST-shifted seconds
function computeRefs() {
  const bars = C.bars || [];
  C.ref = C.intraday ? (sumRef() != null ? sumRef() : C.tf === '1d' ? C.base : null) : null;
  // the legend's % per bar: intraday → that day's previous close (today's = 전일 종가); otherwise → the previous bar
  const refs = new Array(bars.length);
  const lastDay = C.intraday && bars.length ? dayOf(bars[bars.length - 1].time) : null;
  let day = null, ref = C.base;
  for (let i = 0; i < bars.length; i++) {
    if (!C.intraday) { refs[i] = i ? bars[i - 1].c : C.base; continue; }
    const d = dayOf(bars[i].time);
    if (d !== day) { day = d; ref = i ? bars[i - 1].c : C.base; }
    refs[i] = d === lastDay && C.ref != null ? C.ref : ref;
  }
  C.refs = refs;
}
function drawRefLine() {
  if (C.prevLine) { C.candles.removePriceLine(C.prevLine); C.prevLine = null; }
  if (C.ref != null && C.bars && C.bars.length) C.prevLine = C.candles.createPriceLine({ price: C.ref, color: '#8a8f99', lineWidth: 1, lineStyle: C.L.LineStyle.Dashed, axisLabelVisible: true, title: '전일 종가', axisLabelColor: '#373a42', axisLabelTextColor: '#eef0f3' });
}
// the last-price label follows the day's change (as in the header), not the last candle's own colour
function lastColor() {
  const d = S.sum && S.sum.code === S.code && isNum(S.sum.change) ? +S.sum.change : null;
  if (d == null) return '';
  const P = KH.palette();
  return d > 0 ? P.up : d < 0 ? P.down : FLAT;
}
// /summary arrived or changed after the candles: move the 전일 종가 line and the legend onto 기준가
function syncChartRef() {
  if (!C.chart || C.code !== S.code) return;
  C.candles.applyOptions({ priceLineColor: lastColor() });
  if (!C.bars || !C.bars.length) return;
  const before = C.ref;
  computeRefs();
  if (C.ref !== before) drawRefLine();
  renderLegend(); renderPeriod();
}

function setChartData(j, code, tf, keepRange) {
  const intraday = tf === '1d' || tf === '5d';

  if (/^(buy|매수|tradingbuy|단기매수|outperform|overweight|비중확대|accumulate|add|시장수익률상회)/.test(s)) return 3;
  if (/^(sell|매도|underperform|underweight|비중축소|reduce|시장수익률하회)/.test(s)) return 1;

  if (!rows.length && tgt == null && om == null) {
    A.body.replaceChildren(msgBox('최근 증권사 리포트가 없어요.', '증권사 분석이 드문 종목이에요. 리포트가 나오면 여기에 보여요.'));
    return;
  }
  const kids = [];
  // opinion spread over the last 3 months
  const cutoff = monthsAgo(RES_MONTHS), recent = rows.filter(r => String(r.date || '') >= cutoff);
  const counts = [0, 0, 0, 0, 0];
  let unknown = 0;
  for (const r of recent) { const b = opinionBucket(r.opinion); if (b < 0) unknown++; else counts[b]++; }
  const counted = recent.length - unknown, capped = rows.length >= 20 && String(rows[rows.length - 1].date || '') >= cutoff;
  const top = Math.max(...counts);
  kids.push(h('p', { class: 'sp-ana-h' }, h('b', { text: `최근 ${RES_MONTHS}개월 리포트 ${recent.length}건` }), capped ? h('small', { text: '최근 20건까지만 셌어요' }) : null));
  if (!recent.length) kids.push(h('p', { class: 'sp-ana-empty', text: `최근 ${RES_MONTHS}개월 동안 나온 리포트가 없어요.` }));
  else if (!counted) kids.push(h('p', { class: 'sp-ana-empty', text: `최근 ${RES_MONTHS}개월 리포트 ${recent.length}건에서 투자의견을 찾지 못했어요.` }));
  else {
    kids.push(h('figure', { class: 'sp-op', role: 'img', 'aria-label': '의견 분포: ' + OPINIONS.map((o, i) => `${o} ${counts[i]}건`).join(', ') },
      OPINIONS.map((o, i) => h('div', { class: 'col' + (counts[i] && counts[i] === top ? ' max' : '') + (counts[i] ? '' : ' zero') },
        h('span', { class: 'n num', text: `${counts[i]}건` }),
        h('span', { class: 'well' }, h('i', { style: `height:${counts[i] ? Math.max(8, (counts[i] / top) * 100).toFixed(1) : 0}%` })),
        h('span', { class: 'x', text: o })))));
    if (unknown) kids.push(h('p', { class: 'sp-note sp-op-note', text: `의견을 찾지 못한 리포트 ${unknown}건은 세지 않았어요.` }));
  }
  // consensus
  if (tgt != null || om != null) {
    const gap = tgt != null ? h('span', { class: 'sp-gap num', 'data-t': String(tgt) }) : null;
    R.ci.gap = gap;
    const when = cons.date ? shortDate(cons.date) + ' 기준 · ' : '';
    kids.push(h('dl', { class: 'sp-kv sp-cons' },
      tgt != null ? h('div', {}, h('dt', {}, '평균 목표주가', h('small', { text: `${when}증권사 평균` })), h('dd', {}, h('span', { class: 'num', text: int(tgt) + '원' }), gap)) : null,
      om != null ? h('div', {}, h('dt', {}, '평균 투자의견', h('small', { text: '1 적극매도 ~ 5 적극매수' })),
        h('dd', {}, h('span', { class: 'num', text: `${om.toFixed(2)}점` }), h('span', { class: 'sp-tag', text: OPINIONS[Math.max(0, Math.min(4, Math.round(om) - 1))] }))) : null));
  }

  if (rows.length) {
    const shown = S.resAll ? rows : rows.slice(0, RES_SHOW);
    kids.push(h('h4', { class: 'sp-rp-h' }, '리포트', h('small', { class: 'num', text: String(rows.length) })),

        const meta = [h('time', { datetime: String(r.date || ''), text: shortDate(r.date) }), r.broker ? h('span', { class: 'br', text: String(r.broker) }) : null,
          isNum(r.target) && +r.target > 0 ? h('span', { class: 'num', text: `목표가 ${int(r.target)}원` }) : null,

      })),

      h('p', { class: 'sp-note', text: '리포트 본문은 증권사 원문에서 볼 수 있어요. 누르면 새 탭에서 열려요.' }));
  } else kids.push(h('p', { class: 'sp-ana-empty', text: '최근 리포트 목록이 없어요.' }));

/* ───────────────── open / close ───────────────── */
let inerted = [];
function setInert(on) {
  if (on) {
    for (const el of document.body.children) {
      if (el === root || /^(SCRIPT|STYLE|LINK|TEMPLATE)$/.test(el.tagName) || el.inert) continue;
      el.inert = true; inerted.push(el);
    }
  } else { for (const el of inerted) el.inert = false; inerted = []; }
}
function stopTimers() {
  if (LIVE) for (const t of TABS) if (t.hide) t.hide();
  clearTimeout(S.timers.sum); clearTimeout(S.timers.chart);
  S.timers.sum = S.timers.chart = 0;
}
function stopAll() { stopTimers(); abortAll(); }

function show(code, opener) {
  build();
  const switching = S.open;
  S.gen++;
  stopAll();
  Object.assign(S, { code, sum: null, sumErr: null, phase: 'unknown' });
  for (const t of TABS) if (t.reset) t.reset();
  if (!switching) {
    S.opener = opener && opener !== document.body ? opener : null;
    S.prevTitle = document.title;
    root.hidden = false;
    document.documentElement.classList.add('sp-on');
    setInert(true);
    root.classList.remove('sp-in');
    if (!reduceMotion.matches) { void root.offsetWidth; root.classList.add('sp-in'); }
    S.open = true;
  }
  root.scrollTop = 0;
  root.classList.remove('sp-nf');
  renderHead(); renderMeta(); renderStats(); renderPeers();
  measureHead();
  root.focus({ preventScroll: true });
  if (!LIVE) { renderOffline(); return; }
  syncTf();
  if (C.chart && C.code !== code) { C.bars = null; C.candles.setData([]); C.vol.setData([]); renderLegend(); renderPeriod(); }
  loadSummary();
  loadChart();
  setTab(S.tab);
}

function hide() {
  if (!S.open) return;
  S.open = false;
  S.gen++;
  stopAll();
  root.hidden = true;
  root.classList.remove('sp-in');
  document.documentElement.classList.remove('sp-on');
  setInert(false);
  if (S.prevTitle) document.title = S.prevTitle;
  const o = S.opener;
  S.opener = null;
  if (o && o.isConnected && typeof o.focus === 'function') { try { o.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}

function setHash(hash, replace) {
  const url = location.pathname + location.search + hash;
  try {
    if (replace) history.replaceState(history.state, '', url);
    else history.pushState(history.state, '', url);
    return true;
  } catch (e) {
    try { if (replace) location.replace(hash || '#'); else location.hash = hash; } catch (e2) { /* sandboxed */ }
    return false;
  }
}

function open(code, opts) {
  code = String(code || '').trim().toUpperCase();
  if (!CODE_RE.test(code)) return false;
  const opener = (opts && opts.opener) || document.activeElement;
  const target = '#s-' + code;
  if (location.hash !== target) {
    if (S.open) setHash(target, true);             // switching stocks keeps one history entry: back always returns to the map
    else { S.prevHash = HASH_RE.test(location.hash) ? '' : location.hash; S.pushed = setHash(target, false); }
  }
  if (!S.open || S.code !== code) show(code, opener);
  return true;
}

function close() {
  if (!S.open) return;
  const pushed = S.pushed;
  S.pushed = false;
  hide();
  if (HASH_RE.test(location.hash)) {
    if (pushed) history.back();                    // undo our own entry, so browser back/forward stay natural
    else setHash(S.prevHash || '', true);          // opened from a shared link: just drop the hash
  }
}

function onHash() {
  const m = HASH_RE.exec(location.hash);
  if (m) { if (!S.open || S.code !== m[1]) { if (!S.open) S.prevHash = ''; show(m[1], S.open ? null : document.activeElement); } }
  else if (S.open) { S.pushed = false; hide(); }
}

addEventListener('hashchange', onHash);
addEventListener('popstate', onHash);
// capture phase: the page owns Esc and '/' while it is open (the heatmap would otherwise zoom out / focus its search)
addEventListener('keydown', e => {
  if (!S.open) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); close(); }
  else if (e.key === '/') e.stopImmediatePropagation();
}, true);
document.addEventListener('visibilitychange', () => {
  if (!S.open || !LIVE) return;
  if (document.visibilityState === 'visible') { loadSummary(true); TAB[S.tab].show(R.panels[S.tab]); scheduleIntraday(); }
  else stopTimers();   // loads already in flight may finish; nothing new starts while hidden
});
document.addEventListener('kh:palette', () => { if (root) { applyColors(); if (S.open) renderPeers(); } });
document.addEventListener('kh:data', () => { if (S.open) { renderPeers(); renderHead(); } });   // 업종 path / provisional price arrive with the quotes
document.addEventListener('kh:watch', () => { if (S.open) renderStar(); });

window.KHStock = { open, close, isOpen: () => S.open };
onHash();
})();

function sparkSvg(spark, base) {

function drawMap(nodes) {

    ctx.font = `500 ${mSize}px ${fam}`; ctx.fillStyle = '#bcc0c8'; ctx.fillText(when, pad + tW + 12, cy);

  const s1 = Math.max(late ? 16 * 60 + 30 : 15 * 60 + 30, Math.ceil(last / 5) * 5);

const replay = { open: false, el: null, btn: null, dates: null, date: null, day: null, cache: new Map(), i: -1, playing: false, speed: 1, timer: 0, req: 0, frameT: null, raf: 0 };

  ui.ticks.replaceChildren(...marks.map((m, k) => h('span', { class: k % 2 && k < marks.length - 1 ? 'o' : null, style: `left:${((m - s0) / 5 / slots) * 100}%`, text: minLabel(m) })));

}
function rpSetH() {

function rpBuild() {

  ui.time = h('div', { class: 'rp-time', 'aria-live': 'off', text: '--:--' });

function rpState(kind, text, retry) {
  const ui = replay.ui;
  ui.body.hidden = kind !== 'ready';
  ui.msg.hidden = kind === 'ready';
  ui.msg.replaceChildren(ui.label(), h('p', { text }));
  if (retry) ui.msg.append(h('button', { type: 'button', class: 'rp-retry', onclick: retry, text: '다시 시도' }));
  ui.note.textContent = kind === 'ready' ? `5분마다 기록한 시세예요. 정규장(${minLabel(SESSION.s0)}~${minLabel(SESSION.s1)}) 기준 · 네이버 증권` : kind === 'empty' ? '5분마다 기록한 시세예요. 네이버 증권' : '';
  if (kind === 'ready' && !narrowMQ.matches) ui.note.textContent += ' · 스페이스 재생/멈춤, ←/→ 한 칸씩';

async function openReplay(ev) {
  const R = replay;
  if (isWorldTab()) return;
  if (R.open) { closeReplay(); return; }
  if (!R.el) rpBuild();
  R.open = true;
  R.btn = (ev && ev.currentTarget) || R.btn;
  if (R.btn) R.btn.setAttribute('aria-expanded', 'true');
  R.el.hidden = false;
  document.documentElement.classList.add('rp-open');
  rpSetH();
  R.ui.close.focus();
  await loadDates();
}
async function loadDates() {
  const R = replay;
  rpState('loading', '기록된 날짜를 불러오는 중이에요…');
  try {
    const j = await getJSON('api/replay/dates');
    R.dates = (j && Array.isArray(j.dates) ? j.dates : []).filter(d => /^\d{4}-\d\d-\d\d$/.test(d));
  } catch (e) {
    if (!R.open) return;
    rpState('error', '기록된 날짜를 불러오지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.', loadDates);
    return;
  }
  if (!R.open) return;
  if (!R.dates.length) { rpState('empty', '아직 기록된 날이 없어요. 다음 거래일 09:00부터 5분마다 기록돼서, 장이 열린 뒤에 다시 볼 수 있어요.'); return; }
  R.ui.date.replaceChildren(...R.dates.map(d => h('option', { value: d, text: dayLabel(d) })));
  R.ui.date.value = R.dates.includes(R.date) ? R.date : R.dates[0];
  await loadDay(R.ui.date.value, true);
}
async function loadDay(date, fallback) {
  const R = replay;
  pause();
  const id = ++R.req;
  // switching dates while a day is on screen: keep the player, report progress and problems on the count line
  const inline = !!(R.day && !R.ui.body.hidden);
  const fail = msg => {
    if (inline) { R.ui.day.textContent = msg; R.ui.date.value = R.date; return; }
    rpState('empty', msg);
  };
  let day = R.cache.get(date);
  if (!day) {
    if (inline) R.ui.day.textContent = '불러오는 중이에요…';
    else rpState('loading', `${dayLabel(date)} 기록을 불러오는 중이에요…`);
    try {
      const j = await getJSON('api/replay?date=' + encodeURIComponent(date), 20000);
      if (!j || !Array.isArray(j.codes) || !Array.isArray(j.frames)) throw new Error('bad shape');
      day = { date: j.date || date, codes: j.codes.map(String), frames: j.frames.filter(f => f && f.t != null && Array.isArray(f.p) && Array.isArray(f.r)), index: j.index || {}, base: j.base || j.prev || null };

    } catch (e) {
      if (id !== R.req || !R.open) return;
      if (e.status === 404) {
        // the newest key may have expired between the two calls: fall back to the next recorded day
        const next = fallback && R.dates[R.dates.indexOf(date) + 1];
        if (next) { R.ui.date.value = next; loadDay(next, true); return; }
        fail(`${dayLabel(date)}에는 기록이 없어요.`);
      } else if (inline) fail('기록을 불러오지 못했어요. 다시 골라 주세요.');
      else rpState('error', '기록을 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.', () => loadDay(date, fallback));
      return;
    }
  }
  if (id !== R.req || !R.open) return;
  if (!day.frames.length) { fail(`${dayLabel(date)}에는 아직 기록된 장면이 없어요. 장이 열리면 5분마다 쌓여요.`); return; }
  R.date = date; R.day = day;

function indexBase(day, key) {

  ui.slider.style.setProperty('--pos', (sl / SESSION.slots * 100) + '%');

    const arr = day.index[k];
    const v = Array.isArray(arr) ? +(Array.isArray(arr[i]) ? arr[i][0] : arr[i] && typeof arr[i] === 'object' ? arr[i].value : arr[i]) : NaN;

function seekSlot(sl) {

}
function step(d) { pause(); showFrame(replay.i + d); }
function setPlayIcon() {

}
function tick() {
  const R = replay;

function play() {

function rpKeys(e) {

  const t = e.target;
  const textField = t && (t.isContentEditable || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'range'));

}

/* ═════════════ boot ═════════════ */
function initTools() {
  if (!toolsEl) return;
  toast('');                                               // create the live region up front so the first message is announced
  toolsEl.classList.add('xt');
  if (has('layout')) toolsEl.append(toolButton('image', '이미지로 저장', saveImage));
  if (LIVE && has('setReplay')) {
    const rb = toolButton('replay', '리플레이', openReplay, { 'aria-expanded': 'false' });
    toolsEl.append(rb);
    // replay only makes sense on the domestic maps: dim it on the 해외 / 원자재 tabs
    const sync = () => {
      const off = isWorldTab();
      if (off) { if (replay.open) closeReplay(); rb.setAttribute('aria-disabled', 'true'); rb.title = '국내 지도 탭에서 쓸 수 있어요'; }
      else { rb.removeAttribute('aria-disabled'); rb.title = '리플레이'; }
    };
    document.addEventListener('kh:render', sync);
    addEventListener('hashchange', sync);
    document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.tabs')) setTimeout(sync, 0); });
    sync();
  }
}
initStrip();
initTools();
initPWA();
document.addEventListener('keydown', rpKeys);
// Space on a focused button would also "click" it on keyup: swallow that when the player took the keydown
document.addEventListener('keyup', e => { if (spaceTaken && (e.key === ' ' || e.code === 'Space')) { e.preventDefault(); spaceTaken = false; } });
})();

  const dot = svg('circle', { class: 'kw-cdot', r: 3, cx: x(bars.length - 1), cy: y(last) });
  s.append(cross, dot);
  const read = h('div', { class: 'kw-read' });
  const showAt = i => {
    const b = bars[i], r = (b.c / first - 1) * 100;
    read.replaceChildren(h('span', { text: D.tf === '1y' ? shortDateY(b.t) : shortDate(b.t) }), h('b', { text: fixed(b.c, dp) }),
      h('span', { class: isRef(it || {}) ? 'flat' : cls(r), text: i ? `${pct(r)} (기간 시작 대비)` : '기간 시작' }));
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(b.c));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
  };
  const reset = () => {
    read.replaceChildren(h('span', { text: `${TFS.find(t => t[0] === D.tf)[1]} 동안` }), h('b', { class: isRef(it || {}) ? 'flat' : cls(chg), text: pct(chg) }),
      h('span', { class: 'kw-hl', text: `최고 ${fixed(hi, dp)} · 최저 ${fixed(lo, dp)}` }));
    dot.setAttribute('cx', x(bars.length - 1)); dot.setAttribute('cy', y(last));
    cross.setAttribute('x1', -10); cross.setAttribute('x2', -10);
  };
  s.addEventListener('pointermove', e => {
    const r = s.getBoundingClientRect();
    const px = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(bars.length - 1, Math.round((px - padL) / (W - padL - padR) * (bars.length - 1))));
    showAt(i);
  });
  s.addEventListener('pointerleave', reset);
  reset();
  box.replaceChildren(top, read, s);
}

/* ───────── polling ───────── */
function schedule(ms) {
  clearTimeout(S.timer); S.timer = 0;
  if (!S.shown || !LIVE) return;
  S.timer = setTimeout(() => load(S.kind), ms);
}
async function load(kind) {
  clearTimeout(S.timer); S.timer = 0;
  if (!S.shown || S.kind !== kind || !LIVE || document.hidden) return;
  const seq = ++S.seq;
  if (S.ac) S.ac.abort();
  const ac = S.ac = new AbortController();
  S.busy = kind;
  if (!S.data[kind] && S.err[kind]) { S.err[kind] = null; render(); }   // a retry from the error box shows "loading" again
  let ok = false;
  try {
    const j = await getJSON('api/world?kind=' + kind, ac.signal);
    if (seq !== S.seq) return;
    S.data[kind] = normalise(j, kind);
    S.at[kind] = Date.now();
    S.err[kind] = null;
    ok = true;
  } catch (e) {
    if (seq !== S.seq) return;
    S.err[kind] = e;
  }
  S.busy = null;
  render();
  announce(kind, ok);
  schedule(ok ? POLL_MS : RETRY_MS);
}
function announce(kind, ok) {
  const K = KINDS[kind], key = kind + (ok ? ':ok' : ':err');
  if (S.announced[kind] === key) return;
  S.announced[kind] = key;
  const d = S.data[kind];
  els.live.textContent = ok ? (d && d.all.length ? `${K.title} ${d.all.length}개를 불러왔어요` : K.empty) : (d ? `${K.title}를 새로 받지 못했어요. 이전 값을 보여 줘요` : K.fail);
}
document.addEventListener('visibilitychange', () => {
  if (!S.shown || !LIVE) return;
  if (document.hidden) { clearTimeout(S.timer); S.timer = 0; S.seq++; S.busy = null; if (S.ac) S.ac.abort(); return; }
  const age = Date.now() - (S.at[S.kind] || 0);
  if (!S.data[S.kind] || age >= POLL_MS) load(S.kind); else schedule(POLL_MS - age);
});
document.addEventListener('kh:palette', () => {
  if (!S.shown || !els || els.snap) return;
  render();
  if (S.detail) drawChart();
});
addEventListener('resize', () => { if (S.shown) schedRender(); });
if (document.fonts) {
  const refit = () => { MW.clear(); family = ''; if (S.shown) schedRender(); };
  if (document.fonts.ready) document.fonts.ready.then(refit);
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', refit);
}

/* ───────── public API ───────── */
function show(kind) {
  kind = kind === 'commodity' || kind === 'cmdty' ? 'commodity' : 'index';
  if (!scaffold()) return;
  const sameKind = S.kind === kind;
  if (!sameKind) { closeDetail(false); S.kind = kind; S.focusKey = null; if (els.tiles) { for (const el of els.tiles.values()) el.remove(); for (const el of els.heads.values()) el.remove(); els.tiles.clear(); els.heads.clear(); } }
  const was = S.shown;
  S.shown = true;
  if (!LIVE) { renderSnapshot(); return; }
  render();
  if (was && sameKind && (S.timer || S.busy === kind)) return;   // already polling / loading this kind
  const age = Date.now() - (S.at[kind] || 0);
  if (!S.data[kind] || age >= POLL_MS) load(kind); else schedule(POLL_MS - age);
}
function hide() {
  S.shown = false;
  clearTimeout(S.timer); S.timer = 0;
  S.seq++; S.busy = null;
  if (S.ac) S.ac.abort();
  closeDetail(false);
}
// the map as drawn now, in map pixels (same shape as KH.layout(), for saving an image)
function layout() {
  if (!S.shown || !els || els.snap || !els.boxes) return [];
  const out = [];
  for (const g of els.boxes.heads) {
    const el = els.heads.get(g.g.key);
    out.push({ kind: 'sector', x: g.x, y: g.y, w: g.w, h: g.h, color: '#000', label: g.hd ? g.g.name : '', sub: g.hd && el ? el.__sub || '' : '', hd: g.hd });
  }
  for (const t of els.boxes.tiles) {
    const el = els.tiles.get(t.it.key);
    out.push({ kind: 'tile', x: t.x, y: t.y, w: t.w, h: t.h, color: el ? el.__col : colorOf(t.it), label: t.it.name, sub: el ? el.__sub || '' : '', code: t.it.key });
  }
  return out;
}
window.KHWorld = { show, hide, layout, shown: () => S.shown ? S.kind : null };

// the template may have tried show() before this script existed (page opened at #world / #cmdty): start now
try {
  const m = typeof KH.market === 'function' ? KH.market() : null;
  const w = document.getElementById('world');
  if ((m === 'world' || m === 'cmdty') && w && !w.hidden) show(m === 'cmdty' ? 'commodity' : 'index');
} catch (e) { /* the template will call show() itself */ }
})();

</script>
