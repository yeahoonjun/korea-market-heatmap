.sp-main { max-width: 1760px; margin: 0 auto; padding: 10px 12px 28px; }
.sp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 24px; font-size: 12px; color: var(--muted); }
.sp-chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg2); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.sp-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sp-chip.live { color: var(--amber); border-color: rgba(255, 181, 71, .35); background: var(--amber-soft); }
.sp-chip.live i { background: var(--amber); animation: spPulse 1.8s infinite; }
@keyframes spPulse { 0% { box-shadow: 0 0 0 0 rgba(255, 181, 71, .55); } 70% { box-shadow: 0 0 0 6px rgba(255, 181, 71, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 181, 71, 0); } }
.sp-nxt { color: var(--fg2); text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: help; }
.sp-phase-note { color: var(--fg2); }
.sp-meta-err { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
.sp-link { color: var(--amber); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; padding: 0 2px; }

.sp-stats { display: grid; grid-template-columns: minmax(0, 1.25fr) repeat(3, minmax(0, 1fr)); gap: 1px; margin: 10px 0 0; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sp-stats[hidden] { display: none; }
.sp-stat { background: var(--panel); padding: 7px 9px 8px; min-width: 0; }
.sp-stat dt { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-stat dd { margin: 1px 0 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-st-fr { display: none; }          /* phones: 외국인 소진율 lives in 종목 정보 › 투자 지표 */
/* 1일 · 52주 범위: full rows on phones */
.sp-rng { grid-column: 1 / -1; }
.sp-rng dt { display: flex; align-items: baseline; gap: 8px; }
.sp-rng dt > span { flex: none; }
.sp-rng dt small { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
.sp-rng dd { display: flex; align-items: center; gap: 9px; overflow: visible; margin-top: 3px; }
.sp-rng .lo, .sp-rng .hi { flex: none; font-size: 13px; }
.sp-rng .track { position: relative; flex: 1; min-width: 40px; height: 6px; border-radius: 3px; background: var(--line2); }
.sp-rng .track .dot { position: absolute; z-index: 2; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 2px var(--panel); }
.sp-rng .track .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.sp-rng .track .fill.up { background: color-mix(in srgb, var(--up-text) 60%, transparent); }
.sp-rng .track .fill.dn { background: color-mix(in srgb, var(--dn-text) 60%, transparent); }
.sp-rng .tk { position: absolute; z-index: 1; }
.sp-rng .tk.prev { top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--fg2); }   /* 전일 종가: a line through the bar */
.sp-rng .tk.open { top: -9px; width: 0; height: 0; margin-left: -4px; border: 4px solid transparent; border-top: 5px solid var(--muted); border-bottom: 0; }   /* 시가: a notch above */
.sp-rng .k-open::before { content: ""; display: inline-block; margin-right: 4px; vertical-align: 1px; border: 4px solid transparent; border-top: 5px solid var(--muted); border-bottom: 0; }
.sp-rng .k-prev::before { content: ""; display: inline-block; width: 2px; height: 9px; margin-right: 4px; vertical-align: -1px; border-radius: 1px; background: var(--fg2); }

/* ── body ───────────────────────── */
.sp-body { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.sp-nf .sp-body, .sp-nf .sp-stats { display: none; }
.sp-chartcol, .sp-side { min-width: 0; }
.sp-tfbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sp-seg { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.sp-seg button { flex: 1 1 0; min-height: 40px; padding: 0 4px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s; }
.sp-seg button:hover { color: var(--fg); }
.sp-seg button[aria-pressed="true"], .sp-seg button[aria-selected="true"] { background: var(--panel2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--amber); }
.sp-tfs { flex: 1; }
.sp-period { display: none; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sp-period b { font-weight: 600; }

.sp-chartwrap { position: relative; height: 45vh; height: 45svh; min-height: 250px; max-height: 620px; background: #191a1f; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sp-chart { position: absolute; inset: 0; }
.sp-legend { position: absolute; z-index: 3; left: 10px; top: 7px; right: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px 10px; pointer-events: none; font-size: 11.5px; line-height: 1.45; color: var(--muted); text-shadow: 0 0 3px #191a1f, 0 0 6px #191a1f; }
.sp-legend .sp-lg-t { color: var(--fg2); font-weight: 600; }
.sp-legend .sp-lg-ohlc { display: flex; flex-wrap: wrap; gap: 0 8px; order: 3; }
.sp-legend .kv.vol { order: 2; }
.sp-legend .kv em { font-style: normal; margin-right: 3px; }
.sp-legend .kv b, .sp-legend .sp-lg-r { color: var(--fg); font-weight: 600; }
.sp-legend .kv b.up, .sp-legend .sp-lg-r.up { color: var(--up-text); }
.sp-legend .kv b.dn, .sp-legend .sp-lg-r.dn { color: var(--dn-text); }
.sp-chartmsg { position: absolute; inset: 0; z-index: 4; display: none; place-items: center; padding: 20px; text-align: center; background: #191a1f; }
.sp-chartmsg.on { display: grid; }
.sp-chartmsg.dim { background: rgba(25, 26, 31, .55); }
.sp-loading-t { padding: 6px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line2); font-size: 13px; color: var(--fg2); }
.sp-chart-skel { position: absolute; left: 16px; right: 70px; top: 44px; bottom: 30px; display: flex; align-items: flex-end; gap: 6px; }
.sp-chart-skel i { flex: 1; border-radius: 2px; background: #24262d; animation: spFade 1.3s ease-in-out infinite alternate; }

/* peers */
.sp-peers { display: flex; align-items: center; gap: 10px; margin-top: 10px; min-width: 0; }
.sp-peers[hidden] { display: none; }
.sp-peers-t { flex: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.sp-peer-list { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding: 4px; margin: -4px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
.sp-peer-list::-webkit-scrollbar { display: none; }
.sp-peer { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.sp-peer:hover { border-color: var(--line2); background: var(--panel2); }
.sp-peer .pk { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 10px; height: 16px; margin-right: -2px; }
.sp-peer .pk svg, .sp-peer .pk canvas { display: block; }
.sp-peer .nm { font-weight: 600; }
.sp-peer .num { font-size: 12.5px; font-weight: 600; }
.sp-peer .pr { color: var(--fg2); font-weight: 500; }
.sp-peer .pr:empty { display: none; }
.sp-peer-list .sp-peer:last-child { margin-right: 20px; }

/* tabs */
.sp-tabwrap { position: sticky; top: var(--sp-hh); z-index: 5; padding: 6px 0; margin-top: -6px; background: var(--page); }
.sp-tabs button { flex: 1 1 auto; padding: 0 6px; }
.sp-panel { container-type: inline-size; padding-top: 10px; outline: none; }
.sp-panel:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.sp-panel[hidden] { display: none; }

/* messages & skeletons */
.sp-msgbox { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; text-align: center; }
.sp-msg-t { font-size: 14.5px; font-weight: 600; color: var(--fg); }
.sp-msg-s { font-size: 13px; color: var(--muted); max-width: 34ch; }
.sp-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; margin-top: 6px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel2); color: var(--fg); font-size: 13.5px; font-weight: 600; text-decoration: none; }
.sp-btn:hover { border-color: var(--muted); }
.sp-btn.pri { background: var(--amber); border-color: var(--amber); color: #1b1404; }
.sp-btn.pri:hover { filter: brightness(1.06); }
.sp-btn[disabled] { opacity: .6; cursor: default; }
.sp-inline-err { font-size: 12.5px; color: var(--fg2); padding: 6px 2px; }
.sp-inline-err[hidden] { display: none; }
.sp-note { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 10px; }
.sp-note[hidden] { display: none; }
.sp-skel { display: inline-block; vertical-align: middle; max-width: 100%; border-radius: 5px; background: linear-gradient(90deg, #202228 25%, #2b2d35 50%, #202228 75%); background-size: 200% 100%; animation: spShim 1.3s linear infinite; }
.sp-skel-rows { display: flex; flex-direction: column; gap: 6px; }
.sp-skel-rows .sp-skel { display: block; }
@keyframes spShim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes spFade { from { opacity: .45; } to { opacity: 1; } }

/* ── 호가 ───────────────────────── */
.sp-ob-msg[hidden], .sp-ob-grid[hidden] { display: none; }
.sp-ob-msg + .sp-ob-grid { margin-top: 0; }
.sp-ob-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(118px, auto) minmax(0, 1fr); grid-template-rows: repeat(10, 36px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums; }
.sp-q { position: relative; display: flex; align-items: center; padding: 0 8px; font-size: 13px; color: var(--fg2); border-bottom: 1px solid rgba(255, 255, 255, .04); min-width: 0; }
.sp-q.ask { grid-column: 1; justify-content: flex-end; }
.sp-q.bid { grid-column: 3; justify-content: flex-start; }
.sp-q .bar { position: absolute; top: 6px; bottom: 6px; max-width: 100%; border-radius: 3px; transition: width .25s ease-out; }
.sp-q.ask .bar { right: 0; border-radius: 3px 0 0 3px; background: color-mix(in srgb, var(--dn-text) 24%, transparent); }
.sp-q.bid .bar { left: 0; border-radius: 0 3px 3px 0; background: color-mix(in srgb, var(--up-text) 24%, transparent); }
.sp-q span { position: relative; }
.sp-p { grid-column: 2; position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 8px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid rgba(255, 255, 255, .04); white-space: nowrap; color: var(--fg); }
.sp-p.ask { background: color-mix(in srgb, var(--dn-text) 7%, transparent); }
.sp-p.bid { background: color-mix(in srgb, var(--up-text) 7%, transparent); }
.sp-p b { font-size: 14px; font-weight: 600; }
.sp-p small { font-size: 11px; font-weight: 500; opacity: .92; }
.sp-p.up b, .sp-p.up small { color: var(--up-text); }
.sp-p.dn b, .sp-p.dn small { color: var(--dn-text); }
.sp-p.cur { box-shadow: inset 0 0 0 2px var(--fg); }
.sp-p[data-mark]::after { content: ""; position: absolute; left: -1px; right: -1px; height: 2px; background: var(--fg); z-index: 1; }
.sp-p[data-mark="top"]::after { top: -1px; }
.sp-p[data-mark="bottom"]::after { bottom: -1px; }
.sp-ob-info { display: flex; flex-direction: column; gap: 6px; padding: 10px; min-width: 0; font-size: 11.5px; color: var(--muted); }
.sp-ob-info.top { grid-column: 3; grid-row: 1 / span 5; justify-content: flex-end; }
.sp-ob-info.bot { grid-column: 1; grid-row: 6 / span 5; justify-content: flex-start; }
.sp-ob-info > div { display: flex; flex-direction: column; min-width: 0; }
.sp-ob-info b { color: var(--fg); font-size: 13px; font-weight: 600; }
.sp-ob-info small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.sp-ob-info b.up { color: var(--up-text); } .sp-ob-info b.dn { color: var(--dn-text); }
.sp-ob-ratio { display: flex; flex-direction: row !important; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 2px; }
.sp-ob-ratio .a { background: color-mix(in srgb, var(--dn-text) 60%, transparent); }
.sp-ob-ratio .b { flex: 1; background: color-mix(in srgb, var(--up-text) 60%, transparent); }

/* ── 투자자 ───────────────────────── */
.sp-cum { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; }
.sp-cum-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.sp-cum-h h3 { font-size: 13.5px; font-weight: 600; }
.sp-cum-h small, .sp-cum-sub { font-size: 11.5px; color: var(--muted); }
.sp-cum-sub { margin-top: 4px; text-align: right; }
.sp-cum-r { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 34px; }
.sp-cum-r .k { font-size: 13px; color: var(--fg2); }
.sp-cum-r b { font-size: 13.5px; font-weight: 600; text-align: right; min-width: 7.5em; }
.sp-cum-r b .s { display: none; }
.sp-spark { display: block; width: 100%; height: 28px; overflow: visible; }
.sp-spark path { fill: none; stroke: var(--fg2); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.sp-cum-r.up .sp-spark path { stroke: var(--up-text); }
.sp-cum-r.dn .sp-spark path { stroke: var(--dn-text); }
.sp-spark .zero { stroke: var(--line2); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }

/* 오늘 순매수: bars from a centre line */
.sp-today { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 8px; margin-bottom: 10px; }
.sp-today-r { display: grid; grid-template-columns: 46px minmax(7.5em, auto) minmax(0, 1fr); align-items: center; gap: 10px; min-height: 32px; }
.sp-today-r .k { font-size: 13px; color: var(--fg2); }
.sp-today-r b { font-size: 13.5px; font-weight: 600; text-align: right; }
.sp-today-r b.up { color: var(--up-text); } .sp-today-r b.dn { color: var(--dn-text); }
.sp-today-r b .s { display: none; }
.sp-today-r .bar { position: relative; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, .05); }
.sp-today-r .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line2); }
.sp-today-r .bar i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.sp-today-r .bar i.up { background: color-mix(in srgb, var(--up-text) 85%, transparent); }
.sp-today-r .bar i.dn { background: color-mix(in srgb, var(--dn-text) 85%, transparent); }

/* ── 종목 정보 ───────────────────────── */
.sp-ci { padding: 6px 0 20px; }
.sp-ci + .sp-ci { border-top: 1px solid var(--line); padding-top: 14px; }
.sp-ci[hidden] { display: none; }
.sp-ci-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; margin-bottom: 8px; }
.sp-ci-hd h3 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.sp-mseg { flex: none; display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); }
.sp-mseg button { min-height: 40px; min-width: 52px; padding: 0 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.sp-mseg button:hover { color: var(--fg); }
.sp-mseg button[aria-pressed="true"] { background: var(--panel2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--amber); }
.sp-tag { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1.5; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line2); color: var(--fg2); white-space: nowrap; }
.sp-ci .dot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 2px; }
.dot.s0, .sp-fin-col .b.s0 { --c: var(--s0); } .dot.s1, .sp-fin-col .b.s1 { --c: var(--s1); } .dot.s2, .sp-fin-col .b.s2 { --c: var(--s2); }
.sp-ci .dot { background: var(--c, var(--fg2)); }
.sp-ci .dot.hatch, .sp-fin-col.est .b { background: repeating-linear-gradient(135deg, var(--c, var(--fg2)) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--c, var(--fg2)); }
/* 투자 지표 */
.sp-mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0; }
.sp-m { min-width: 0; padding: 9px 6px 8px; border-radius: 10px; background: var(--panel); text-align: center; }
.sp-m dt { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-m dd { margin: 2px 0 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-m dd.sub { margin-top: 1px; font-size: 10.5px; font-weight: 500; color: var(--muted); }
@container (min-width: 470px) { .sp-mgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* 재무 */
.sp-fin-lg { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 4px; font-size: 12px; color: var(--fg2); }
.sp-fin-lg span { display: inline-flex; align-items: center; gap: 5px; }
.sp-fin-plot { position: relative; height: 172px; }
.sp-fin-area { position: absolute; left: 0; right: 0; top: 8px; bottom: 2px; }
.sp-fin-area .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255, 255, 255, .06); }
.sp-fin-area .zero { position: absolute; left: 0; right: 0; height: 1px; margin-top: -.5px; background: var(--line2); }
.sp-fin-cols { position: absolute; inset: 0; display: flex; }
.sp-fin-col { position: relative; flex: 1 1 0; height: 100%; border-radius: 8px; }
.sp-fin-col:hover { background: rgba(255, 255, 255, .03); }
.sp-fin-col.on { background: rgba(255, 255, 255, .06); }
.sp-fin-col .grp { position: absolute; inset: 0 12%; display: flex; justify-content: center; gap: 3px; }
.sp-fin-col .slot { position: relative; flex: 1 1 0; max-width: 16px; height: 100%; }
.sp-fin-col .b { position: absolute; left: 0; right: 0; min-height: 2px; border-radius: 3px 3px 0 0; background: var(--c); }
.sp-fin-col .b.neg { border-radius: 0 0 3px 3px; }
.sp-fin-x, .sp-ln-x { display: flex; margin-top: 6px; }
.sp-fin-x span, .sp-ln-x span { flex: 1 1 0; min-width: 0; text-align: center; font-size: 11.5px; line-height: 1.3; color: var(--muted); white-space: nowrap; }
.sp-fin-x span.on { color: var(--fg); font-weight: 700; }
.sp-fin-x small, .sp-ln-x small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; }
.sp-fin-sel { margin-top: 12px; }
.sp-fin-when { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 12.5px; color: var(--muted); }
.sp-fin-when b { font-size: 14px; font-weight: 700; color: var(--fg); }
.sp-fin-vals { display: grid; gap: 0 16px; margin: 0; }
.sp-fin-vals > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.sp-fin-vals dt { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg2); }
.sp-fin-vals dd { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
.sp-fin-m { margin-top: 2px; font-size: 12px; color: var(--muted); }
@container (min-width: 560px) {
  .sp-fin-vals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sp-fin-vals > div { flex-direction: column; align-items: flex-start; gap: 2px; padding: 4px 0; }
}
.sp-fin-tbl { margin-top: 6px; }
.sp-fin-tbl summary { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 2px; font-size: 13px; font-weight: 600; color: var(--fg2); cursor: pointer; list-style: none; border-radius: 6px; }
.sp-fin-tbl summary::-webkit-details-marker { display: none; }
.sp-fin-tbl summary::after { content: ""; width: 7px; height: 7px; margin-top: -3px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); }
.sp-fin-tbl[open] summary::after { margin-top: 3px; transform: rotate(-135deg); }
.sp-fin-tbl summary:hover { color: var(--fg); }
.sp-fin-t { margin-top: 2px; }
.sp-fin-t th { position: static; background: none; }
.sp-fin-t tbody th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--fg2); padding: 7px 2px; border-bottom: 1px solid rgba(255, 255, 255, .05); }
.sp-fin-t tbody th small { display: inline; margin-left: 4px; font-size: 11px; color: var(--muted); }

    const s = document.createElement('script');
    s.src = LWC_SRC; s.async = true; s.crossOrigin = 'anonymous'; s.integrity = LWC_SRI;
    s.onload = () => (window.LightweightCharts ? resolve(window.LightweightCharts) : reject(new Error('Lightweight Charts missing')));
    s.onerror = () => { s.remove(); lwcPromise = null; reject(new Error('Lightweight Charts load failed')); };
    document.head.append(s);

  return lwcPromise;
}

function sanitize(raw, intraday) {

  for (const b of raw || []) {

    const t = intraday ? (isNum(b.t) ? +b.t + KST : null) : (/^\d{4}-\d{2}-\d{2}$/.test(b.t) ? b.t : null);
    if (t == null) continue;

    const hi = Math.max(isNum(b.h) && +b.h > 0 ? +b.h : c, o, c), lo = Math.min(isNum(b.l) && +b.l > 0 ? +b.l : c, o, c);

async function loadChart(force) {

/* References.

function setChartData(j, code, tf, keepRange) {

  computeRefs();

}

  const pc = isNum(o.prevClose) && +o.prevClose > 0 ? +o.prevClose : S.sum && isNum(S.sum.price) ? S.sum.price - S.sum.change : null;

}

function show(code, opener) {

  for (const t of TABS) if (t.reset) t.reset();
  if (!switching) {

}

function setHash(hash, replace) {

    else history.pushState(history.state, '', url);
    return true;
  } catch (e) {

    return false;

}

function open(code, opts) {
  code = String(code || '').trim().toUpperCase();

  const opener = (opts && opts.opener) || document.activeElement;
  const target = '#s-' + code;
  if (location.hash !== target) {
    if (S.open) setHash(target, true);             // switching stocks keeps one history entry: back always returns to the map
    else { S.prevHash = HASH_RE.test(location.hash) ? '' : location.hash; S.pushed = setHash(target, false); }

async function getJSON(url, ms = 12000) {

const STRIP = {

function sparkSvg(spark, base) {
  const pts = (spark || []).filter(p => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1]));
  if (pts.length < 2) return null;
  const W = 46, H = 26;

  let a = day0 + 9 * 3600, b = day0 + 15.5 * 3600;                   // x axis = the regular session 09:00–15:30
  if (pts[pts.length - 1][0] > b || t0 < a) { a = Math.min(a, t0); b = Math.max(b, pts[pts.length - 1][0]); }

// 101,655,000 → "1억 166만" (the strip is tight; the tooltip keeps the full number)
function krwShort(v) {

/* ── odometer: when a strip value changes and effects are 'fancy', the changed digits roll like a counter ── */

    ctx.font = `500 ${mSize}px ${fam}`; ctx.fillStyle = '#bcc0c8'; ctx.fillText(when, pad + tW + 12, cy);

// Where the bar goes depends on the layout, not on a breakpoint: when the tab row wrapped under the clock row, the bar sits
// between the two rows; when they share a row (desktop), it hangs under the header with a gap below the tabs.
function sbPlace() {
  const root = document.documentElement, hd = document.querySelector('header.top');
  if (!sbEl || !hd || sbEl.hidden || !root.classList.contains('has-clock')) { root.classList.remove('sb-mid'); return; }
  const tabs = hd.querySelector('.tabs'), brand = hd.querySelector('.brand');
  const mid = !!(tabs && brand && tabs.offsetParent && tabs.offsetTop >= brand.offsetTop + brand.offsetHeight - 2);

  root.style.setProperty('--sb-mt', Math.max(0, Math.round(above + sbh + below - rowGap)) + 'px');

}

    if (ck.analog) { ck.analog._w.classList.remove('xa-do'); void ck.analog._w.getBoundingClientRect(); ck.analog._w.classList.add('xa-do'); }
  }
  const t0 = Date.now();
  try {
    if (LIVE) { if (has('refresh')) await KH.refresh(); else await pollStrip(); }      // the snapshot has nothing to refetch
  } catch (e) { /* the next poll will try again */ }

  ckSweep();
}
function initClock() {
  if (!clockEl) return;
  if (has('addSetting')) {
    try {
      KH.addSetting({ key: 'clock', label: '시계·장 진행률', hint: '서버 시각으로 맞춘 한국 시각(KST)이에요. 시계를 누르면 새로고침해요.', default: true, onChange: () => ckApply() });
      KH.addSetting({ key: 'clockStyle', label: '시계 모양', options: [{ v: 'digital', label: '숫자' }, { v: 'analog', label: '아날로그' }, { v: 'both', label: '둘 다' }], default: 'digital', onChange: () => ckApply() });
    } catch (e) { /* settings are optional */ }
  }
  ckApply();
  timeSync(true);
  setInterval(() => { if (!document.hidden) timeSync(false); }, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearTimeout(ck.timer); cancelAnimationFrame(ck.raf); return; }
    timeSync(false);
    ckRender(); ckSchedule(); ckSweep();
  });

}

function initTools() {

async function getJSON(url, signal) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), TIMEOUT_MS);
  const onAbort = () => ac.abort();
  if (signal) signal.addEventListener('abort', onAbort, { once: true });
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ac.signal });
    const type = res.headers.get('content-type') || '';
    let body = null;
    if (type.includes('json')) { try { body = await res.json(); } catch (e) { /* not JSON */ } }

/* normalise one /api/world payload; throws on a wrong shape */
function normalise(j, kind) {
  if (!j || !Array.isArray(j.groups)) throw new Error('응답 모양이 달라요');
  const groups = [], seen = new Set();
  let ix = 0;
  for (const g of j.groups) {
    if (!g || !Array.isArray(g.items)) continue;
    const items = [];
    for (const x of g.items) {
      if (!x || x.key == null || x.value == null || !isFinite(+x.value) || seen.has(String(x.key))) continue;
      seen.add(String(x.key));
      const it = {
        key: String(x.key), name: String(x.name || x.key), value: +x.value,
        change: x.change == null || !isFinite(+x.change) ? null : +x.change,
        ratio: x.ratio == null || !isFinite(+x.ratio) ? null : +x.ratio,
        status: x.status === 'OPEN' ? 'OPEN' : 'CLOSE', tradedAt: x.tradedAt || null,
        delayed: +x.delayed > 0 ? +x.delayed : 0, unit: x.unit || null, tz: x.tz || null,
        ref: !!(x.ref || g.ref), group: String(g.name || ''), gkey: String(g.key || ''), ix: ix++,

      items.push(it);
    }
    if (!items.length) continue;
    // biggest first inside a group (stable for equal weights), so the squarified layout puts headline tiles top-left;
    // the list keeps the Worker's order (`list`)
    const ordered = items.map((it, i) => [it, i]).sort((a, b) => weightOf(b[0]) - weightOf(a[0]) || a[1] - b[1]).map(a => a[0]);

function computeLayout(d, W, Hfix) {

  };
  const reset = () => {
    read.replaceChildren(h('span', { text: `${TFS.find(t => t[0] === D.tf)[1]} 동안` }), h('b', { class: isRef(it || {}) ? 'flat' : cls(chg), text: pct(chg) }),
      h('span', { class: 'kw-hl', text: `최고 ${fixed(hi, dp)} · 최저 ${fixed(lo, dp)}` }));
    dot.setAttribute('cx', x(bars.length - 1)); dot.setAttribute('cy', y(last));
    cross.setAttribute('x1', -10); cross.setAttribute('x2', -10);
  };
  s.addEventListener('pointermove', e => {
    const r = s.getBoundingClientRect();
    const px = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(bars.length - 1, Math.round((px - padL) / (W - padL - padR) * (bars.length - 1))));
    showAt(i);
  });
  s.addEventListener('pointerleave', reset);
  reset();
  box.replaceChildren(top, read, s);
}

/* ───────── polling ───────── */
function schedule(ms) {
  clearTimeout(S.timer); S.timer = 0;
  if (!S.shown || !LIVE) return;
  S.timer = setTimeout(() => load(S.kind), ms);
}
async function load(kind) {
  clearTimeout(S.timer); S.timer = 0;
  if (!S.shown || S.kind !== kind || !LIVE || document.hidden) return;
  const seq = ++S.seq;
  if (S.ac) S.ac.abort();
  const ac = S.ac = new AbortController();
  S.busy = kind;
  if (!S.data[kind] && S.err[kind]) { S.err[kind] = null; render(); }   // a retry from the error box shows "loading" again
  let ok = false;
  try {
    const j = await getJSON('api/world?kind=' + kind, ac.signal);
    if (seq !== S.seq) return;
    S.data[kind] = normalise(j, kind);
    S.at[kind] = Date.now();
    S.err[kind] = null;
    ok = true;
  } catch (e) {
    if (seq !== S.seq) return;
    S.err[kind] = e;
  }
  S.busy = null;
  render();
  announce(kind, ok);
  schedule(ok ? POLL_MS : RETRY_MS);
}
function announce(kind, ok) {
  const K = KINDS[kind], key = kind + (ok ? ':ok' : ':err');
  if (S.announced[kind] === key) return;
  S.announced[kind] = key;
  const d = S.data[kind];
  els.live.textContent = ok ? (d && d.all.length ? `${K.title} ${d.all.length}개를 불러왔어요` : K.empty) : (d ? `${K.title}를 새로 받지 못했어요. 이전 값을 보여 줘요` : K.fail);
}
document.addEventListener('visibilitychange', () => {
  if (!S.shown || !LIVE) return;
  root.classList.toggle('kw-paused', document.hidden || !!S.offscreen);
  if (document.hidden) { clearTimeout(S.timer); S.timer = 0; S.seq++; S.busy = null; if (S.ac) S.ac.abort(); clearTimeout(nightT); nightT = 0; return; }
  if (S.mode === 'geo') { drawNight(); schedNight(); }
  const age = Date.now() - (S.at[S.kind] || 0);
  if (!S.data[S.kind] || age >= POLL_MS) load(S.kind); else schedule(POLL_MS - age);
});
// the clock in the header refreshes everything at once (AGENTS §3-6): fetch now, keep view, scroll and focus
document.addEventListener('kh:refresh', () => { if (S.shown && LIVE && !document.hidden) load(S.kind); });
document.addEventListener('kh:motion', () => { if (S.shown && els && !els.snap) syncMotion(); });
document.addEventListener('kh:palette', () => {
  if (!S.shown || !els || els.snap) return;
  render();
  if (S.detail) drawChart();
});
addEventListener('resize', () => { if (S.shown) schedRender(); });
if (document.fonts) {
  const refit = () => { MW.clear(); family = ''; if (S.shown) schedRender(); };
  if (document.fonts.ready) document.fonts.ready.then(refit);
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', refit);
}

/* ───────── public API ───────── */
function show(kind) {
  kind = kind === 'commodity' || kind === 'cmdty' ? 'commodity' : 'index';
  if (!scaffold()) return;
  const sameKind = S.kind === kind;
  if (!sameKind) {
    closeDetail(false); S.kind = kind; S.focusKey = null; S.listFocus = null;
    if (els.tiles) { for (const el of els.tiles.values()) el.remove(); for (const el of els.heads.values()) el.remove(); els.tiles.clear(); els.heads.clear(); }
    if (els.rows) { els.list.replaceChildren(); els.rows.clear(); els.listSig = ''; }
  }
  const was = S.shown;
  S.shown = true;
  if (!LIVE) { renderSnapshot(); return; }
  render();
  if (was && sameKind && (S.timer || S.busy === kind)) return;   // already polling / loading this kind
  const age = Date.now() - (S.at[kind] || 0);
  if (!S.data[kind] || age >= POLL_MS) load(kind); else schedule(POLL_MS - age);
}
function hide() {
  S.shown = false;
  clearTimeout(S.timer); S.timer = 0;
  clearTimeout(nightT); nightT = 0;
  S.seq++; S.busy = null;
  if (S.ac) S.ac.abort();
  closeDetail(false);
}
// the tile map in map pixels (same shape as KH.layout(), for "이미지로 저장"). In the list view it is the map the 지도
// view draws at this width, laid out off screen: the saved picture is a map either way (extras says "지도를 저장했어요").
function headSub(g) {
  const avg = avgOf(g.g.items);
  const vt = avg == null ? '' : pct(avg);
  return vt && g.w - tw(g.g.name, 700) * 12 - 16 >= tw(vt, 600) * 12 + 4 ? vt : '';
}
function layout() {
  if (!S.shown || !els || els.snap) return [];
  const d = S.data[S.kind];
  if (!d || !d.all.length) return [];
  const out = [];
  if (S.view === 'map' && els.boxes && !els.map.hidden) {
    for (const g of els.boxes.heads) {
      const el = els.heads.get(g.g.key);
      out.push({ kind: 'sector', x: g.x, y: g.y, w: g.w, h: g.h, color: '#000', label: g.hd ? g.g.name : '', sub: g.hd && el ? el.__sub || '' : '', hd: g.hd });
    }
    for (const t of els.boxes.tiles) {
      const el = els.tiles.get(t.it.key);
      out.push({ kind: 'tile', x: t.x, y: t.y, w: t.w, h: t.h, color: el ? el.__col : colorOf(t.it), label: t.it.name, sub: el ? el.__sub || '' : '', code: t.it.key });
    }
    return out;
  }
  const W = Math.round((els.list.clientWidth || els.map.clientWidth || root.clientWidth || 0));
  if (!W) return [];
  const Lo = computeLayout(d, W, Math.max(480, Math.min(760, Math.round(W * 0.6))));
  for (const g of Lo.heads) out.push({ kind: 'sector', x: g.x, y: g.y, w: g.w, h: g.h, color: '#000', label: g.hd ? g.g.name : '', sub: g.hd ? headSub(g) : '', hd: g.hd });
  for (const t of Lo.tiles) {
    const L = fit(tileTexts(t.it, t.g), t.w, t.h);
    out.push({ kind: 'tile', x: t.x, y: t.y, w: t.w, h: t.h, color: colorOf(t.it), label: t.it.name, sub: L && L.lv >= 2 ? pct(t.it.ratio) : '', code: t.it.key });
  }
  return out;
}
window.KHWorld = { show, hide, layout, shown: () => S.shown ? S.kind : null, view: () => S.view };

// the template may have tried show() before this script existed (page opened at #world / #cmdty): start now
try {
  const m = typeof KH.market === 'function' ? KH.market() : null;
  const w = document.getElementById('world');
  if ((m === 'world' || m === 'cmdty') && w && !w.hidden) show(m === 'cmdty' ? 'commodity' : 'index');
} catch (e) { /* the template will call show() itself */ }
})();

</script>
