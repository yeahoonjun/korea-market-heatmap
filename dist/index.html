<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --page:#131418; --panel:#191a1f; --panel2:#202228; --line:#2b2d34; --line2:#373a42;
  --fg:#eef0f3; --fg2:#bcc0c8; --muted:#8a8f99; --faint:#858993;
  --amber:#ffb547; --amber-soft:rgba(255,181,71,.14);
  --up-text:#ff5c66; --dn-text:#2fd67a;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up-text)} .dn{color:var(--dn-text)} .flat{color:var(--muted)}

/* ── Top bar ───────────────────────────── */
.top{display:flex;align-items:center;gap:20px;padding:12px 18px 10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;display:inline-grid;grid-template-columns:1fr 1fr;gap:1.5px}
.brand i b{display:block;border-radius:1px}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{padding:6px 14px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--amber)}
.tabs button:hover{color:var(--fg)}
.idx{display:flex;gap:18px;font-size:13px;margin-left:auto}
.idx div{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.idx .k{color:var(--muted)} .idx .v{font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live .dot{background:var(--amber);box-shadow:0 0 0 0 rgba(255,181,71,.6);animation:pulse 1.8s infinite}
.status .badge{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.status.live .badge{color:var(--amber);border-color:rgba(255,181,71,.35);background:var(--amber-soft)}
.status.err .dot{background:var(--dn-text);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.55)}70%{box-shadow:0 0 0 7px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}

/* ── Toolbar ───────────────────────────── */
.tools{display:flex;align-items:center;gap:16px;padding:0 18px 10px;flex-wrap:wrap}
.search{position:relative;flex:0 1 260px;min-width:200px}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:14px;padding:0 34px 0 34px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--amber)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:8px;top:7px;font:500 11px var(--sans);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
.search input:focus ~ kbd{display:none}
.sugg{position:absolute;left:0;right:0;top:40px;z-index:60;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none;max-height:340px;overflow:auto}
.sugg.open{display:block}
.sugg button{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:14px}
.sugg button[aria-selected="true"],.sugg button:hover{background:rgba(255,255,255,.06)}
.sugg .sw{width:10px;height:10px;border-radius:2px}
.sugg .meta{color:var(--muted);font-size:12px}
.sugg .empty{padding:10px;color:var(--muted);font-size:13px;line-height:1.5}
.sugg .empty small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl > span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--fg2);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg .pal{display:inline-flex;gap:1px;margin-right:6px;vertical-align:-1px}
.seg .pal b{width:6px;height:11px;display:block}
.seg .pal b:first-child{border-radius:2px 0 0 2px} .seg .pal b:last-child{border-radius:0 2px 2px 0}

/* ── Layout ───────────────────────────── */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:0 18px 14px;flex:1;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0}
.stagebar{display:flex;align-items:center;gap:12px;padding-bottom:6px;min-height:36px}
.crumbs{display:flex;align-items:center;gap:6px;min-height:30px;font-size:13.5px;flex-wrap:wrap;flex:1;min-width:0}
.viewseg button{padding:3px 10px;font-size:12.5px}
.crumbs button.c{color:var(--fg2);padding:3px 6px;border-radius:5px}
.crumbs button.c:hover{background:var(--panel2);color:var(--fg)}
.crumbs button.c.cur{color:var(--fg);font-weight:600;cursor:default;background:none}
.crumbs .sep{color:var(--faint)}
.crumbs .ci{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.crumbs .back{margin-right:4px;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--amber);border:1px solid rgba(255,181,71,.35);background:var(--amber-soft);padding:3px 9px;border-radius:6px}
.crumbs .stat{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.crumbs .stat b{font-weight:600}
.crumbs .hint{color:var(--faint);font-size:12.5px;margin-left:8px}

.map{position:relative;background:#000;border-radius:6px;overflow:hidden;height:calc(100vh - 168px);min-height:520px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.node{position:absolute;overflow:hidden}
.map.anim .node{transition:opacity .3s,background-color .6s}
.node.entering{opacity:0}
.node.leaving{opacity:0!important;pointer-events:none}
.node.leaving .hd{pointer-events:none}
.sec,.ind{pointer-events:none}
.sec{z-index:1}
.ind{z-index:2}
.sec .hd,.ind .hd{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:0 5px;pointer-events:auto;cursor:zoom-in;white-space:nowrap;overflow:hidden;text-align:left;border-radius:0;width:100%}
.sec .hd:focus-visible,.ind .hd:focus-visible{outline-offset:-2px;z-index:5}
.sec .hd{background:#000;font-size:12px;font-weight:700;color:#f2f3f5}
.ind .hd{background:#0d0e11;font-size:10.5px;font-weight:500;color:#a6abb5}
.sec .hd .t,.ind .hd .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec .hd .v,.ind .hd .v{font-variant-numeric:tabular-nums;flex:none;font-weight:600}
.sec .hd:hover,.ind .hd:hover{color:#fff}
.sec .hd:hover .t,.ind .hd:hover .t{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--amber)}
.focus-leaf .ind .hd,.focus-leaf .sec .hd{cursor:default}
.focus-leaf .sec .hd:hover .t,.focus-leaf .ind .hd:hover .t{text-decoration:none}
.sec.hot{box-shadow:inset 0 0 0 2px var(--amber);z-index:4;pointer-events:none}
.tile{z-index:3;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.tile .lab{display:flex;flex-direction:column;align-items:center;max-width:100%;padding:0 3px;line-height:1.08;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.tile .lab[hidden]{display:none}
.tile .nm{font-weight:600;white-space:nowrap;letter-spacing:-.02em;max-width:100%}
.tile .nm.ell{overflow:hidden;text-overflow:ellipsis}
.tile .pc{font-size:.74em;font-weight:500;margin-top:.12em;font-variant-numeric:tabular-nums;opacity:.96}
.tile .px{font-size:.52em;font-weight:500;margin-top:.3em;opacity:.78;font-variant-numeric:tabular-nums}
.tile .pc[hidden],.tile .px[hidden]{display:none}
.tile:hover,.tile.hov{box-shadow:inset 0 0 0 2px rgba(255,255,255,.92);z-index:5}
.tile.sel{box-shadow:inset 0 0 0 3px var(--amber),0 0 0 1px #000;z-index:6}
.tile.dim{filter:saturate(.25) brightness(.38)}
.map.anim .tile{transition:opacity .3s,background-color .6s,filter .2s}
.tile{transition:filter .2s}
.tile.flash-up::after,.tile.flash-dn::after{content:"";position:absolute;inset:0;pointer-events:none;animation:flash .9s ease-out}
.tile.flash-up::after{background:rgba(255,255,255,.38)}
.tile.flash-dn::after{background:rgba(0,0,0,.45)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.map-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* table view */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;height:calc(100vh - 168px);min-height:520px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.list th button{display:block;width:100%;padding:9px 12px;font-size:inherit;font-weight:inherit;color:inherit;text-align:inherit;white-space:nowrap}
.list th button:hover{color:var(--fg)}
.list th button:focus-visible,.list tbody tr:focus-visible{outline-offset:-2px}
.list th:first-child,.list td:first-child,.list th:nth-child(2),.list td:nth-child(2){text-align:left}
.list th[aria-sort]{color:var(--fg)}
.list th[aria-sort="descending"]::after{content:" ▾"} .list th[aria-sort="ascending"]::after{content:" ▴"}
.list td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:rgba(255,255,255,.035)}
.list tbody tr.sel{background:var(--amber-soft)}
.list .nmcell{display:flex;align-items:center;gap:9px;font-weight:600}
.list .nmcell i{width:10px;height:10px;border-radius:2px;flex:none}
.list .nmcell small{color:var(--faint);font-weight:400;font-size:11.5px}
.list .indc{color:var(--muted);font-size:12.5px}

/* ── Side ───────────────────────────── */
.side{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:42px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{margin:0 0 10px;font-size:13.5px;font-weight:600;color:var(--fg);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.wavg{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.wavg b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wavg span{font-size:12.5px;color:var(--muted)}
.breadth{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:transparent}
.breadth i{display:block;height:100%}
.breadth-lab{display:flex;justify-content:space-between;font-size:12.5px;margin-top:7px;font-variant-numeric:tabular-nums}
.hist{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;align-items:end;height:86px;margin-top:16px}
.hist button{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border-radius:3px}
.hist button .bar{display:block;border-radius:3px 3px 1px 1px;min-height:2px;transition:opacity .15s}
.hist button .cnt{font-size:10.5px;color:var(--fg2);text-align:center;margin-bottom:3px;font-variant-numeric:tabular-nums}
.hist.has-sel button:not([aria-pressed="true"]) .bar{opacity:.28}
.hist button[aria-pressed="true"] .cnt{color:var(--amber);font-weight:600}
.hist button:hover .bar{opacity:1!important;filter:brightness(1.15)}
.hist-axis{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;font-size:10.5px;color:var(--muted);margin-top:5px;text-align:center;font-variant-numeric:tabular-nums}
.hist-note{font-size:11.5px;color:var(--faint);margin-top:8px}
.secs{display:flex;flex-direction:column;gap:1px}
.secs button{display:grid;grid-template-columns:minmax(0,1fr) 92px 58px;align-items:center;gap:8px;padding:6px 6px;margin:0 -6px;border-radius:6px;font-size:13px;text-align:left}
.secs button:hover{background:rgba(255,255,255,.045)}
.secs button.cur{background:var(--amber-soft)}
.secs .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secs .nm small{color:var(--faint);font-size:11px;margin-left:4px}
.secs .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.dbar{position:relative;height:10px}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.dbar i{position:absolute;top:1px;height:8px;border-radius:2px}
.movers-tabs{display:flex;gap:2px;margin-bottom:8px}
.movers-tabs button{font-size:12.5px;padding:4px 9px;border-radius:6px;color:var(--muted)}
.movers-tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.movers{display:flex;flex-direction:column;gap:1px}
.movers button{display:grid;grid-template-columns:10px minmax(0,1fr) auto 66px;gap:9px;align-items:center;padding:6px;margin:0 -6px;border-radius:6px;font-size:13px;text-align:left}
.movers button:hover{background:rgba(255,255,255,.045)}
.movers i{width:10px;height:10px;border-radius:2px}
.movers .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.movers .px{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.movers .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

footer{padding:4px 18px 18px;font-size:12px;color:var(--faint);line-height:1.6}
footer p{margin:0;max-width:92ch}
footer a{color:var(--muted)}

/* ── Tooltip & detail ───────────────────────────── */
.tip{position:fixed;z-index:80;pointer-events:none;width:300px;background:rgba(24,25,30,.97);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;backdrop-filter:blur(6px)}
.tip.show{opacity:1;transform:none}
.card-head{padding:11px 13px 10px;border-bottom:1px solid var(--line)}
.card-head .path{font-size:11.5px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .nmrow{display:flex;align-items:baseline;gap:7px}
.card-head .nmrow b,.card-head .nmrow .nmbtn{font-size:17px;font-weight:700;letter-spacing:-.02em;text-align:left}
.card-head .nmrow .nmbtn{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px;border-radius:4px}
.card-head .nmrow small{color:var(--faint);font-size:11.5px}
.card-head .px{display:flex;align-items:baseline;gap:9px;margin-top:4px;font-variant-numeric:tabular-nums}
.card-head .px b{font-size:21px;font-weight:700;letter-spacing:-.01em}
.card-head .px span{font-weight:600;font-size:13.5px}
.card-head .meta{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-head .meta em{font-style:normal;color:var(--fg2)}
.peers{padding:7px 7px 8px}
.peers .ttl{font-size:11.5px;color:var(--muted);padding:2px 6px 5px}
.peer{display:grid;grid-template-columns:9px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;padding:3px 6px;border-radius:5px;font-size:12.5px}
.peer.me{background:rgba(255,255,255,.07);font-weight:600}
.peer i{width:9px;height:9px;border-radius:2px}
.peer .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer .v{text-align:right;font-variant-numeric:tabular-nums}
.peer .dbar{height:8px}
.peer .dbar i{height:6px;top:1px}

.sheet{position:fixed;z-index:90;right:18px;bottom:18px;width:340px;max-height:min(640px,calc(100vh - 36px));overflow:auto;background:rgba(24,25,30,.98);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:none;font-size:13px}
.sheet.open{display:block;animation:sheetIn .2s ease-out}
.sheet:focus{outline:none}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet .grab{display:none}
.sheet .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.sheet .x:hover{background:rgba(255,255,255,.07);color:var(--fg)}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 13px 13px;border-top:1px solid var(--line)}
.sheet .acts button,.sheet .acts a{flex:1;display:inline-flex;justify-content:center;align-items:center;height:36px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none}
.sheet .acts .pri{background:var(--amber);color:#1b1404;flex:1 1 100%}
.sheet .acts .sec2{border:1px solid var(--line2);color:var(--fg)}
.spark{padding:8px 13px 0}
.spark svg{display:block;width:100%;height:70px}
.spark .note{font-size:11.5px;color:var(--faint);padding:2px 0 6px}

.scrim{display:none}

@media (max-width: 980px){
  .layout{grid-template-columns:1fr}
  .side{padding-top:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (max-width: 760px){
  .top{padding:12px 12px 8px;gap:10px 12px}
  .brand{font-size:16px}
  .idx{order:3;width:100%;margin-left:0;gap:14px;font-size:12.5px}
  .status{order:2;margin-left:auto}
  .status .txt{display:none}
  .tabs{order:4;width:100%}
  .tabs button{flex:1}
  .tools{padding:0 12px 8px;gap:8px}
  .search{flex:1 1 100%;min-width:0}
  .search kbd{display:none}
  .ctls{display:flex;gap:12px;overflow-x:auto;width:calc(100% + 24px);margin:0 -12px;padding:2px 12px 4px;scrollbar-width:none}
  .ctls::-webkit-scrollbar{display:none}
  .layout{padding:0 12px 12px;gap:12px}
  .crumbs .stat{margin-left:0;width:100%;order:9}
  .crumbs .hint{display:none}
  .map,.tablewrap{height:72svh;min-height:440px}
  .side{display:flex}
  .tip{display:none}
  .sheet{left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;max-height:78svh;padding-bottom:env(safe-area-inset-bottom)}
  .sheet .grab{display:block;width:38px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
  .scrim.open{display:block;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.45)}
  footer{padding:4px 12px 24px}
  .tabs button,.seg button,.movers-tabs button,.crumbs button.c,.crumbs .back{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .crumbs .back{padding:3px 12px}
  .secs button,.movers button{min-height:40px}
  .sheet .x{width:40px;height:40px;right:6px;top:6px}
  .list th:nth-child(2),.list td:nth-child(2){display:none}
  table.list{font-size:12.5px}
  .list th{font-size:12px}
  .list th button{min-height:40px;padding:0 6px}
  .list td{padding:10px 6px}
  .list .nmcell{gap:6px}
  .list .nmcell small{display:none}
  .list td:first-child{width:100%;max-width:0}
  .list .nmt{min-width:0;overflow:hidden;text-overflow:ellipsis}
}
.ctls{display:contents}
@media (max-width:760px){.ctls{display:flex}}
@media (prefers-reduced-motion: reduce){
  .map.anim .node,.map.anim .tile{transition:none}
  .status.live .dot{animation:none}
  .tile.flash-up::after,.tile.flash-dn::after{animation:none}
  .sheet.open{animation:none}
  .tip{transition:none}
}
</style>
</head>

<script>
(() => {
'use strict';

/* ───────────────── config ───────────────── */
const MODE = document.documentElement.dataset.mode === 'live' ? 'live' : 'snapshot';
const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const MKT_NAME = { K: '코스피', Q: '코스닥', ALL: '전체' };
const HASH_TO = { kospi: 'K', kosdaq: 'Q', all: 'ALL' };
const TO_HASH = { K: 'kospi', Q: 'kosdaq', ALL: 'all' };
const PALETTES = {
  // stops run from −range … 0 … +range
  krg:    { label: '빨강 상승', stops: ['#12a15b', '#15814b', '#1f5a41', '#383c46', '#74303c', '#b8343f', '#ef3e4a'], upText: '#ff5c66', dnText: '#2fd67a' },
  krb:    { label: 'HTS 색',   stops: ['#2f74e6', '#2e5bb0', '#2f4677', '#383c46', '#74303c', '#b8343f', '#ef3e4a'], upText: '#ff5c66', dnText: '#5b9bff' },
  global: { label: '초록 상승', stops: ['#f63538', '#bf4045', '#8b444e', '#414554', '#35764e', '#2f9e4f', '#2bb553'], upText: '#4fd27a', dnText: '#ff6b6e' },
  cvd:    { label: '색각 친화', stops: ['#ef8a1f', '#b8692a', '#7d5940', '#414554', '#3a5f86', '#3878c0', '#3d95ee'], upText: '#69b4ff', dnText: '#ffa046' },
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrowMQ = matchMedia('(max-width: 760px)');
const hoverMQ = matchMedia('(hover: hover) and (pointer: fine)');
const stockApi = () => (window.KHStock && typeof window.KHStock.open === 'function') ? window.KHStock : null;
const stockOpen = () => { const k = window.KHStock; return !!(k && typeof k.isOpen === 'function' && k.isOpen()); };

/* ───────────────── helpers ───────────────── */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const MINUS = '−';
const sgn = v => v > 0 ? '+' : v < 0 ? MINUS : '';
const fmtPct = (v, d = 2) => sgn(v) + Math.abs(v).toFixed(d) + '%';
const fmtInt = v => Math.round(v).toLocaleString('ko-KR');
const fmtChg = v => sgn(v) + Math.abs(Math.round(v)).toLocaleString('ko-KR');
const fmtEok = v => v < 1 ? '1억 미만' : v >= 10000 ? (v / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '조' : fmtInt(v) + '억';
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'flat';
const store = {
  get(k, d) { try { const v = localStorage.getItem('khm.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('khm.' + k, JSON.stringify(v)); } catch (e) {} },
};
const kstFmt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const kstClock = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

/* ───────────────── state ───────────────── */
const state = {
  market: HASH_TO[location.hash.slice(1)] || store.get('market', 'Q'),
  sizeBy: store.get('sizeBy', 'cap'),
  topN: store.get('topN', narrowMQ.matches ? 100 : 300),
  range: store.get('range', 3),
  palette: store.get('palette2', 'krg'),
  view: 'map',
  focus: null,          // {s} | {s, i}
  bucket: null,
  query: '',
  hoverSector: null,
  hover: null,
  selected: null,
  forced: new Set(),
  movers: 'up',
  sort: { key: 'cap', dir: -1 },
};
if (!PALETTES[state.palette]) state.palette = 'krg';
if (![3, 5, 10].includes(state.range)) state.range = 3;
if (![100, 200, 300, 500].includes(state.topN)) state.topN = 300;
if (MODE === 'live' && state.topN > 300) state.topN = 300;   // the Worker streams the top 300 per market
if (!['cap', 'tv'].includes(state.sizeBy)) state.sizeBy = 'cap';
if (!MKT_NAME[state.market]) state.market = 'Q';

/* ───────────────── data ───────────────── */
const INDUSTRY = new Map(SNAP.stocks.map(s => [s.c, [s.s || '기타', s.i || '기타']]));
let DATA = null;
function setData(raw) {
  const prev = DATA && DATA.byCode;
  const stocks = [];
  for (const x of raw.stocks || []) {
    const map = INDUSTRY.get(x.c);
    const st = {
      c: String(x.c), n: String(x.n), m: x.m === 'K' ? 'K' : 'Q',
      s: x.s || (map ? map[0] : '기타'), i: x.i || (map ? map[1] : '기타'),
      cap: +x.cap || 0, p: +x.p || 0, d: +x.d || 0, r: +x.r || 0, tv: +x.tv || 0, v: +x.v || 0,
    };
    stocks.push(st);
  }
  const byCode = new Map(stocks.map(s => [s.c, s]));
  const changed = [];
  if (prev) for (const s of stocks) { const o = prev.get(s.c); if (o && o.p !== s.p) changed.push([s.c, s.p > o.p ? 1 : -1]); }
  DATA = { asOf: raw.asOf, source: raw.source, marketStatus: raw.marketStatus || {}, afterHours: !!raw.afterHours, index: raw.index || {}, stocks, byCode };
  document.dispatchEvent(new CustomEvent('kh:data'));
  return changed;
}
setData(SNAP);

const val = st => state.sizeBy === 'tv' ? st.tv : st.cap;

    const W = 314, H = 70, base = (st.p - st.d) || pts[0][1];
    const ys = pts.map(p => p[1]).concat(base);
    const y0 = Math.min(...ys), y1 = Math.max(...ys);
    const x = i => (i / (pts.length - 1)) * W;
    const y = v => y1 === y0 ? H / 2 : H - 4 - ((v - y0) / (y1 - y0)) * (H - 8);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join('');
    const last = pts[pts.length - 1][1];
    const col = last > base ? 'var(--up-text)' : last < base ? 'var(--dn-text)' : 'var(--muted)';
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio', 'none');
    const bl = document.createElementNS(NS, 'line');
    Object.entries({ x1: 0, x2: W, y1: y(base), y2: y(base), stroke: '#555963', 'stroke-dasharray': '3 3', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }).forEach(([k, v]) => bl.setAttribute(k, v));
    const path = document.createElementNS(NS, 'path');
    Object.entries({ d, fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }).forEach(([k, v]) => path.setAttribute(k, v));
    svg.append(bl, path);
    const day = j.day ? `${+j.day.slice(4, 6)}월 ${+j.day.slice(6, 8)}일` : '오늘';
    box().replaceChildren(svg, h('div', { class: 'note', text: `${day} 정규장 5분 흐름. 점선은 전일 종가 ${fmtInt(base)}` }));
  } catch (e) {
    if (id === sparkReq && box()) box().replaceChildren(h('div', { class: 'note', text: '장중 차트를 불러오지 못했어요.' }));
  }
}

<style>
/* 종목 페이지 (src/stock/stock.js). 클래스는 모두 sp- 로 시작해요. 색·글꼴 변수는 template.html의 :root를 써요. */
html.sp-on, html.sp-on body { overflow: hidden; }
.sp {
  position: fixed; inset: 0; z-index: 200; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  background: var(--page); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.4;
  word-break: keep-all; overflow-wrap: break-word;
  --sp-hh: 61px;
}
.sp[hidden] { display: none; }
.sp:focus { outline: none; }
.sp.sp-in { animation: spIn .2s ease-out; }
@keyframes spIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sp button { min-width: 0; }
.sp h1, .sp h2, .sp h3, .sp p { margin: 0; }
.sp .num { font-variant-numeric: tabular-nums; }

/* ── header ───────────────────────── */
.sp-head { position: sticky; top: 0; z-index: 6; background: rgba(19, 20, 24, .94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.sp-head-in { display: flex; align-items: center; gap: 4px; max-width: 1760px; margin: 0 auto; padding: 8px 14px 8px 4px; min-height: 60px; }
.sp-back { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 2px; width: 44px; height: 44px; border-radius: 10px; color: var(--fg); }
.sp-back:hover { background: rgba(255, 255, 255, .06); }
.sp-back svg { width: 24px; height: 24px; flex: none; }
.sp-back-t { display: none; font-size: 14px; font-weight: 600; }
/* phones: the name has line 1 to itself; code · market · 섹터 › 업종 share line 2 (ellipsis at the end) */
.sp-id { flex: 1; min-width: 0; padding-left: 2px; }
.sp-name { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; outline-offset: 2px; }
.sp-name:focus:not(:focus-visible) { outline: none; }
.sp-sub { display: flex; align-items: baseline; gap: 0 6px; min-width: 0; margin-top: 1px; overflow: hidden; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sp-code, .sp-mkt { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sp-code:empty, .sp-mkt:empty, .sp-path[hidden] { display: none; }
.sp-mkt::before, .sp-path::before { content: "·"; margin-right: 6px; color: var(--faint); }
.sp-code:empty + .sp-mkt::before { content: none; }
.sp-path { flex: 0 1 auto; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* phones: 상한가 sits on the price line, right above the change, so the quote stays narrow and the name keeps its room */
.sp-quote { flex: none; display: grid; grid-template-columns: auto auto; grid-template-areas: "lim price" "chg chg"; justify-content: end; align-items: center; text-align: right; padding-left: 8px; }
.sp-price { grid-area: price; font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; white-space: nowrap; }
.sp-chg { grid-area: chg; justify-self: end; font-size: 13px; font-weight: 600; white-space: pre; margin-top: 1px; }
/* 상한가·하한가: a data label, so it takes the rise/fall text colours */
.sp-lim { grid-area: lim; justify-self: end; flex: none; margin-right: 6px; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 5px; border-radius: 4px; white-space: nowrap; }
.sp-lim[hidden] { display: none; }
.sp-lim.up { color: var(--up-text); background: color-mix(in srgb, var(--up-text) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--up-text) 45%, transparent); }
.sp-lim.dn { color: var(--dn-text); background: color-mix(in srgb, var(--dn-text) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dn-text) 45%, transparent); }
/* 관심종목 */
@media (max-width: 699px) { .sp-head-in:has(.sp-star:not([hidden])) { padding-right: 4px; } }
.sp-star { flex: none; display: inline-grid; place-items: center; width: 42px; height: 44px; margin-left: 2px; border-radius: 10px; color: var(--muted); }
.sp-star[hidden], .sp-nf .sp-star { display: none; }
.sp-star:hover { background: rgba(255, 255, 255, .06); color: var(--fg); }
.sp-star svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; transition: fill .15s, color .15s; }
.sp-star[aria-pressed="true"] { color: var(--amber); }
.sp-star[aria-pressed="true"] svg { fill: var(--amber); }

/* ── meta + stats ───────────────────── */
.sp-main { max-width: 1760px; margin: 0 auto; padding: 10px 12px 28px; }
.sp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 24px; font-size: 12px; color: var(--muted); }
.sp-chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg2); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.sp-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sp-chip.live { color: var(--amber); border-color: rgba(255, 181, 71, .35); background: var(--amber-soft); }
.sp-chip.live i { background: var(--amber); animation: spPulse 1.8s infinite; }
@keyframes spPulse { 0% { box-shadow: 0 0 0 0 rgba(255, 181, 71, .55); } 70% { box-shadow: 0 0 0 6px rgba(255, 181, 71, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 181, 71, 0); } }
.sp-nxt { color: var(--fg2); text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: help; }
.sp-phase-note { color: var(--fg2); }
.sp-meta-err { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
.sp-link { color: var(--amber); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; padding: 0 2px; }

.sp-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin: 10px 0 0; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sp-stats[hidden] { display: none; }
.sp-stat { background: var(--panel); padding: 7px 9px 8px; min-width: 0; }
.sp-stat dt { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-stat dd { margin: 1px 0 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-rng { grid-column: span 3; }
.sp-rng dd { display: flex; align-items: center; gap: 8px; overflow: visible; }
.sp-rng .lo, .sp-rng .hi { flex: none; font-size: 13px; }
.sp-rng .track { position: relative; flex: 1; min-width: 36px; height: 4px; border-radius: 2px; background: var(--line2); }
.sp-rng .track i { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 2px var(--panel); }

/* ── body ───────────────────────── */
.sp-body { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.sp-nf .sp-body, .sp-nf .sp-stats { display: none; }
.sp-chartcol, .sp-side { min-width: 0; }
.sp-tfbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sp-seg { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.sp-seg button { flex: 1 1 0; min-height: 40px; padding: 0 4px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s; }
.sp-seg button:hover { color: var(--fg); }
.sp-seg button[aria-pressed="true"], .sp-seg button[aria-selected="true"] { background: var(--panel2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--amber); }
.sp-tfs { flex: 1; }
.sp-period { display: none; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sp-period b { font-weight: 600; }

.sp-chartwrap { position: relative; height: 45vh; height: 45svh; min-height: 250px; max-height: 620px; background: #191a1f; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sp-chart { position: absolute; inset: 0; }
.sp-legend { position: absolute; z-index: 3; left: 10px; top: 7px; right: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px 10px; pointer-events: none; font-size: 11.5px; line-height: 1.45; color: var(--muted); text-shadow: 0 0 3px #191a1f, 0 0 6px #191a1f; }
.sp-legend .sp-lg-t { color: var(--fg2); font-weight: 600; }
.sp-legend .sp-lg-ohlc { display: flex; flex-wrap: wrap; gap: 0 8px; order: 3; }
.sp-legend .kv.vol { order: 2; }
.sp-legend .kv em { font-style: normal; margin-right: 3px; }
.sp-legend .kv b, .sp-legend .sp-lg-r { color: var(--fg); font-weight: 600; }
.sp-legend .kv b.up, .sp-legend .sp-lg-r.up { color: var(--up-text); }
.sp-legend .kv b.dn, .sp-legend .sp-lg-r.dn { color: var(--dn-text); }
.sp-chartmsg { position: absolute; inset: 0; z-index: 4; display: none; place-items: center; padding: 20px; text-align: center; background: #191a1f; }
.sp-chartmsg.on { display: grid; }
.sp-chartmsg.dim { background: rgba(25, 26, 31, .55); }
.sp-loading-t { padding: 6px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line2); font-size: 13px; color: var(--fg2); }
.sp-chart-skel { position: absolute; left: 16px; right: 70px; top: 44px; bottom: 30px; display: flex; align-items: flex-end; gap: 6px; }
.sp-chart-skel i { flex: 1; border-radius: 2px; background: #24262d; animation: spFade 1.3s ease-in-out infinite alternate; }

/* peers */
.sp-peers { display: flex; align-items: center; gap: 10px; margin-top: 10px; min-width: 0; }
.sp-peers[hidden] { display: none; }
.sp-peers-t { flex: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.sp-peer-list { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding: 4px; margin: -4px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
.sp-peer-list::-webkit-scrollbar { display: none; }
.sp-peer { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.sp-peer:hover { border-color: var(--line2); background: var(--panel2); }
.sp-peer .nm { font-weight: 600; }
.sp-peer .num { font-size: 12.5px; font-weight: 600; }
.sp-peer-list .sp-peer:last-child { margin-right: 20px; }

/* tabs */
.sp-tabwrap { position: sticky; top: var(--sp-hh); z-index: 5; padding: 6px 0; margin-top: -6px; background: var(--page); }
.sp-panel { container-type: inline-size; padding-top: 10px; outline: none; }
.sp-panel:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.sp-panel[hidden] { display: none; }

/* messages & skeletons */
.sp-msgbox { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; text-align: center; }
.sp-msg-t { font-size: 14.5px; font-weight: 600; color: var(--fg); }
.sp-msg-s { font-size: 13px; color: var(--muted); max-width: 34ch; }
.sp-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; margin-top: 6px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel2); color: var(--fg); font-size: 13.5px; font-weight: 600; text-decoration: none; }
.sp-btn:hover { border-color: var(--muted); }
.sp-btn.pri { background: var(--amber); border-color: var(--amber); color: #1b1404; }
.sp-btn.pri:hover { filter: brightness(1.06); }
.sp-btn[disabled] { opacity: .6; cursor: default; }
.sp-inline-err { font-size: 12.5px; color: var(--fg2); padding: 6px 2px; }
.sp-inline-err[hidden] { display: none; }
.sp-note { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 10px; }
.sp-note[hidden] { display: none; }
.sp-skel { display: inline-block; vertical-align: middle; max-width: 100%; border-radius: 5px; background: linear-gradient(90deg, #202228 25%, #2b2d35 50%, #202228 75%); background-size: 200% 100%; animation: spShim 1.3s linear infinite; }
.sp-skel-rows { display: flex; flex-direction: column; gap: 6px; }
.sp-skel-rows .sp-skel { display: block; }
@keyframes spShim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes spFade { from { opacity: .45; } to { opacity: 1; } }

/* ── 호가 ───────────────────────── */
.sp-ob-msg[hidden], .sp-ob-grid[hidden] { display: none; }
.sp-ob-msg + .sp-ob-grid { margin-top: 0; }
.sp-ob-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(118px, auto) minmax(0, 1fr); grid-template-rows: repeat(10, 36px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums; }
.sp-q { position: relative; display: flex; align-items: center; padding: 0 8px; font-size: 13px; color: var(--fg2); border-bottom: 1px solid rgba(255, 255, 255, .04); min-width: 0; }
.sp-q.ask { grid-column: 1; justify-content: flex-end; }
.sp-q.bid { grid-column: 3; justify-content: flex-start; }
.sp-q .bar { position: absolute; top: 6px; bottom: 6px; max-width: 100%; border-radius: 3px; transition: width .25s ease-out; }
.sp-q.ask .bar { right: 0; border-radius: 3px 0 0 3px; background: color-mix(in srgb, var(--dn-text) 24%, transparent); }
.sp-q.bid .bar { left: 0; border-radius: 0 3px 3px 0; background: color-mix(in srgb, var(--up-text) 24%, transparent); }
.sp-q span { position: relative; }
.sp-p { grid-column: 2; position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 8px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid rgba(255, 255, 255, .04); white-space: nowrap; color: var(--fg); }
.sp-p.ask { background: color-mix(in srgb, var(--dn-text) 7%, transparent); }
.sp-p.bid { background: color-mix(in srgb, var(--up-text) 7%, transparent); }
.sp-p b { font-size: 14px; font-weight: 600; }
.sp-p small { font-size: 11px; font-weight: 500; opacity: .92; }
.sp-p.up b, .sp-p.up small { color: var(--up-text); }
.sp-p.dn b, .sp-p.dn small { color: var(--dn-text); }
.sp-p.cur { box-shadow: inset 0 0 0 2px var(--fg); }
.sp-p[data-mark]::after { content: ""; position: absolute; left: -1px; right: -1px; height: 2px; background: var(--fg); z-index: 1; }
.sp-p[data-mark="top"]::after { top: -1px; }
.sp-p[data-mark="bottom"]::after { bottom: -1px; }
.sp-ob-info { display: flex; flex-direction: column; gap: 6px; padding: 10px; min-width: 0; font-size: 11.5px; color: var(--muted); }
.sp-ob-info.top { grid-column: 3; grid-row: 1 / span 5; justify-content: flex-end; }
.sp-ob-info.bot { grid-column: 1; grid-row: 6 / span 5; justify-content: flex-start; }
.sp-ob-info > div { display: flex; flex-direction: column; min-width: 0; }
.sp-ob-info b { color: var(--fg); font-size: 13px; font-weight: 600; }
.sp-ob-info small { font-size: 11px; color: var(--muted); line-height: 1.3; }
.sp-ob-info b.up { color: var(--up-text); } .sp-ob-info b.dn { color: var(--dn-text); }
.sp-ob-ratio { display: flex; flex-direction: row !important; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 2px; }
.sp-ob-ratio .a { background: color-mix(in srgb, var(--dn-text) 60%, transparent); }
.sp-ob-ratio .b { flex: 1; background: color-mix(in srgb, var(--up-text) 60%, transparent); }

/* ── 투자자 ───────────────────────── */
.sp-cum { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; }
.sp-cum-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.sp-cum-h h3 { font-size: 13.5px; font-weight: 600; }
.sp-cum-h small, .sp-cum-sub { font-size: 11.5px; color: var(--muted); }
.sp-cum-sub { margin-top: 4px; text-align: right; }
.sp-cum-r { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 34px; }
.sp-cum-r .k { font-size: 13px; color: var(--fg2); }
.sp-cum-r b { font-size: 13.5px; font-weight: 600; text-align: right; min-width: 7.5em; }
.sp-cum-r b .s { display: none; }
.sp-spark { display: block; width: 100%; height: 28px; overflow: visible; }
.sp-spark path { fill: none; stroke: var(--fg2); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.sp-cum-r.up .sp-spark path { stroke: var(--up-text); }
.sp-cum-r.dn .sp-spark path { stroke: var(--dn-text); }
.sp-spark .zero { stroke: var(--line2); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }

/* ── 뉴스·공시 ───────────────────────── */
.sp-nwseg { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-nwseg button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 15px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); color: var(--fg2); font-size: 13.5px; font-weight: 600; }
.sp-nwseg button small { font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.sp-nwseg button small:empty { display: none; }
.sp-nwseg button:hover { color: var(--fg); border-color: var(--line2); }
.sp-nwseg button[aria-pressed="true"] { color: var(--fg); border-color: rgba(255, 181, 71, .55); background: var(--amber-soft); }
.sp-nwseg button[aria-pressed="true"] small { color: var(--amber); }
.sp-nw-body { margin-top: 6px; }
.sp-nw-list { list-style: none; margin: 0; padding: 0; }
.sp-nw-list li + li { border-top: 1px solid rgba(255, 255, 255, .06); }
.sp-nw-a { display: flex; flex-direction: column; gap: 5px; min-height: 44px; padding: 12px 2px; color: var(--fg); text-decoration: none; border-radius: 6px; }
a.sp-nw-a:hover .sp-nw-t { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--muted); }
a.sp-nw-a:visited .sp-nw-t { color: var(--fg2); }
.sp-nw-t { font-size: 14.5px; font-weight: 500; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.sp-nw-m { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; font-size: 12px; color: var(--muted); }
.sp-nw-press { color: var(--fg2); }
.sp-nw-tag { font-size: 11px; line-height: 1.5; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line2); color: var(--fg2); }
.sp-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ── tables ───────────────────────── */
.sp-tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.sp-tbl caption { caption-side: top; text-align: left; font-size: 11.5px; color: var(--muted); padding: 0 2px 6px; }
.sp-tbl th { position: sticky; top: calc(var(--sp-hh) + 58px); z-index: 1; background: var(--page); font-size: 11.5px; font-weight: 500; color: var(--muted); text-align: right; padding: 8px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sp-tbl td { text-align: right; padding: 7px 7px; border-bottom: 1px solid rgba(255, 255, 255, .05); white-space: nowrap; color: var(--fg); }
.sp-tbl th:first-child, .sp-tbl td:first-child { text-align: left; padding-left: 2px; }
.sp-tbl th:last-child, .sp-tbl td:last-child { padding-right: 2px; }
.sp-tbl td:first-child { color: var(--fg2); }
.sp-tbl td.up { color: var(--up-text); } .sp-tbl td.dn { color: var(--dn-text); } .sp-tbl td.flat { color: var(--fg2); }
.sp-tbl small { display: block; font-size: 11px; line-height: 1.3; }
.sp-tbl .s, .sp-tbl .c-hl { display: none; }
.sp-tbl small.s { display: none; }
.sp-daily-t .c-hl small { color: var(--muted); }
.sp-more { width: 100%; margin-top: 12px; min-height: 44px; }
.sp-more[hidden] { display: none; }

@container (max-width: 560px) {
  .sp-tbl { font-size: 12.5px; }
  .sp-tbl th, .sp-tbl td { padding-left: 4px; padding-right: 4px; }
  .sp-tbl .l { display: none; }
  .sp-tbl .s { display: inline; }
  .sp-tbl small.s { display: block; }
  .sp-tbl .c-pct, .sp-tbl .c-chg, .sp-tbl .c-o { display: none; }
  .sp-tbl .c-hl { display: table-cell; }
  .sp-cum-r b .l { display: none; }
  .sp-cum-r b .s { display: inline; }
  .sp-cum-r b { min-width: 5.5em; }
}

/* ── snapshot fallback ───────────────── */
.sp-offline { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px 20px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.sp-off-ic { width: 44px; height: 44px; color: var(--muted); margin-bottom: 4px; }
.sp-offline h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; max-width: 26ch; line-height: 1.4; text-wrap: balance; }
.sp-offline p { font-size: 13px; color: var(--muted); max-width: 40ch; }
.sp-offline .sp-btn { margin-top: 10px; min-height: 44px; padding: 0 20px; }
.sp-snap .sp-peers { margin-top: 0; }

.sp-foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.sp-foot a { color: var(--fg2); }

/* ── tablet ───────────────────────── */
@media (min-width: 700px) {
  .sp-head-in { padding: 10px 20px 10px 8px; }
  .sp-back { width: auto; padding: 0 12px 0 6px; }
  .sp-back-t { display: inline; }
  /* the path row spans into a flexible column, so it never widens the code column */
  .sp-id { display: grid; grid-template-columns: minmax(0, max-content) max-content 1fr; grid-template-areas: "name code mkt" "path path path"; column-gap: 6px; align-items: baseline; }
  .sp-sub { display: contents; }
  .sp-name { grid-area: name; font-size: 21px; }
  .sp-code { grid-area: code; } .sp-mkt { grid-area: mkt; }
  .sp-path { grid-area: path; margin-top: 1px; }
  .sp-path::before { content: none; }
  .sp-quote { grid-template-areas: "price price" "chg lim"; }
  .sp-lim { margin: 1px 0 0 6px; }
  .sp-price { font-size: 24px; }
  .sp-chg { font-size: 14px; }
  .sp-main { padding: 12px 20px 28px; }
  .sp-stats { grid-template-columns: repeat(5, minmax(0, auto)) minmax(240px, 1fr); }
  .sp-snap .sp-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sp-rng { grid-column: auto; }
  .sp-stat { padding: 8px 14px 9px; }
  .sp-stat dt { font-size: 11.5px; }
  .sp-stat dd { font-size: 15px; }
  .sp-tfs { flex: 0 1 460px; }
  .sp-period { display: block; margin-left: auto; }
  .sp-seg button { padding: 0 10px; }
}

/* ── desktop: chart left, tabs right, everything in one screen ── */
@media (min-width: 1100px) {
  .sp-main { display: flex; flex-direction: column; height: calc(100vh - var(--sp-hh)); height: calc(100dvh - var(--sp-hh)); min-height: 640px; padding: 12px 24px 12px; }
  .sp-snap .sp-main { height: auto; min-height: 0; }
  .sp-head-in { padding: 10px 24px 10px 12px; gap: 10px; }
  .sp-id { flex: 0 1 auto; }
  .sp-quote { display: flex; align-items: baseline; gap: 10px; margin-left: 22px; padding-left: 22px; border-left: 1px solid var(--line); text-align: left; }
  .sp-price { font-size: 26px; }
  .sp-chg { font-size: 15px; margin-top: 0; }
  .sp-lim { margin: 0; align-self: center; }
  .sp-star { margin-left: auto; }
  .sp-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 30vw, 480px); gap: 18px; }
  .sp-snap .sp-body { display: flex; }
  .sp-chartcol { display: flex; flex-direction: column; min-height: 0; }
  .sp-chartwrap { flex: 1; height: auto; max-height: none; min-height: 320px; }
  .sp-side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 0; }
  .sp-tabwrap { position: static; padding: 0; margin: 0; background: none; }
  .sp-side .sp-seg { background: var(--page); }
  .sp-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 4px 14px; margin: 0 -4px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  .sp-tbl th { top: 0; background: var(--panel); }
  #sp-p-ob:not([hidden]) { display: flex; flex-direction: column; }
  .sp-ob-grid { flex: 1 1 auto; max-height: 560px; background: var(--page); grid-template-rows: repeat(10, minmax(34px, 1fr)); }
  .sp-cum { background: var(--page); }
  .sp-foot { margin-top: 10px; }

}

    const st = KH.stock(S.code);
    R.stats.hidden = !st;
    if (!st) return;
    R.stats.replaceChildren(
      statItem('시가총액', F.eok(st.cap)), statItem('거래대금', F.eok(st.tv)),
      statItem('거래량', compact(st.v) + '주'), statItem('전일 종가', int(st.p - st.d)));
    return;
  }
  const s = S.sum;
  R.stats.hidden = !s && !!S.sumErr;
  if (!s) {
    R.stats.replaceChildren(...['시가총액', 'PER', 'PBR', '배당수익률', '외국인 보유율'].map(l => statItem(l, skel('4em', '0.9em'))), statItem('52주 최저·최고', skel('100%', '0.9em'), 'sp-rng'));
    return;
  }
  const lo = s.low52, hi = s.high52, p = s.price;
  let rng = '—';
  if (isNum(lo) && isNum(hi) && hi > lo) {
    const x = Math.max(0, Math.min(1, (p - lo) / (hi - lo)));
    rng = [h('span', { class: 'lo', text: int(lo) }),
      h('span', { class: 'track', role: 'img', 'aria-label': `52주 범위에서 현재가 위치 ${Math.round(x * 100)}%` }, h('i', { style: `left:${(x * 100).toFixed(1)}%` })),
      h('span', { class: 'hi', text: int(hi) })];
  }
  R.stats.replaceChildren(
    statItem('시가총액', isNum(s.marketCap) ? F.eok(+s.marketCap) : '—'),
    statItem('PER', fixed(s.per, 2, '배')),
    statItem('PBR', fixed(s.pbr, 2, '배')),
    statItem('배당수익률', fixed(s.dividendYield, 2, '%')),
    statItem('외국인 보유율', fixed(s.foreignRate, 2, '%')),
    statItem('52주 최저·최고', rng, 'sp-rng'));
}

/* ───────────────── summary ───────────────── */
async function loadSummary(quiet) {
  const g = S.gen;
  clearTimeout(S.timers.sum);
  try {
    const j = await api('summary', 'sum');
    if (g !== S.gen) return;
    S.sum = j; S.sumErr = null;
  } catch (e) {
    if (aborted(e) || g !== S.gen) return;
    if (!quiet || !S.sum) S.sumErr = e;
  }
  const before = S.phase;
  S.phase = phaseOf(S.sum);
  root.classList.toggle('sp-nf', !!(S.sumErr && S.sumErr.status === 404 && !KH.stock(S.code)));
  renderHead(); renderMeta(); renderStats();
  syncChartRef();
  if (before !== S.phase) scheduleIntraday();
  for (const t of TABS) if (t.summary) t.summary(before !== S.phase);
  scheduleSummary();
}
function scheduleSummary() {
  clearTimeout(S.timers.sum);
  if (LIVE && S.open && document.visibilityState === 'visible' && (PHASE[S.phase] || {}).live) S.timers.sum = setTimeout(() => loadSummary(true), SUMMARY_MS);
}

/* ───────────────── chart ───────────────── */
let lwcPromise = null;
function loadLWC() {
  if (window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  if (lwcPromise) return lwcPromise;
  lwcPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = LWC_SRC; s.async = true; s.crossOrigin = 'anonymous'; s.integrity = LWC_SRI;
    s.onload = () => (window.LightweightCharts ? resolve(window.LightweightCharts) : reject(new Error('Lightweight Charts missing')));
    s.onerror = () => { s.remove(); lwcPromise = null; reject(new Error('Lightweight Charts load failed')); };
    document.head.append(s);
  });
  return lwcPromise;
}

const C = { chart: null, candles: null, vol: null, prevLine: null, bars: null, index: new Map(), tf: null, ref: null, cache: new Map() };
const timeKey = t => (t && typeof t === 'object' ? `${t.year}-${pad(t.month)}-${pad(t.day)}` : t);
function timeParts(t) {
  if (typeof t === 'number') { const d = new Date(t * 1000); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay(), hh: d.getUTCHours(), mm: d.getUTCMinutes() }; }
  const [y, m, d] = typeof t === 'string' ? t.split('-').map(Number) : [t.year, t.month, t.day];
  return { y, m, d, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay(), hh: 0, mm: 0 };
}
function timeLabel(t, tf) {
  const p = timeParts(t);
  switch (tf || C.tf) {
    case '1d': return `${p.m}월 ${p.d}일 ${pad(p.hh)}:${pad(p.mm)}`;
    case '5d': return `${p.m}월 ${p.d}일 (${WD[p.wd]}) ${pad(p.hh)}:${pad(p.mm)}`;
    case '3y': { const q = p.wd === 0 ? timeParts(new Date(Date.UTC(p.y, p.m - 1, p.d + 1)).toISOString().slice(0, 10)) : p; return `${q.y}.${pad(q.m)}.${pad(q.d)} 주`; }   // Naver weeks start on Sunday
    case '10y': return `${p.y}년 ${p.m}월`;
    default: return `${p.y}.${pad(p.m)}.${pad(p.d)} (${WD[p.wd]})`;
  }
}
function tickLabel(t, type) {
  const p = timeParts(t);
  if (type === 0) return `${p.y}년`;
  if (type === 1) return `${p.m}월`;
  if (type === 2) return `${p.m}/${p.d}`;
  return `${pad(p.hh)}:${pad(p.mm)}`;
}

async function ensureChart() {
  if (C.chart) return;
  const L = await loadLWC();
  if (C.chart) return;
  const font = getComputedStyle(document.body).fontFamily;
  const chart = L.createChart(R.chart, {
    autoSize: true,
    layout: { background: { type: L.ColorType.Solid, color: '#191a1f' }, textColor: '#8a8f99', fontSize: 11, fontFamily: font, attributionLogo: true,
      panes: { separatorColor: '#2b2d34', separatorHoverColor: 'rgba(255,255,255,.06)', enableResize: false } },
    grid: { vertLines: { color: 'rgba(255,255,255,.035)' }, horzLines: { color: 'rgba(255,255,255,.045)' } },
    crosshair: { mode: L.CrosshairMode.Normal,
      vertLine: { color: '#8a8f99', width: 1, style: L.LineStyle.Dashed, labelBackgroundColor: '#373a42' },
      horzLine: { color: '#8a8f99', width: 1, style: L.LineStyle.Dashed, labelBackgroundColor: '#373a42' } },
    rightPriceScale: { borderColor: '#2b2d34', scaleMargins: { top: 0.16, bottom: 0.06 } },
    timeScale: { borderColor: '#2b2d34', rightOffset: 2, fixLeftEdge: true, fixRightEdge: true, lockVisibleTimeRangeOnResize: true, tickMarkFormatter: tickLabel },
    localization: { locale: 'ko-KR', timeFormatter: t => timeLabel(t) },
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: false }, axisDoubleClickReset: true },
  });
  const P = KH.palette();
  const candles = chart.addSeries(L.CandlestickSeries, {
    upColor: P.up, downColor: P.down, wickUpColor: P.up, wickDownColor: P.down, borderVisible: false,
    priceFormat: { type: 'custom', formatter: p => F.int(Math.round(p)), minMove: 1 }, priceLineStyle: L.LineStyle.Dotted,
    autoscaleInfoProvider: base => {
      const r = base();
      if (r && C.ref != null) { r.priceRange.minValue = Math.min(r.priceRange.minValue, C.ref); r.priceRange.maxValue = Math.max(r.priceRange.maxValue, C.ref); }
      return r;
    },
  });
  const vol = chart.addSeries(L.HistogramSeries, { priceFormat: { type: 'custom', formatter: v => compact(v), minMove: 1 }, priceLineVisible: false, lastValueVisible: false,
    // opening and closing auctions dwarf the 1-minute bars; clip them so the rest stays readable (the legend shows the real number)
    autoscaleInfoProvider: base => { const r = base(); if (r && C.volCap) r.priceRange.maxValue = Math.min(r.priceRange.maxValue, C.volCap); return r; } }, 1);
  vol.priceScale().applyOptions({ scaleMargins: { top: 0.18, bottom: 0 } });
  const panes = chart.panes();
  panes[0].setStretchFactor(4);
  if (panes[1]) panes[1].setStretchFactor(1);
  new ResizeObserver(() => { cancelAnimationFrame(C.raf); C.raf = requestAnimationFrame(fitMargins); }).observe(R.chart);
  chart.subscribeCrosshairMove(param => {
    const i = param && param.point && param.time != null ? C.index.get(timeKey(param.time)) : undefined;
    renderLegend(i);
  });
  Object.assign(C, { chart, candles, vol, L });
}

function sanitize(raw, intraday) {
  const out = new Map();
  for (const b of raw || []) {
    if (!b || !isNum(b.c)) continue;
    const t = intraday ? (isNum(b.t) ? +b.t + KST : null) : (/^\d{4}-\d{2}-\d{2}$/.test(b.t) ? b.t : null);
    if (t == null) continue;
    const c = +b.c, o = isNum(b.o) && +b.o > 0 ? +b.o : c;
    const hi = Math.max(isNum(b.h) && +b.h > 0 ? +b.h : c, o, c), lo = Math.min(isNum(b.l) && +b.l > 0 ? +b.l : c, o, c);
    out.set(t, { time: t, o, h: hi, l: lo, c, v: isNum(b.v) ? +b.v : 0 });
  }
  return [...out.values()].sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
}
const FLAT = '#8a8f99';
function candleData(bars) { return bars.map(b => b.c === b.o ? { time: b.time, open: b.o, high: b.h, low: b.l, close: b.c, color: FLAT, wickColor: FLAT } : { time: b.time, open: b.o, high: b.h, low: b.l, close: b.c }); }
function volData(bars) {
  const P = KH.palette(), up = hexRgba(P.up, 0.55), dn = hexRgba(P.down, 0.55), fl = hexRgba(FLAT, 0.45);
  return bars.map(b => ({ time: b.time, value: b.v, color: b.c > b.o ? up : b.c < b.o ? dn : fl }));
}

function chartState(kind, err) {
  const m = R.chartMsg;
  m.className = 'sp-chartmsg';
  if (kind === 'ok') { m.replaceChildren(); return; }
  m.classList.add('on');
  if (kind === 'loading') {
    if (C.bars && C.bars.length) { m.classList.add('dim'); m.replaceChildren(h('span', { class: 'sp-loading-t', role: 'status', text: '불러오는 중…' })); }
    else { m.classList.add('skel'); m.replaceChildren(h('div', { class: 'sp-chart-skel', role: 'status', 'aria-label': '차트 불러오는 중' }, Array.from({ length: 28 }, (_, i) => h('i', { style: `height:${18 + Math.round(Math.abs(Math.sin(i * 1.7)) * 46)}%` })))); }
  } else if (kind === 'error') m.replaceChildren(msgBox('차트를 불러오지 못했어요.', errSub(err), () => loadChart(true)));
  else if (kind === 'lib') m.replaceChildren(msgBox('차트 도구를 불러오지 못했어요.', '네트워크 연결을 확인하고 다시 시도해 주세요.', () => loadChart(true)));
  else if (kind === 'empty') {
    const pre = (S.tf === '1d') && S.phase === 'pre';
    m.replaceChildren(msgBox(pre ? '오늘은 아직 거래가 없어요.' : '이 기간에는 거래 기록이 없어요.', pre ? '9시에 정규장이 열리면 차트가 그려져요.' : '다른 기간을 골라 보세요.'));
  }
}

async function loadChart(force) {
  const g = S.gen, tf = S.tf, code = S.code;
  const key = code + '|' + tf;
  if (C.code !== code) C.bars = null;   // old candles stay under a dim overlay only while the same stock changes period
  chartState('loading');
  try { await ensureChart(); } catch (e) { if (g === S.gen && tf === S.tf) chartState('lib'); return; }
  if (g !== S.gen || tf !== S.tf) return;
  const hit = C.cache.get(key);
  let j = !force && hit && Date.now() - hit.at < (tf === '1d' || tf === '5d' ? 20e3 : 600e3) ? hit.j : null;
  if (!j) {
    try { j = await api('chart?tf=' + tf, 'chart'); } catch (e) {
      if (aborted(e) || g !== S.gen || tf !== S.tf) return;
      C.bars = null; C.candles.setData([]); C.vol.setData([]); renderLegend(); renderPeriod();
      chartState('error', e); return;
    }
    if (g !== S.gen || tf !== S.tf) return;
    C.cache.set(key, { at: Date.now(), j });
  }
  setChartData(j, code, tf, false);
  scheduleIntraday();
}

/* References.
 * 전일 종가 (the dashed line on 1일·5일, and the base of the 1일 change) is the KRX 기준가 that the header and the order
 * book use: price − change from /summary. The chart API's prevClose is the close of the bar *before the first bar*
 * (for 1d the previous day's KRX+NXT close, which can differ from 기준가), so it only serves as the period's base. */
function sumRef() {
  const s = S.sum;
  return s && s.code === S.code && isNum(s.price) && isNum(s.change) && +s.price - +s.change > 0 ? +s.price - +s.change : null;
}
const dayOf = t => Math.floor(t / 86400);   // intraday times are KST-shifted seconds
function computeRefs() {
  const bars = C.bars || [];
  C.ref = C.intraday ? (sumRef() != null ? sumRef() : C.tf === '1d' ? C.base : null) : null;
  // the legend's % per bar: intraday → that day's previous close (today's = 전일 종가); otherwise → the previous bar
  const refs = new Array(bars.length);
  const lastDay = C.intraday && bars.length ? dayOf(bars[bars.length - 1].time) : null;
  let day = null, ref = C.base;
  for (let i = 0; i < bars.length; i++) {
    if (!C.intraday) { refs[i] = i ? bars[i - 1].c : C.base; continue; }
    const d = dayOf(bars[i].time);
    if (d !== day) { day = d; ref = i ? bars[i - 1].c : C.base; }
    refs[i] = d === lastDay && C.ref != null ? C.ref : ref;
  }
  C.refs = refs;
}
function drawRefLine() {
  if (C.prevLine) { C.candles.removePriceLine(C.prevLine); C.prevLine = null; }
  if (C.ref != null && C.bars && C.bars.length) C.prevLine = C.candles.createPriceLine({ price: C.ref, color: '#8a8f99', lineWidth: 1, lineStyle: C.L.LineStyle.Dashed, axisLabelVisible: true, title: '전일 종가', axisLabelColor: '#373a42', axisLabelTextColor: '#eef0f3' });
}
// the last-price label follows the day's change (as in the header), not the last candle's own colour
function lastColor() {
  const d = S.sum && S.sum.code === S.code && isNum(S.sum.change) ? +S.sum.change : null;
  if (d == null) return '';
  const P = KH.palette();
  return d > 0 ? P.up : d < 0 ? P.down : FLAT;
}
// /summary arrived or changed after the candles: move the 전일 종가 line and the legend onto 기준가
function syncChartRef() {
  if (!C.chart || C.code !== S.code) return;
  C.candles.applyOptions({ priceLineColor: lastColor() });
  if (!C.bars || !C.bars.length) return;
  const before = C.ref;
  computeRefs();
  if (C.ref !== before) drawRefLine();
  renderLegend(); renderPeriod();
}

function setChartData(j, code, tf, keepRange) {
  const intraday = tf === '1d' || tf === '5d';
  const bars = sanitize(j && j.bars, intraday);
  const range = keepRange ? C.chart.timeScale().getVisibleLogicalRange() : null;
  C.code = code; C.tf = tf; C.bars = bars; C.intraday = intraday;
  C.base = isNum(j && j.prevClose) && +j.prevClose > 0 ? +j.prevClose : null;
  computeRefs();
  C.index = new Map(bars.map((b, i) => [b.time, i]));
  C.volCap = 0;
  if (intraday && bars.length > 40) {
    const v = bars.map(b => b.v).sort((a, b) => a - b), cap = v[Math.floor(v.length * 0.97)] * 1.8;
    if (cap > 0 && v[v.length - 1] > cap) C.volCap = cap;
  }
  if (C.prevLine) { C.candles.removePriceLine(C.prevLine); C.prevLine = null; }
  C.candles.applyOptions({ priceLineColor: lastColor() });
  C.chart.applyOptions({ timeScale: { timeVisible: intraday, secondsVisible: false } });
  if (!bars.length) {
    C.candles.setData([]); C.vol.setData([]);
    renderLegend(); renderPeriod(); chartState('empty');
    R.chart.setAttribute('aria-label', `${TF_NAME[tf]} 차트: 거래 기록이 없어요`);
    return;
  }
  const cdata = candleData(bars);
  if (tf === '1d' && S.phase === 'open') {
    // leave room for the rest of the regular session (until 15:30 KST)
    const last = bars[bars.length - 1].time, p = timeParts(last);
    const end = Date.UTC(p.y, p.m - 1, p.d, 15, 30) / 1000;
    for (let t = last + 60; t <= end; t += 60) cdata.push({ time: t });
  }
  C.candles.setData(cdata);
  C.vol.setData(volData(bars));
  drawRefLine();
  if (range) C.chart.timeScale().setVisibleLogicalRange(range); else C.chart.timeScale().fitContent();
  chartState('ok');
  renderLegend(); renderPeriod(); fitMargins();
  const first = bars[0], last = bars[bars.length - 1];
  R.chart.setAttribute('aria-label', `${R.name.textContent} ${TF_NAME[tf]} 차트. ${timeLabel(first.time, tf)} ${int(first.o)}원에서 ${timeLabel(last.time, tf)} ${int(last.c)}원까지, 봉 ${bars.length}개.`);
}

function renderLegend(i) {
  const bars = C.bars;
  if (!R.legend) return;
  if (!bars || !bars.length) { R.legend.replaceChildren(); return; }
  if (i == null || !bars[i]) i = bars.length - 1;
  const b = bars[i];
  const ref = C.refs && C.refs[i] != null ? C.refs[i] : null;
  const r = ref ? (b.c / ref - 1) * 100 : null;
  const kv = (k, v, c) => h('span', { class: 'kv' }, h('em', { text: k }), h('b', { class: c || '', text: v }));
  R.legend.replaceChildren(
    h('span', { class: 'sp-lg-t', text: timeLabel(b.time) }),
    r != null ? h('b', { class: 'sp-lg-r ' + cls(r), title: C.intraday ? '전일 종가 대비' : '직전 봉 종가 대비', text: pct(r) }) : null,
    h('span', { class: 'sp-lg-ohlc' }, kv('시', int(b.o)), kv('고', int(b.h)), kv('저', int(b.l)), kv('종', int(b.c), cls(b.c - (ref || b.o)))),
    kv('거래량', compact(b.v), 'vol'));
}
// keep the top of the candles clear of the legend (it wraps to two lines on phones)
function fitMargins() {
  if (!C.chart || !R.legend) return;
  const pane = C.chart.panes()[0], ph = pane && pane.getHeight ? pane.getHeight() : 0;
  if (!ph) return;
  const top = Math.min(0.3, Math.max(0.08, (R.legend.offsetHeight + 16) / ph));
  if (Math.abs(top - (C.top || 0)) > 0.01) { C.top = top; C.candles.priceScale().applyOptions({ scaleMargins: { top, bottom: 0.06 } }); }
}
function renderPeriod() {
  const bars = C.bars;
  if (!R.period) return;
  if (!bars || !bars.length) { R.period.replaceChildren(); return; }
  const last = bars[bars.length - 1].c;
  if (C.tf === '1d' && C.ref != null) {
    const r = (last / C.ref - 1) * 100;
    R.period.replaceChildren(h('span', { text: `전일 종가 ${int(C.ref)} 대비 ` }), h('b', { class: cls(r), text: pct(r) }));
  } else {
    // from the close before the first bar (falls back to the first bar's open)
    const base = C.base != null ? C.base : bars[0].o, r = (last / base - 1) * 100;
    R.period.replaceChildren(h('span', { text: `${TF_NAME[C.tf]} 동안 ` }), h('b', { class: cls(r), text: pct(r) }));
  }
}
function applyColors() {
  if (!C.candles) return;
  const P = KH.palette();
  C.candles.applyOptions({ upColor: P.up, downColor: P.down, wickUpColor: P.up, wickDownColor: P.down, priceLineColor: lastColor() });

  s = s.replace(' ', 'T').replace(/T(\d{2}:\d{2})(?=$|[+-]|Z)/, 'T$1:00');
  if (!/(Z|[+-]\d{2}:?\d{2})$/.test(s)) s += '+09:00';
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function relTime(d, now) {
  const sec = (now - d) / 1000, a = kst(d), n = kst(now);
  if (sec < 60 && sec > -300) return '방금';
  if (sec >= 60 && sec < 3600) return Math.floor(sec / 60) + '분 전';
  if (sec > 0 && a.key === n.key) return Math.floor(sec / 3600) + '시간 전';
  const days = Math.round((Date.UTC(n.y, n.m - 1, n.d) - Date.UTC(a.y, a.m - 1, a.d)) / 864e5);
  if (days === 1) return '어제';
  if (days > 1 && days < 7) return days + '일 전';

}
const fullTime = d => { const p = kst(d); return `${p.y}년 ${p.m}월 ${p.d}일 (${WD[p.wd]}) ${pad(p.hh)}:${pad(p.mm)}`; };
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null);

function buildNews(panel) {
  R.nw = {
    seg: h('div', { class: 'sp-nwseg', role: 'group', 'aria-label': '뉴스·공시 고르기' },
      NEWS_KINDS.map(k => h('button', { type: 'button', 'data-kind': k.key, 'aria-pressed': 'false', onclick: () => setNewsKind(k.key) },
        h('span', { text: k.label }), h('small', { class: 'num' })))),

    note: h('p', { class: 'sp-note' }),

}
function newsRow(r, kind, now) {
  const d = parseKst(r.datetime), url = safeUrl(r.url);
  const meta = [];
  if (kind === 'disc' && MARKET_NOTICE.test(r.title)) meta.push(h('span', { class: 'sp-nw-tag', text: '시장조치' }));
  if (r.press) meta.push(h('span', { class: 'sp-nw-press', text: String(r.press) }));
  if (d) meta.push(h('time', { datetime: d.toISOString(), title: fullTime(d), text: relTime(d, now) }));
  const kids = [h('span', { class: 'sp-nw-t', text: String(r.title) }), h('span', { class: 'sp-nw-m' }, meta)];
  return h('li', {}, url
    ? h('a', { class: 'sp-nw-a', href: url, target: '_blank', rel: 'noopener' }, kids, h('span', { class: 'sp-vh', text: ' (새 탭)' }))
    : h('div', { class: 'sp-nw-a' }, kids));
}
function renderNews() {
  if (!R.nw) return;
  const kind = newsKind, meta = NEWS_KIND[kind], now = new Date();
  for (const b of R.nw.seg.children) {
    const hit = newsCache.get(S.code + '|' + b.dataset.kind);
    b.setAttribute('aria-pressed', String(b.dataset.kind === kind));
    b.lastChild.textContent = hit ? String(hit.rows.length) : '';

/* ───────────────── open / close ───────────────── */
let inerted = [];

function show(code, opener) {

}

function hide() {
  if (!S.open) return;
  S.open = false;
  S.gen++;
  stopAll();
  root.hidden = true;
  root.classList.remove('sp-in');
  document.documentElement.classList.remove('sp-on');

function setHash(hash, replace) {

  R.playing = false;
  if (R.ui) setPlayIcon();
}
function togglePlay() { replay.playing ? pause() : play(); }
function setSpeed(v) {
  const R = replay;
  R.speed = v;
  for (const b of R.ui.speed.children) b.setAttribute('aria-pressed', String(+b.dataset.v === v));
  if (R.playing) { clearTimeout(R.timer); R.timer = setTimeout(tick, 1000 / v); }
}
function closeReplay() {
  const R = replay;
  if (!R.open) return;
  pause();
  R.open = false; R.frameT = null; R.prices = null; R.req++;
  cancelAnimationFrame(R.raf);
  try { KH.setReplay(null); } catch (e) { /* nothing to undo */ }
  R.el.hidden = true;
  document.documentElement.classList.remove('rp-open');
  document.documentElement.style.setProperty('--rp-h', '0px');
  if (R.btn) { R.btn.setAttribute('aria-expanded', 'false'); R.btn.focus(); }
}
let spaceTaken = false;
function rpKeys(e) {
  const R = replay;
  spaceTaken = false;
  if (!R.open || e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
  // anything layered above the player (dialogs, the heatmap's detail sheet, the stock page) keeps its own keys
  if (document.querySelector('dialog[open], #sheet.open')) return;
  if (window.KHStock && typeof window.KHStock.isOpen === 'function' && window.KHStock.isOpen()) return;
  const t = e.target;
  const textField = t && (t.isContentEditable || t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'range'));
  if (textField) return;                                   // e.g. Esc in the search box clears the search
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeReplay(); return; }
  if (t && t.tagName === 'SELECT') return;                 // the date picker uses arrows and Space itself
  if (!R.day || !R.ui || R.ui.body.hidden) return;
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); e.stopPropagation(); spaceTaken = true; if (!e.repeat) togglePlay(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); step(e.key === 'ArrowLeft' ? -1 : 1); }
}

/* ═════════════ boot ═════════════ */
function initTools() {
  if (!toolsEl) return;
  toast('');                                               // create the live region up front so the first message is announced
  toolsEl.classList.add('xt');
  if (has('layout')) toolsEl.append(toolButton('image', '이미지로 저장', saveImage));
  if (LIVE && has('setReplay')) toolsEl.append(toolButton('replay', '리플레이', openReplay, { 'aria-expanded': 'false' }));
}
initStrip();
initTools();
initPWA();
document.addEventListener('keydown', rpKeys);
// Space on a focused button would also "click" it on keyup: swallow that when the player took the keydown
document.addEventListener('keyup', e => { if (spaceTaken && (e.key === ' ' || e.code === 'Space')) { e.preventDefault(); spaceTaken = false; } });
})();

</script>

</body>
