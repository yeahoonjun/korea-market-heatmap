.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--chip-ring),inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.3)}
.chip .ck{display:inline-grid;place-items:center;width:0;margin-right:0;overflow:hidden;flex:none}
.chip .ck svg{width:14px;height:14px;color:var(--acc);transform:scale(.6);opacity:0}
.chip[aria-pressed="true"] .ck{width:14px;margin-right:6px}
.chip[aria-pressed="true"] .ck svg{transform:none;opacity:1}
.chip[data-anim]{transition:background-color var(--chip-f),box-shadow var(--chip-f),color var(--chip-f)}
.chip[data-anim] .ck{transition:width var(--chip-w),margin-right var(--chip-w)}
.chip[data-anim] .ck svg{transition:transform var(--chip-s),opacity var(--chip-f)}

/* ── 숫자 굴림: 바뀐 자리만, 오른쪽 자리부터 40ms씩. 자리 수가 바뀌면 지금 = 교차, 스프링 = 폭 + 굴림 ── */
.rl{display:inline-flex;align-items:center;font-size:24px;font-weight:650;line-height:1.2;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.rw{display:inline-flex;justify-content:flex-end;width:var(--w);overflow:hidden}
.dg{position:relative;flex:none;display:inline-block;width:1ch;height:1.2em;overflow:hidden;text-align:center}
.dg>span{position:absolute;inset:0}
.dg .n{transform:translateY(100%);opacity:0}
.rl[data-dir="dn"] .dg .n{transform:translateY(-100%)}
.rl.go .dg .o{transform:translateY(-100%);opacity:0}
.rl.go[data-dir="dn"] .dg .o{transform:translateY(100%)}
.rl.go .dg .n{transform:none;opacity:1}
.rl.go .dg.ch>span{transition:transform var(--roll) calc(var(--i)*40ms*var(--k)),opacity var(--roll) calc(var(--i)*40ms*var(--k))}
.rl.go .rw{transition:width var(--roll-w)}
.xf{display:inline-grid}
.xf>span{grid-area:1/1;text-align:right}
.xf .xn{opacity:0}
.rl.go .xf .xo{opacity:0}
.rl.go .xf .xn{opacity:1}
.rl.go .xf>span{transition:opacity var(--xfade)}
.stepper{display:inline-flex;align-items:center;gap:14px}
.unit{font-size:13px;color:var(--muted);margin-left:4px}

/* ── 보기 (시안) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.card{background:var(--panel);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px 6px}
.card h2{font-size:15px;font-weight:700;margin:0}
.card .what{margin:2px 0 8px;color:var(--muted);font-size:12.5px}
.vrow{display:grid;grid-template-columns:78px 1fr;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vrow .slot{min-height:36px;display:flex;align-items:center}
.vrow.tall{align-items:start}
.vrow.tall .slot{min-height:236px;align-items:flex-start}
.vtag{font-size:12px;font-weight:700;color:var(--fg2)}
.vtag small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.vt{grid-column:2;font-size:11.5px;color:var(--muted);line-height:1.4}
.vt b{color:var(--fg2);font-weight:600}
.warn{color:var(--acc);font-weight:700}
.sec{margin:26px 0 10px;font-size:16px;font-weight:700}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:10px}
.plot{background:var(--panel);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:8px 10px 6px}
.plot h3{margin:0;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.plot h3 span{font-weight:600;font-size:11.5px;color:var(--muted)}
.plot svg{display:block;width:100%;height:auto;margin:2px 0}
.plot p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45}
.plot p b{font-weight:600;color:var(--fg2)}
.plot .sp b{color:var(--acc)}
.plot.flag{box-shadow:inset 0 0 0 1px rgba(255,181,71,.35)}
.foot{margin-top:28px;color:var(--muted);font-size:12px}

/* ── 프레임 표 (?frames=1) ── */
.fr-row{margin:0 0 18px;padding:12px 14px 6px;background:var(--panel);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.fr-row h2{margin:0;font-size:15px;font-weight:700}
.fr-row h2 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
.strip{display:grid;grid-template-columns:70px 1fr;gap:8px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.strip:first-of-type{border-top:0}
.strip .vtag{padding-top:4px}
.cells{display:flex;flex-wrap:wrap;gap:8px 8px}
.cell{position:relative;width:var(--fw);height:calc(var(--fh) + 18px);display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cell .stage{position:relative;width:var(--fw);height:var(--fh);display:flex;align-items:flex-start}
.cell .cap{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto}
.cell .cap.end{color:var(--fg2);font-weight:600}
.cell .swl{display:none}
.fr-legend{font-size:12px;color:var(--muted);margin:2px 0 12px}

@media (max-width:640px){
  .wrap{padding:16px 14px 32px}
  .grid{grid-template-columns:1fr}
  .vrow{grid-template-columns:64px 1fr}
  .strip{grid-template-columns:1fr}
  .cell{zoom:.68}  /* 프레임 칸: 휴대폰에서 한 줄에 셋 */
  .plots{grid-template-columns:1fr 1fr}
  .plot h3{flex-direction:column;gap:0}
}
@media (max-width:420px){ .plots{grid-template-columns:1fr} }

/* ───────── 데모 목록: 시작 상태 → 끝 상태 ───────── */

    spec: { cur: '바로 닫힘 (전환 없음)', ref: v => `내용 <b>fast</b> 180ms <code>--c-in</code> → 60ms 뒤 폭 · 높이 · 모서리 (열기와 같은 스프링)` } },
  { id: 'hl', title: '목록 하이라이트', what: '열린 목록에서 오늘 → 3개월로 옮겨 갈 때. 지금은 바로 그 줄로.', fw: 150, fh: 232, framesOnly: true,
    make: v => mkPop(v), a: 0, b: 3, start: el => { el._set(true, false); el._hi(0, false); }, apply: (el, s, an) => el._hi(s, an),
    spec: { cur: '바로 (hover 배경)', ref: v => `top ${P('morph-hl', v)}` } },
  { id: 'chip', title: '칩 켜기', what: '외국인 순매수 켬. 채움 · 테 + 체크가 0→14px로 자라고 크기 .6→1.', fw: 150, fh: 34,
    make: () => mkChip(), a: false, b: true, apply: (el, s, an) => el._set(s, an),
    spec: { cur: '채움 · 테 · 체크 폭 · 크기 모두 <b>fast</b> 180ms <code>--c-out</code>', ref: v => `체크 폭 ${P('soft', v)} · 크기 ${P('pop', v)} · 채움 ${P('fade', v)}` } },
  { id: 'roll', title: '숫자 굴림', what: '248 → 251. 바뀐 자리만, 오른쪽 자리부터 40ms씩.', fw: 80, fh: 34,
    make: () => mkRoll('248'), a: '248', b: '251', apply: (el, s, an) => el._set(s, an),
    spec: { cur: '<b>base</b> 320ms <code>--c-out</code>', ref: v => `${P('roll', v)}` } },
  { id: 'rollw', title: '자리 수가 바뀔 때', what: '98 → 102. 지금은 굴리지 않고 교차(fast), 스프링은 폭이 자라며 새 자리도 굴러요.', fw: 80, fh: 34, framesOnly: true,
    make: () => mkRoll('98'), a: '98', b: '102', apply: (el, s, an) => el._set(s, an),
    spec: { cur: '교차 <b>fast</b> 180ms (폭은 바로)', ref: v => `폭 ${P('roll-w', v)} · 자리 ${P('roll', v)}` } },
];
const specOf = (d, v) => v === 'cur' ? d.spec.cur : d.spec.ref(v);

/* ───────── 곡선 그림 (닫힌 해 · 같은 시간 눈금) ───────── */
function springX(k, c, t) {
  const w0 = Math.sqrt(k), z = c / (2 * w0);
  if (z < 1) { const a = z * w0, w = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-a * t) * (Math.cos(w * t) + (a / w) * Math.sin(w * t)); }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const s = Math.sqrt(z * z - 1), r1 = -w0 * (z - s), r2 = -w0 * (z + s), C1 = r2 / (r1 - r2);
  return 1 + C1 * Math.exp(r1 * t) + (-1 - C1) * Math.exp(r2 * t);
}
function bez(x1, y1, x2, y2) {
  const bx = t => 3 * (1 - t) ** 2 * t * x1 + 3 * (1 - t) * t * t * x2 + t ** 3, by = t => 3 * (1 - t) ** 2 * t * y1 + 3 * (1 - t) * t * t * y2 + t ** 3;
  return p => { if (p <= 0) return 0; if (p >= 1) return 1; let lo = 0, hi = 1, t = p; for (let i = 0; i < 40; i++) { t = (lo + hi) / 2; if (bx(t) < p) lo = t; else hi = t; } return by(t); };
}
const TMAX = 820;
function svgPlot(curves, ymax) {
  const W = 240, H = 104, L = 22, R = 6, T = 6, B = 16, iw = W - L - R, ih = H - T - B;
  const X = ms => L + iw * ms / TMAX, Y = y => T + ih * (1 - y / ymax);
  let g = `<rect x="${L}" y="${Y(1.02)}" width="${iw}" height="${Y(.98) - Y(1.02)}" fill="rgba(255,255,255,.07)"/>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(1)}" y2="${Y(1)}" stroke="rgba(255,255,255,.22)" stroke-width="1"/>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
  for (const ms of [0, 200, 400, 600, 800]) g += `<text x="${X(ms)}" y="${H - 4}" fill="#8a8f99" font-size="9" text-anchor="${ms ? 'middle' : 'start'}">${ms}</text>`;
  g += `<text x="${L - 4}" y="${Y(1) + 3}" fill="#8a8f99" font-size="9" text-anchor="end">1</text><text x="${L - 4}" y="${Y(0) + 3}" fill="#8a8f99" font-size="9" text-anchor="end">0</text>`;
  if (ymax > 1.2) g += `<text x="${L - 4}" y="${Y(1.3) + 3}" fill="#8a8f99" font-size="9" text-anchor="end">1.3</text><line x1="${L}" x2="${W - R}" y1="${Y(1.3)}" y2="${Y(1.3)}" stroke="rgba(255,255,255,.06)"/>`;
  else g += `<text x="${L - 4}" y="${Y(1.1) + 3}" fill="#8a8f99" font-size="9" text-anchor="end">1.1</text><line x1="${L}" x2="${W - R}" y1="${Y(1.1)}" y2="${Y(1.1)}" stroke="rgba(255,255,255,.06)"/>`;
  for (const c of curves) {
    const pts = []; for (let i = 0; i <= 200; i++) { const ms = TMAX * i / 200; pts.push(`${X(ms).toFixed(1)},${Y(c.f(ms)).toFixed(1)}`); }
    g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${c.color}" stroke-width="${c.w || 1.6}" ${c.dash ? `stroke-dasharray="${c.dash}"` : ''} stroke-linejoin="round"/>`;
    if (c.mark != null) g += `<line x1="${X(c.mark)}" x2="${X(c.mark)}" y1="${Y(1) - 5}" y2="${Y(1) + 5}" stroke="${c.color}" stroke-width="1.5"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function plots(host) {
  host.append(h(`<h2 class="sec">곡선 — 0에서 1까지, 같은 시간 눈금(0~800ms). 회색 띠 = ±2%</h2>`));
  host.append(h(`<div class="legend"><span><i style="border-color:#8a8f99;border-top-style:dashed"></i>레퍼런스 쌍 그대로</span><span><i style="border-color:#ffb547"></i>제안(넘침 ≤ 2%) · 세로 눈금 = 0.5% 안정</span><span><i style="border-color:#eef0f3"></i>지금 곡선</span></div>`));
  const grid = h(`<div class="plots" style="margin-top:8px"></div>`); host.append(grid);
  const cur = SP.current, fo = bez(...cur['--c-out'].bezier), fi = bez(...cur['--c-inout'].bezier), fp = bez(...cur['--c-pop'].bezier);
  grid.append(h(`<div class="plot"><h3>지금 (controls.md) <span>넘침: out ${cur['--c-out'].overshootPct.toFixed(1)}% · pop ${cur['--c-pop'].overshootPct.toFixed(1)}%</span></h3>${svgPlot([
    { f: ms => fo(Math.min(1, ms / 180)), color: '#eef0f3' }, { f: ms => fo(Math.min(1, ms / 320)), color: '#bcc0c8', dash: '4 2' },
    { f: ms => fi(Math.min(1, ms / 252)), color: '#8a8f99', dash: '1 2' }, { f: ms => fp(Math.min(1, ms / 180)), color: '#ffb547', w: 1.2 }], 1.12)}
    <p><b>fast 180 · base 320</b> <code>--c-out</code>, 스위치 <b>252</b> <code>--c-inout</code>(점선), 완료 체크 <b>pop</b> 180(앰버)</p></div>`));
  for (const s of [...SP.springs, { name: 'pop-check', group: '완료 체크 (화려하게)', ref: SP.popCheck, flagged: false, check: true }]) {
    const a = s.alt || s.ref, curves = [];
    if (s.flagged) curves.push({ f: ms => springX(s.ref.k, s.ref.c, ms / 1000), color: '#8a8f99', dash: '4 3' });
    curves.push({ f: ms => springX(a.k, a.c, ms / 1000), color: '#ffb547', mark: a.settle05Ms ?? null });
    const ymax = Math.max(1.12, 1 + s.ref.overshootPct / 100 + .04);
    const el = h(`<div class="plot${s.flagged ? ' flag' : ''}"><h3>${s.name} <span>${s.group}</span></h3>${svgPlot(curves, ymax)}
      <p>레퍼런스 <b>${s.ref.k}/${s.ref.c}</b> · ζ ${(s.ref.zeta ?? (s.ref.c / (2 * Math.sqrt(s.ref.k)))).toFixed(2)} · 넘침 ${s.flagged ? `<span class="warn">${s.ref.overshootPct.toFixed(1)}%</span>` : s.ref.overshootPct.toFixed(1) + '%'}${s.ref.settle05Ms ? ` · ${Math.round(s.ref.settle05Ms)}ms` : ''}</p>
      ${s.flagged ? `<p class="sp">제안 <b>${a.k}/${a.c}</b> · ζ ${a.zeta.toFixed(2)} · 넘침 ${a.overshootPct.toFixed(1)}% · ${Math.round(a.settle05Ms)}ms</p>` : s.check ? `<p class="sp">완료 체크 ✓ 크기 .6→1 전용 — 지금 <code>--c-pop</code>과 같은 넘침</p>` : `<p class="sp">그대로 써요 (≤ 2%)</p>`}</div>`);
    grid.append(el);
  }
}

/* ───────── 보기 ───────── */
function header(host, frames) {
  const fl = SP.springs.filter(s => s.flagged).length;
  host.append(h(`<header><h1>스프링 모션 시안 ${frames ? '— 전환 프레임' : '— 지금 곡선 vs 스프링'}</h1>
    <p class="sub">같은 컨트롤을 세 가지 곡선으로: <b>지금</b>(controls.md: 180 · 320ms, <code>--c-out</code> · <code>--c-inout</code>), <b>레퍼런스</b>(designbookmark.com/motion의 쌍 그대로, 질량 1), <b>제안</b>(같은 강성에 감쇠만 올려 넘침 ≤ 2%). 레퍼런스 ${SP.springs.length}쌍 중 <span class="warn">${fl}쌍이 2%를 넘어요</span> — 표와 이유는 <code>drafts/springs.md</code>. 움직임 줄이기 = 모든 길이 0(끝 상태로 바로).</p></header>`));
}
function page() {
  const app = $(document, '#app');
  header(app, false);
  const bar = h(`<div class="bar v" data-v="sp"><span><span class="lb">효과</span></span><span><span class="lb">속도</span></span><a href="?frames=1">프레임 표 보기 →</a></div>`);
  app.append(bar);
  const mo = mkSeg(); $$(mo, 'button').forEach((b, i) => b.textContent = ['기본', '줄이기', ''][i]); mo.lastElementChild.remove(); mo.setAttribute('aria-label', '효과');
  const sp = mkSeg(); $$(sp, 'button').forEach((b, i) => b.textContent = ['1×', '¼×', ''][i]); sp.lastElementChild.remove(); sp.setAttribute('aria-label', '속도');
  bar.children[0].append(mo); bar.children[1].append(sp);
  mo.addEventListener('pick', e => { mo._set(e.detail, true); root.dataset.motion = e.detail ? 'reduced' : 'standard'; });
  sp.addEventListener('pick', e => { sp._set(e.detail, true); root.style.setProperty('--k', e.detail ? 4 : 1); });
  const grid = h(`<div class="grid"></div>`); app.append(grid);
  const placers = [mo, sp];
  for (const d of DEMOS.filter(d => !d.framesOnly)) {
    const card = h(`<section class="card"><h2>${d.title}</h2><p class="what">${d.what}</p></section>`); grid.append(card);
    const inst = [];
    for (const [v, name, note] of V) {
      const row = h(`<div class="vrow v${d.id === 'pop' ? ' tall' : ''}" data-v="${v}"><span class="vtag">${name}<small>${note}</small></span><div class="slot"></div><div class="vt">${specOf(d, v)}</div></div>`);
      card.append(row);
      const el = d.make(v);
      if (d.id === 'roll') {
        const st = h(`<span class="stepper"><span><span class="slot-n"></span><span class="unit">종목</span></span><button type="button" class="key">다음 값</button></span>`);
        $(st, '.slot-n').append(el); $(row, '.slot').append(st);
        $(st, '.key').addEventListener('click', () => card.dispatchEvent(new CustomEvent('pick', { detail: 'next' })));
      } else $(row, '.slot').append(el);
      inst.push(el);
      if (el._place) placers.push(el);
    }
    let st = d.a, ri = 0;
    card.addEventListener('pick', e => {
      e.stopPropagation();
      const x = e.detail;
      if (d.id === 'pop') {
        if (x.hi != null) { inst.forEach(el => el._hi(x.hi, true)); return; }
        if (x.sel != null) inst.forEach(el => el._sel(x.sel));
        if (x.open) inst.forEach(el => el._hi(+($(el, '.row[aria-checked="true"]').dataset.i), false));
        inst.forEach(el => el._set(x.open, true)); return;
      }
      if (d.id === 'roll') { ri = (ri + 1) % ROLLS.length; inst.forEach(el => el._set(ROLLS[ri], true)); return; }
      st = typeof x === 'number' || typeof x === 'boolean' ? x : st;
      inst.forEach(el => d.apply(el, st, true));
    });
  }
  plots(app);
  app.append(h(`<p class="foot">만든 곳: <code>node scripts/springs.mjs</code> (토큰 · 표 · 이 파일의 토큰 칸) · 점검 <code>node qa/motion/test_springs.mjs</code>. CSS 전환은 속도를 이어받지 못해서, 움직이는 중에 다시 누르면 새 전환이 속도 0에서 시작해요(지금 곡선도 같아요).</p>`));
  const placeAll = () => placers.forEach(p => p._place());
  placeAll(); document.fonts && document.fonts.ready.then(placeAll);
  new ResizeObserver(placeAll).observe(app);
}

/* ───────── 프레임 표: 실제 전환을 그 시각에 멈춰 찍어요 ───────── */
const TIMES = [0, 60, 120, 180, 240, 320, 480];
const freeze = (cell, t) => { cell.offsetWidth; cell.getAnimations({ subtree: true }).forEach(a => { try { a.pause(); a.currentTime = t; } catch (e) {} }); };
function frames() {
  root.dataset.motion = 'standard';
  const app = $(document, '#app');
  header(app, true);
  app.append(h(`<p class="fr-legend">칸마다 실제 CSS 전환을 시작한 뒤 그 시각(ms)에 멈춰 찍었어요(<code>getAnimations()</code> → <code>pause</code> · <code>currentTime</code>). 마지막 칸 = 끝 상태. 시각은 세 줄 모두 같아요 — 위아래로 비교하면 돼요. 앰버 % = 레퍼런스 쌍의 넘침.</p>`));
  plots(app);
  app.append(h(`<h2 class="sec">프레임</h2>`));
  for (const d of DEMOS) {
    const sec = h(`<section class="fr-row"><h2>${d.title}<small>${d.what}</small></h2></section>`); app.append(sec);
    for (const [v, name, note] of V) {
      const strip = h(`<div class="strip v" data-v="${v}"><span class="vtag">${name}<small>${note}</small></span><div><div class="vt" style="margin:0 0 6px">${specOf(d, v)}</div><div class="cells"></div></div></div>`);
      sec.append(strip);
      const cells = $(strip, '.cells');
      for (const t of [...TIMES, null]) {
        const cell = h(`<div class="cell" style="--fw:${d.fw}px;--fh:${d.fh}px"><div class="stage"></div><span class="cap${t == null ? ' end' : ''}">${t == null ? '끝' : t + 'ms'}</span></div>`);
        cells.append(cell);
        const el = d.make(v); $(cell, '.stage').append(el);
        if (d.start) d.start(el); else d.apply(el, d.a, false);   // 시작 상태, 전환 없이
        el.offsetWidth;
        d.apply(el, d.b, t != null);                              // 끝 칸은 전환 없이 끝 상태
        if (t != null) freeze(cell, t);
      }
    }
  }
}

const go = () => { if (FRAMES) frames(); else page(); window.__ready = true; };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(go);
})();
</script>
</body>
