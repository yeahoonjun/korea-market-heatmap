<style>
/* ═════════════════════════════════════════════════════════════════════════════
   시안 — 컨트롤 규칙(docs/standards/controls.md)을 사이트의 실제 컨트롤에 입힌 모습.
   설치 없이 이 파일 하나로 열려요. 숫자는 모두 예시 데이터예요.
   ═════════════════════════════════════════════════════════════════════════════ */
:root{
  /* 사이트 색 (src/template.html :root 그대로) */
  --page:#131418;--panel:#191a1f;--panel2:#202228;--line:#2b2d34;--line2:#373a42;
  --fg:#eef0f3;--fg2:#bcc0c8;--muted:#8a8f99;--faint:#858993;
  --amber:#ffb547;--amber-soft:rgba(255,181,71,.14);--on-amber:#1b1404;
  --up-text:#ff5c66;--dn-text:#2fd67a;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 컨트롤 모션 토큰 (controls.md §2) — --k는 시안 전용(0.25× 느리게 = 4) */
  --k:1;
  --c-fast:calc(180ms*var(--k));--c-base:calc(320ms*var(--k));--c-slow:calc(560ms*var(--k));
  --c-switch:calc(var(--c-fast)*1.4);--c-spin:calc(var(--c-slow)*1.5);--c-dwell:calc(var(--c-slow)*2);--c-arm:calc(4000ms*var(--k));
  --c-out:cubic-bezier(.22,1,.36,1);--c-in:cubic-bezier(.4,0,1,1);--c-inout:cubic-bezier(.65,0,.35,1);--c-pop:cubic-bezier(.34,1.3,.64,1);
  --focus-w:3px;--focus-off:2px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;background:#0c0d10;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
input{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up-text)}.dn{color:var(--dn-text)}.flat{color:var(--muted)}
/* 포커스: 3px 앰버, 2px 띄움, 바로 나타나요(전환 없음). 잘리는 상자 안에서는 안쪽으로 */
:focus-visible{outline:var(--focus-w) solid var(--amber);outline-offset:var(--focus-off)}
.fin :focus-visible,.fin:focus-visible{outline-offset:calc(var(--focus-w)*-1)}

/* ── 변주 2안: 크기 · 시간 · 규칙은 같고 표면(깊이 · 모서리 · 완료 색)만 달라요 ───────────── */
.vx[data-v="v1"]{
  --tray-bg:#0f1014;--tray-sh:inset 0 1px 3px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.05);
  --ind-bg:#2c2f37;--ind-sh:inset 0 1px 0 rgba(255,255,255,.13),0 1px 2px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35);
  --key-bg:#25272e;--key-fg:var(--fg);--key-ic:var(--fg2);
  --key-sh:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.3);
  --key-dn:inset 0 1px 2px rgba(0,0,0,.55),0 0 0 rgba(0,0,0,0),0 0 0 rgba(0,0,0,0);
  --key-on:inset 0 1px 3px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,181,71,.5),0 0 0 rgba(0,0,0,0);
  --pri-bg:#eef0f3;--pri-fg:#131418;--pri-sh:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.3);
  --press-f:brightness(.86);
  --done-bg:var(--amber);--done-fg:var(--on-amber);--done-ic:var(--on-amber);--done-ring:rgba(0,0,0,0);
  --fail-bg:#2d2519;--fail-fg:#ffd8a1;--fail-ic:var(--amber);--fail-ring:rgba(255,181,71,.6);
  --r-key:12px;--r-pill:999px;--r-tray:12px;--r-in:8px;--r-chip:999px;--r-card:14px;
  --trk:#0f1014;--knob:#f3f4f7;
  --knob-sh:0 1px 1px rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.85);
  --knob-dn:0 1px 1px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.85);
  --chip-bg:#25272e;--chip-on:color-mix(in srgb,var(--amber) 20%,#25272e);--chip-ring:rgba(255,181,71,.8);
  --tab-on:#2c2f37;
}
.vx[data-v="v2"]{
  --tray-bg:var(--panel);--tray-sh:inset 0 0 0 1px var(--line),inset 0 1px 2px rgba(0,0,0,.4);
  --ind-bg:var(--panel2);--ind-sh:inset 0 0 0 1px var(--line2),inset 0 1px 0 rgba(255,255,255,.05),0 1px 0 rgba(0,0,0,.45);
  --key-bg:var(--panel);--key-fg:var(--fg2);--key-ic:var(--muted);
  --key-sh:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.045),0 1px 0 rgba(0,0,0,.6);
  --key-dn:inset 0 0 0 1px var(--line),inset 0 1px 1px rgba(0,0,0,.45),0 0 0 rgba(0,0,0,0);
  --key-on:inset 0 0 0 1px rgba(255,181,71,.45),inset 0 1px 1px rgba(0,0,0,.35),0 0 0 rgba(0,0,0,0);
  --pri-bg:var(--amber);--pri-fg:var(--on-amber);--pri-sh:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 rgba(0,0,0,.6);
  --press-f:brightness(.9);
  --done-bg:var(--panel);--done-fg:var(--amber);--done-ic:var(--amber);--done-ring:rgba(255,181,71,.5);
  --fail-bg:var(--panel);--fail-fg:var(--fg);--fail-ic:var(--amber);--fail-ring:rgba(255,181,71,.5);
  --r-key:8px;--r-pill:8px;--r-tray:9px;--r-in:6px;--r-chip:8px;--r-card:10px;
  --trk:#2b2d34;--knob:#e3e5ea;
  --knob-sh:0 1px 1px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.35);
  --knob-dn:0 0 1px rgba(0,0,0,.45),0 0 0 rgba(0,0,0,0);
  --chip-bg:var(--panel);--chip-on:var(--amber-soft);--chip-ring:rgba(255,181,71,.55);
  --tab-on:var(--panel2);
}

/* ── 누름 (모든 키 · 칩 · 아이콘 키): 1px 가라앉고 그림자 짧아지고 조금 어두워져요. 내려갈 땐 0ms, 올라올 땐 fast·out ── */
.pr{transition:transform var(--c-fast) var(--c-out),box-shadow var(--c-fast) var(--c-out),filter var(--c-fast) var(--c-out),background-color var(--c-base) var(--c-out),color var(--c-base) var(--c-out)}
.pr:active:not(:disabled):not([aria-busy="true"]):not([aria-disabled="true"]),.pr.is-press{transform:translateY(1px);box-shadow:var(--key-dn);filter:var(--press-f);transition-duration:0s,0s,0s,var(--c-base),var(--c-base)}
/* 44px 누름 영역: 보이는 크기는 그대로, 손가락용 영역만 넓혀요 (터치 기기만) */
@media (pointer:coarse){.hit::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}}

/* ── 키 (보조 버튼) ── */
.key{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--r-key);background:var(--key-bg);color:var(--key-fg);box-shadow:var(--key-sh);font-size:13px;font-weight:600;white-space:nowrap}
.key .ic{width:16px;height:16px;flex:none;color:var(--key-ic);transition:color var(--c-fast) var(--c-out)}
.key[aria-expanded="true"],.key.latched{box-shadow:var(--key-on);color:var(--amber)}
.key[aria-expanded="true"] .ic,.key.latched .ic{color:var(--amber)}
.ikey{width:34px;padding:0}
.key.pri{background:var(--pri-bg);color:var(--pri-fg);box-shadow:var(--pri-sh)}
.key.pri .ic{color:currentColor}
.key:disabled,.key[aria-disabled="true"]{opacity:.45;box-shadow:none;cursor:default}
.key.lock{color:var(--muted)}
.key.lock .ic{color:var(--muted)}
.round{border-radius:50%}

/* ── 글자 상자: 상태마다 같은 자리에서 글자가 바뀌어요 (나가는 글자는 위로, 들어오는 글자는 아래에서) ──
   모든 글자가 한 칸에 겹쳐 있어서 상자 폭은 가장 긴 글자 폭으로 고정돼요 → 옆 컨트롤이 움직이지 않아요 */
.lb{display:inline-grid;align-items:center;justify-items:center;min-width:0}
.l{grid-area:1/1;display:inline-flex;align-items:center;justify-content:center;gap:6px;opacity:0;transform:translateY(6px);pointer-events:none;white-space:nowrap;
  transition:opacity var(--c-fast) var(--c-in),transform var(--c-fast) var(--c-in)}
.l.out{transform:translateY(-6px)}
.l.on{opacity:1;transform:none;transition:opacity var(--c-fast) var(--c-out) var(--c-fast),transform var(--c-fast) var(--c-out) var(--c-fast)}
.async[aria-busy="true"]{cursor:progress}
.async[data-st="done"]{background:var(--done-bg);color:var(--done-fg);box-shadow:inset 0 0 0 1px var(--done-ring),var(--key-sh)}
.async[data-st="done"] .ic{color:var(--done-ic)}
.async[data-st="fail"]{background:var(--fail-bg);color:var(--fail-fg);box-shadow:inset 0 0 0 1px var(--fail-ring),var(--key-sh)}
.async[data-st="fail"] .ic{color:var(--fail-ic)}
.key.pri.async[data-st="done"]{background:var(--pri-bg);color:var(--pri-fg)}
/* 도는 고리: 한 바퀴 --c-spin(840ms) 일정하게. 줄이기에서는 멈춘 고리 */
.spn{flex:none;width:15px;height:15px;animation:spn var(--c-spin) linear infinite}
.spn circle{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:30 48;opacity:.95}
@keyframes spn{to{transform:rotate(1turn)}}
[data-motion="fancy"] .spn circle{animation:spnArc var(--c-dwell) var(--c-inout) infinite alternate}
@keyframes spnArc{from{stroke-dasharray:12 48}to{stroke-dasharray:34 48}}
/* 체크: 선이 그려져요(base·out). '화려하게'에서만 크기 .6→1 pop */
.ck{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ck path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--c-base) var(--c-out)}
.l.on .ck path,.on>.ck path,[aria-checked="true"]>.cbx .ck path,[aria-pressed="true"] .cw .ck path,.ckon .ck path{stroke-dashoffset:0;transition-delay:var(--c-fast)}
.mi[aria-checked="true"]>.ck path,.ctl.dd .seg>button[aria-pressed="true"] .ck path,.bub .ck path{stroke-dashoffset:0}
.ctl.dd .seg .ck{display:none}
.clock,.star,.ikey.xk,.tkr .ikey{box-shadow:none!important}
.clock.async{background:none!important;color:inherit!important}
.swrow:active,.swrow.is-press{filter:var(--press-f)}
.swrow{transition:filter var(--c-fast) var(--c-out)}
.swrow:active{transition-duration:0s}
[data-motion="fancy"] .l .ck{transform:scale(.6);transition:transform var(--c-base) var(--c-pop)}
[data-motion="fancy"] .l.on .ck{transform:none;transition-delay:var(--c-fast)}
.wn{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
/* 아이콘만 있는 비동기 키: 말로는 키 아래 짧은 말풍선(자리 차지 없음, 누르지 않음) */
.bub{position:absolute;z-index:30;top:calc(100% + 8px);right:0;padding:5px 9px;border-radius:8px;background:#26282f;box-shadow:inset 0 0 0 1px var(--line2),0 8px 24px rgba(0,0,0,.5);color:var(--fg);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity var(--c-fast) var(--c-in),transform var(--c-fast) var(--c-in)}
.bub.on{opacity:1;transform:none;transition-timing-function:var(--c-out)}
.bub .ck,.bub .wn{width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--amber)}

/* ── 세그먼트: 파인 트레이 + 솟은 표시. 앞 가장자리 fast, 뒤 가장자리 base로 따라와요 ── */
.seg{position:relative;display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-tray);background:var(--tray-bg);box-shadow:var(--tray-sh);isolation:isolate;max-width:100%}
.seg>button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:28px;padding:2px 9px;border-radius:var(--r-in);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;
  transition:color var(--c-fast) var(--c-out),filter var(--c-fast) var(--c-out)}
.seg>button:hover{color:var(--fg2)}
.seg>button[aria-pressed="true"]{color:var(--fg)}
.seg>button:active,.seg>button.is-press{filter:var(--press-f);transition-duration:0s}
.seg>button:disabled{opacity:.45;cursor:default}
.seg>button:focus-visible{outline-offset:-1px;z-index:2}
.seg>.ind{position:absolute;z-index:0;top:var(--t,3px);bottom:var(--b,3px);left:var(--l,3px);right:var(--r,calc(100% - 3px));border-radius:var(--r-in);background:var(--ind-bg);box-shadow:var(--ind-sh);pointer-events:none}
.seg.to-r>.ind{transition:right var(--c-fast) var(--c-out),left var(--c-base) var(--c-out),top var(--c-base) var(--c-out),bottom var(--c-base) var(--c-out)}
.seg.to-l>.ind{transition:left var(--c-fast) var(--c-out),right var(--c-base) var(--c-out),top var(--c-base) var(--c-out),bottom var(--c-base) var(--c-out)}
.seg.mini>button{min-height:24px;padding:1px 9px;font-size:12.5px}
.seg .spn{width:12px;height:12px}
.seg .pal{display:inline-flex;gap:1px}
.seg .pal b{display:block;width:6px;height:11px}
.seg .pal b:first-child{border-radius:2px 0 0 2px}.seg .pal b:last-child{border-radius:0 2px 2px 0}
.seg.off{opacity:.45}
.seg.off>button{cursor:default}
/* 밑줄 탭 (종목 페이지 탭 · 공시 종류): 표시가 2px 앰버 막대예요 */
.ut{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ut::-webkit-scrollbar{display:none}
.ut>button{position:relative;flex:none;display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--muted);transition:color var(--c-fast) var(--c-out),filter var(--c-fast) var(--c-out)}
.ut>button[aria-pressed="true"]{color:var(--fg)}
.ut>button:active{filter:var(--press-f);transition-duration:0s}
.ut>button small{font-size:11.5px;font-weight:500;color:var(--muted)}
.ut>button:focus-visible{outline-offset:-3px}
.ut>.ind{position:absolute;bottom:0;height:2px;left:var(--l,0);right:var(--r,100%);border-radius:2px 2px 0 0;background:var(--amber);pointer-events:none}
.ut.to-r>.ind{transition:right var(--c-fast) var(--c-out),left var(--c-base) var(--c-out)}
.ut.to-l>.ind{transition:left var(--c-fast) var(--c-out),right var(--c-base) var(--c-out)}

/* ── 칩 ── 고르기 칩(하나만): 채움 + 테. 폭이 그대로라 옆 칩이 움직이지 않아요 */
.cs{position:relative;display:inline-flex;align-items:center;gap:6px;flex:none;height:30px;padding:0 11px;border-radius:var(--r-chip);background:var(--chip-bg);color:var(--fg2);box-shadow:var(--key-sh);font-size:13px;font-weight:600;white-space:nowrap}
.cs .n{font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;transition:color var(--c-fast) var(--c-out)}
.cs[aria-pressed="true"]{background:var(--chip-on);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--chip-ring)}
.cs[aria-pressed="true"] .n{color:var(--amber)}
.cs.pr{transition:transform var(--c-fast) var(--c-out),box-shadow var(--c-fast) var(--c-out),filter var(--c-fast) var(--c-out),background-color var(--c-fast) var(--c-out),color var(--c-fast) var(--c-out)}
/* 켜고 끄기 칩(여럿): 켜지면 체크가 폭 0→14px로 자라요 — 오른쪽 끝에 붙은 칩에만 써서 옆이 밀리지 않아요 */
.ct{position:relative;display:inline-flex;align-items:center;flex:none;height:28px;padding:0 10px;border-radius:var(--r-chip);background:var(--chip-bg);color:var(--fg2);box-shadow:var(--key-sh);font-size:12.5px;font-weight:600;white-space:nowrap}
.ct.pr{transition:transform var(--c-fast) var(--c-out),box-shadow var(--c-fast) var(--c-out),filter var(--c-fast) var(--c-out),background-color var(--c-fast) var(--c-out),color var(--c-fast) var(--c-out)}
.ct .cw{display:inline-grid;width:0;margin-right:0;opacity:0;transform:scale(.6);transition:width var(--c-fast) var(--c-out),margin var(--c-fast) var(--c-out),opacity var(--c-fast) var(--c-out),transform var(--c-fast) var(--c-out)}
.ct .cw .ck{width:14px;height:14px}
.ct[aria-pressed="true"]{background:var(--chip-on);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--chip-ring)}
.ct[aria-pressed="true"] .cw{width:14px;margin-right:4px;opacity:1;transform:none}
.ct[aria-pressed="true"] .cw .ck{color:var(--amber)}
.ct .lb{justify-items:end}
/* 가는 칩(누르면 다른 곳으로): 솟은 칩, 누르면 › 가 2px 나가요 */
.cg{position:relative;display:inline-flex;align-items:center;gap:7px;flex:none;height:40px;padding:0 10px 0 12px;border-radius:var(--r-pill);background:var(--chip-bg);box-shadow:var(--key-sh);font-size:13px;font-weight:600;white-space:nowrap}
.cg .go{width:12px;height:12px;color:var(--muted);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--c-fast) var(--c-out)}
.cg:active .go,.cg.is-press .go{transform:translateX(2px);transition-duration:0s}

/* ── 스위치: 파인 트랙 + 솟은 손잡이. 손잡이와 채움이 한 곡선(252ms inout)으로 가요. 끌 수 있어요 ── */
.tgl{--t:0;position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:var(--trk);box-shadow:var(--tray-sh)}
.tgl::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--amber);box-shadow:inset 0 1px 2px rgba(0,0,0,.28);opacity:var(--t);transition:opacity var(--c-switch) var(--c-inout)}
.tgl i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:var(--knob-sh);
  transform:translateX(calc(var(--t)*18px));transition:transform var(--c-switch) var(--c-inout),box-shadow var(--c-fast) var(--c-out)}
[aria-checked="true"]>.tgl,[aria-checked="true"] .tgl{--t:1}
.swrow:active .tgl i,.swrow.is-press .tgl i,.swrow.drag .tgl i{box-shadow:var(--knob-dn);transition-duration:var(--c-switch),0s}
.swrow.drag .tgl i{transition:box-shadow var(--c-fast) var(--c-out)}
.swrow.drag .tgl::before{transition:none}
.swrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:40px;padding:6px 8px 6px 12px;border-radius:var(--r-key);background:var(--key-bg);box-shadow:var(--key-sh);font-size:13px;font-weight:600;color:var(--fg);text-align:left;touch-action:pan-y}
.swrow.bare{background:none;box-shadow:none;padding:0 2px;min-height:40px;width:auto;font-size:12.5px;color:var(--fg2)}

/* ── 아이콘 키: ☆/★, 멈춤/흐름, 재생/멈춤, 닫기 ── */
.star{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-key);color:var(--muted)}
.star svg{width:21px;height:21px;fill:rgba(255,181,71,0);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;transition:fill var(--c-fast) var(--c-out),color var(--c-fast) var(--c-out)}
.star[aria-pressed="true"]{color:var(--amber)}
.star[aria-pressed="true"] svg{fill:var(--amber)}
.star:hover{background:rgba(255,255,255,.06)}
.star.pr:active,.star.is-press{transform:translateY(1px);filter:var(--press-f);box-shadow:none}
.mo{width:14px;height:14px;fill:currentColor}
.mo g{transform-box:fill-box;transform-origin:center;transition:transform var(--c-base) var(--c-inout),opacity var(--c-base) var(--c-inout)}
[aria-pressed="true"] .mo .g1,[data-playing="true"] .mo .g1{opacity:0;transform:scale(.4) rotate(-90deg)}
.mo .g2{opacity:0;transform:scale(.4) rotate(90deg)}
[aria-pressed="true"] .mo .g2,[data-playing="true"] .mo .g2{opacity:1;transform:none}
.xk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ikey.xk{background:none;box-shadow:none;color:var(--muted)}
.ikey.xk:hover{background:rgba(255,255,255,.07);color:var(--fg)}
.ikey.xk.pr:active,.ikey.xk.is-press{box-shadow:none}
.pane-h .star,.pane-h .xk,.sp-head .star{width:40px;height:40px}

/* ── 더보기 / 접기: 글자 바꿈 + 꺾쇠가 반 바퀴 ── */
.morel{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:34px;margin-top:6px;border-radius:var(--r-key);background:var(--key-bg);box-shadow:var(--key-sh);font-size:12.5px;font-weight:600;color:var(--fg2)}
.morel .chev{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--c-base) var(--c-inout)}
.morel[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rowin{animation:rowin var(--c-base) var(--c-out) both}
@keyframes rowin{from{opacity:0;transform:translateY(4px)}}

/* ── 두 번 누름 확인 (되돌리기 어려운 일): 4초 동안 띠가 줄어요 ── */
.arm2{overflow:hidden}
.arm2 .drain{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber);opacity:.8;transform-origin:left;transform:scaleX(0)}
.arm2[data-st="armed"]{background:var(--fail-bg);color:var(--fail-fg);box-shadow:inset 0 0 0 1px var(--fail-ring),var(--key-sh)}
.arm2[data-st="armed"] .drain{animation:drain var(--c-arm) linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ── 굴러가는 숫자 ('화려하게'만): 바뀐 자리만, 늘면 위로 · 줄면 아래로 ── */
.rl{display:inline-flex;white-space:pre;font-variant-numeric:tabular-nums}
.rl .dg{position:relative;display:inline-block;overflow:hidden;vertical-align:top}
.rl .dg>.o{position:absolute;left:0;top:0}

/* ── 움직임 단계 ── 줄이기: 전부 바로 끝 상태 / 기본: 누름 · 표시 이동 · 글자 바꿈 / 화려하게: + pop · 굴림 · 고리 숨쉬기 */
[data-motion="reduced"] *,[data-motion="reduced"] *::before,[data-motion="reduced"] *::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
.still,.still *,.still *::before,.still *::after{transition:none!important}

/* ═════════════ 사이트 모형 (.stage) — 폭에 따라 휴대폰 · 데스크톱 배치 (컨테이너 쿼리) ═════════════ */
.stage{container:stage/inline-size;position:relative;background:var(--page);color:var(--fg);border-radius:14px;box-shadow:0 0 0 1px #24262c;overflow:hidden;font-size:14px}
.m-top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 10px;padding:4px 12px 0}
.m-brand{display:flex;align-items:center;gap:8px;min-width:0;height:44px}
.logo{display:inline-grid;grid-template-columns:1fr 1fr;gap:1.5px;width:14px;height:14px;flex:none}
.logo b{border-radius:1px}.logo b:nth-child(1){background:#ef3e4a}.logo b:nth-child(2){background:#1f5a41}.logo b:nth-child(3){background:#383c46}.logo b:nth-child(4){background:#12a15b}
.clock{position:relative;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 4px;margin-left:-4px;border-radius:8px;font:650 26px/1 var(--sans);letter-spacing:-.02em}
.clock .colon{color:var(--muted);padding:0 1px;position:relative;top:-2px}
.clock .ckst{display:inline-grid;width:14px;height:14px;color:var(--amber)}
.clock .ckst>*{grid-area:1/1;opacity:0;transition:opacity var(--c-fast) var(--c-out)}
.clock[data-st="work"] .ckst .spn,.clock[data-st="fail"] .ckst .wn{opacity:1}
.clock .spn,.clock .wn{width:14px;height:14px}
.clock.pr:active,.clock.is-press{transform:translateY(1px);filter:var(--press-f);box-shadow:none}
.m-status{display:flex;align-items:center;gap:6px;justify-self:end}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.m-status .basis{display:none}
.bchip{height:32px;padding:0 8px 0 10px;border-radius:9px;font-variant-numeric:tabular-nums;color:var(--fg)}
.bchip .caret{width:10px;height:10px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--c-base) var(--c-inout)}
.bchip[aria-expanded="true"] .caret{transform:rotate(180deg)}
.m-sbar{grid-column:1/-1;position:relative;height:5px;margin:4px 0 6px;border-radius:99px;background:#1c1e24;overflow:hidden}
.m-sbar i{position:absolute;top:0;bottom:0;left:0}
.m-sbar .s1{width:12%;background:#6f6ad8}.m-sbar .s2{left:12%;width:22%;background:#56b3e8}.m-sbar .s3{left:34%;width:10%;background:#e8a23f}
.tabs{grid-column:1/-1;position:relative;display:flex;gap:0;padding:2px 0 3px;margin-top:-2px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;isolation:isolate}
.tabs::-webkit-scrollbar{display:none}
.tabs>button{position:relative;z-index:1;flex:1 0 auto;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;min-height:40px;padding:2px 7px;border-radius:var(--r-in);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color var(--c-fast) var(--c-out),filter var(--c-fast) var(--c-out)}
.tabs>button[aria-pressed="true"]{color:var(--fg)}
.tabs>button:active{filter:var(--press-f);transition-duration:0s}
.tabs>button:focus-visible{outline-offset:-3px}
.tabs .tn{line-height:16px}.tabs .st{color:var(--amber);margin-right:2px;font-size:.9em}
.tabs .tp{display:block;font-size:11px;line-height:13px;font-weight:600;letter-spacing:-.02em}
.tabs .tsep{display:none}
.tabs>.ind{position:absolute;z-index:0;top:0;bottom:3px;left:var(--l,0);right:var(--r,100%);border-radius:var(--r-in);background:var(--tab-on);box-shadow:var(--ind-sh);pointer-events:none}
.tabs>.ind::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--amber)}
.tabs.to-r>.ind{transition:right var(--c-fast) var(--c-out),left var(--c-base) var(--c-out)}
.tabs.to-l>.ind{transition:left var(--c-fast) var(--c-out),right var(--c-base) var(--c-out)}
/* 시장 띠 (티커) */
.m-strip{display:flex;align-items:center;gap:8px;padding:6px 12px 8px}
.m-vp{flex:1 1 0;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.m-track{display:flex;width:max-content;animation:tk calc(28s*var(--k)) linear infinite}
.m-strip.paused .m-track,.m-strip.hold .m-track{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.tki{display:flex;flex-direction:column;justify-content:center;gap:1px;height:34px;padding:0 11px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.tki .k{font-size:11.5px;color:var(--muted)}.tki .k b{font-weight:500}
.tki .v{font-size:13px;font-weight:600}.tki .v span{font-weight:600;margin-left:5px;font-size:12px}
.pp{width:40px;height:40px;flex:none;color:var(--fg2)}
/* 도구 줄 */
.m-tools{position:relative;display:flex;align-items:center;gap:6px;padding:0 12px 6px}
.m-search{position:relative;flex:1 1 0;min-width:0;display:block}
.m-search input{width:100%;height:40px;border:0;border-radius:var(--r-key);background:var(--tray-bg);box-shadow:var(--tray-sh);color:var(--fg);font-size:14px;padding:0 10px 0 34px;outline:none;transition:box-shadow var(--c-fast) var(--c-out)}
.m-search input:focus-visible{box-shadow:var(--tray-sh),0 0 0 2px var(--page),0 0 0 5px var(--amber);outline:none}
.m-search input::placeholder{color:var(--faint)}
.m-search svg{position:absolute;left:10px;top:12px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.m-search kbd{display:none}
.setbtn{height:40px}
.m-xt{position:relative;display:flex;gap:6px;flex:none}
.m-xt .ikey{width:40px;height:40px}
.m-ctls{display:none}
.m-ctls.open{display:flex;position:absolute;z-index:40;left:0;right:0;top:calc(100% + 2px);flex-direction:column;gap:13px;max-height:660px;overflow:auto;padding:8px 16px 18px;background:rgba(24,25,30,.99);border-radius:16px 16px 0 0;box-shadow:0 -1px 0 var(--line2),0 -18px 60px rgba(0,0,0,.6);animation:shin var(--c-base) var(--c-out)}
@keyframes shin{from{opacity:0;transform:translateY(14px)}}
.ctls-hd{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:14.5px;font-weight:700}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl>span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.m-ctls .seg{display:flex;flex-wrap:wrap}
.m-ctls .seg>button{flex:1 1 auto;min-height:40px}
.m-ctls .ctl[data-ctl="palette"] .seg{display:grid;grid-template-columns:1fr 1fr}
.ctl.dd>.ddbtn{display:none}
.ctl.more>.morebtn{display:none}
.morep{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:13px}
.morehd{font-size:12.5px;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0}
.scrim{display:none}
.stage.sheet-open .scrim{display:block;position:absolute;inset:0;z-index:35;background:rgba(0,0,0,.45);animation:fade var(--c-base) var(--c-out)}
@keyframes fade{from{opacity:0}}
/* 지도 머리줄 · 지도 · 범례 */
.m-layout{display:flex;flex-direction:column;gap:12px;padding:0 12px 12px}
.m-stagebar{display:flex;align-items:center;gap:8px;min-height:44px}
.crumbs{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .cn{display:inline-grid}.crumbs .cn .l{justify-content:flex-start}
.mstat{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mstat b{font-weight:600;color:var(--fg2)}
.mstat .capx{display:none}
.viewseg>button{min-width:44px}
.m-wg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:-2px -2px 0}
.m-wg::-webkit-scrollbar{display:none}
.m-wg[hidden]{display:none}
.wgi{display:inline-flex;flex:none;align-items:center;border-radius:var(--r-chip);background:var(--chip-bg);box-shadow:var(--key-sh);transition:background-color var(--c-fast) var(--c-out),box-shadow var(--c-fast) var(--c-out)}
.wgi:has(.cs[aria-pressed="true"]){background:var(--chip-on);box-shadow:inset 0 0 0 1.5px var(--chip-ring)}
.wgi .cs{height:40px;background:none!important;box-shadow:none!important}
.wgm{position:relative;width:32px;height:40px;margin-left:-8px;border-radius:var(--r-chip);color:var(--fg2);font-size:15px;box-shadow:none!important}
.wgadd{width:40px;height:40px;flex:none;font-size:17px;font-weight:500}
.m-map{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:34px;grid-auto-flow:dense;gap:1px;padding:1px;background:#000;border-radius:6px;overflow:hidden;height:304px;align-content:start}
.m-map .t{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden;color:#fff;text-align:center;font-weight:600;line-height:1.1;text-shadow:0 0 2px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5)}
.m-map .t b{font-weight:600;font-size:13px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.m-map .t span{font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}
.m-map .t.big b{font-size:19px}.m-map .t.big span{font-size:14px}
.m-map .t.mid b{font-size:14px}
.m-map .t.xs b,.m-map .t.xs span{display:none}
.m-map .eg{position:absolute;right:6px;bottom:6px;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.65);color:var(--fg2);font-size:10.5px;font-weight:600}
.m-table{display:none;height:304px;overflow:auto;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px}
.m-table table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.m-table th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;text-align:right;padding:0}
.m-table th:first-child,.m-table td:first-child{text-align:left}
.m-table th button{display:flex;align-items:center;justify-content:inherit;gap:3px;width:100%;min-height:36px;padding:0 8px;color:inherit;white-space:nowrap}
.m-table th:first-child button{justify-content:flex-start}
.m-table th:not(:first-child) button{justify-content:flex-end}
.m-table th[aria-sort] button{color:var(--fg)}
.m-table th .sa{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:transform var(--c-base) var(--c-inout),opacity var(--c-fast) var(--c-out)}
.m-table th[aria-sort] .sa{opacity:1}
.m-table th[aria-sort="ascending"] .sa{transform:rotate(180deg)}
.m-table td{padding:8px;border-top:1px solid rgba(255,255,255,.04);text-align:right;white-space:nowrap}
.stage.tbl .m-map{display:none}.stage.tbl .m-table{display:block}
.m-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--muted)}
.m-legend .lg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.m-legend b{color:var(--fg2);font-weight:600}
.m-legend .grad{width:clamp(90px,30cqi,140px);height:8px;border-radius:2px}
.m-legend .tk{font-variant-numeric:tabular-nums;color:var(--fg2)}
.m-legend .tk .l{justify-content:flex-start}
/* 옆 카드 */
.m-side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px var(--line);padding:14px}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h3 small{font-size:12px;font-weight:400;color:var(--muted)}
.card .seg{display:flex;margin-bottom:8px}
.card .seg>button{flex:1 1 0}
.rows{display:flex;flex-direction:column;gap:1px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) 70px 58px;align-items:center;gap:8px;min-height:40px;padding:0 6px;margin:0 -6px;border-radius:6px;font-size:13px;text-align:left}
.rw:hover{background:rgba(255,255,255,.045)}
.rw:active{filter:brightness(.85);transition:filter 0s}
.rw .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rw .bar{position:relative;height:10px}
.rw .bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.rw .bar i{position:absolute;top:1px;height:8px;border-radius:2px}
.mvr .rw{grid-template-columns:10px minmax(0,1fr) auto 58px}
.mvr .rw .sw{width:10px;height:10px;border-radius:2px}
.mvr .rw .px{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
/* 열리는 것들 (시트 · 종목 페이지 · 다시 보기 · 티커 고르기 · 해외) */
.m-open{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:4px 12px 14px;border-top:1px solid var(--line);margin-top:2px}
.m-open>h3{margin:8px 0 0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.pane{position:relative;background:rgba(24,25,30,.98);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line2);min-width:0}
.pane-h{display:flex;align-items:center;gap:6px;padding:10px 8px 8px 13px;border-bottom:1px solid var(--line)}
.pane-h b{flex:1;min-width:0;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-h small{font-size:11.5px;color:var(--muted);font-weight:500}
.pane-b{padding:10px 13px 13px;display:flex;flex-direction:column;gap:10px}
.qpx{display:flex;align-items:baseline;gap:9px;font-variant-numeric:tabular-nums}
.qpx b{font-size:21px;font-weight:700}.qpx span{font-weight:600;font-size:13.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts>.key{flex:1 1 0;height:40px}
.acts>.key.pri{flex:1 1 100%}
.gp{display:flex;flex-direction:column;gap:2px}
.gpr{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 8px;border-radius:8px;font-size:13.5px;color:var(--fg);text-align:left}
.gpr:hover{background:rgba(255,255,255,.05)}
.gpr:active{filter:var(--press-f);transition:filter 0s}
.gpr .n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cbx{position:relative;display:grid;place-items:center;flex:none;width:18px;height:18px;border-radius:5px;background:var(--tray-bg);box-shadow:var(--tray-sh);transition:background-color var(--c-fast) var(--c-out),box-shadow var(--c-fast) var(--c-out)}
.cbx .ck{width:13px;height:13px;color:var(--on-amber);stroke-width:2.6}
.gpr[aria-checked="true"] .cbx{background:var(--amber);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.sp-head{display:flex;align-items:center;gap:6px}
.sp-head .back{width:40px;height:40px}
.sp-head .nm{flex:1;min-width:0}
.sp-head .nm b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.sp-head .nm small{font-size:12px;color:var(--muted)}
.sp-q{text-align:right;font-variant-numeric:tabular-nums}
.sp-q b{display:block;font-size:18px;font-weight:700}
.sp-q span{font-size:12.5px;font-weight:600}
.cg-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px;margin:-3px}
.cg-row::-webkit-scrollbar{display:none}
.cg .cdi{display:inline-block;width:8px;height:14px;position:relative}
.cg .cdi::before{content:"";position:absolute;left:3.5px;top:0;bottom:0;width:1px;background:currentColor}
.cg .cdi::after{content:"";position:absolute;left:1px;right:1px;top:4px;bottom:3px;background:currentColor;border-radius:1px}
.sp-tf{display:flex}.sp-tf>button{flex:1 1 0;min-height:36px}
.sp-chart{height:64px;border-radius:8px;background:linear-gradient(180deg,rgba(255,92,102,0),rgba(255,92,102,0)),var(--page);position:relative;overflow:hidden}
.sp-chart svg{position:absolute;inset:0;width:100%;height:100%}
.rowpair{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nws{display:flex;gap:6px;flex-wrap:wrap}
.nws .cs{height:40px;border-radius:20px;padding:0 15px}
.dly{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.dly td{padding:6px 2px;border-top:1px solid rgba(255,255,255,.05);text-align:right}
.dly td:first-child{text-align:left;color:var(--fg2)}
.async.wide{width:100%;height:40px}
.rp{display:grid;grid-template-columns:40px auto minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:8px 8px 8px 10px}
.rp .play{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--amber);color:var(--on-amber);box-shadow:var(--pri-sh)}
.rp .play .mo{width:16px;height:16px}
.rp .time{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.rp .trk{position:relative;height:40px;display:flex;align-items:center}
.rp .trk .bar{position:relative;flex:1;height:6px;border-radius:3px;background:#2b2d34}
.rp .trk .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--amber);width:var(--pos,30%)}
.rp .trk .bar b{position:absolute;top:50%;left:var(--pos,30%);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--knob);box-shadow:var(--knob-sh)}
.rp .xk{grid-column:4}
.rp .sub{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tkp .cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px;margin:-3px}
.tkp .cats::-webkit-scrollbar{display:none}
.tkp .cats .cs{height:40px;border-radius:20px;padding:0 14px}
.tkr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 8px;border-bottom:1px solid var(--line);font-size:13.5px}
.tkr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkr .nm small{color:var(--muted);margin-left:5px}
.tkr .ikey{width:36px;height:36px;background:none;box-shadow:none;color:var(--fg2)}
.tkr .ikey:disabled{opacity:.3}
.tkr .ikey svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{display:flex;justify-content:space-between;gap:8px}
.foot .key{height:40px}
.wd-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.menu{position:absolute;z-index:45;min-width:140px;padding:4px;border-radius:12px;background:rgba(32,34,40,.99);box-shadow:inset 0 0 0 1px var(--line2),0 18px 50px rgba(0,0,0,.55);animation:popin var(--c-fast) var(--c-out)}
.menu[hidden]{display:none}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}}
.mi{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--fg);text-align:left;white-space:nowrap}
.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.06)}
.mi:focus-visible{outline-offset:-3px}
.mi:active{filter:var(--press-f);transition:filter 0s}
.mi .ck{margin-left:auto;color:var(--amber)}
.mi[aria-checked="true"]{color:var(--amber)}
.mi small{display:block;font-size:11.5px;color:var(--muted);white-space:normal}
.bmenu{left:8px;right:8px;top:48px}
.bmenu .mi{min-height:54px;flex-wrap:wrap;align-content:center;gap:0 10px}
.bmenu .mi b{font-size:15px;font-weight:600}
.bmenu .mi .ck{position:absolute;right:12px;top:50%;margin-top:-7px}
.wgmenu{left:12px;top:auto}
.ddpop{top:calc(100% + 6px);left:0}

/* ── 데스크톱 배치 (모형 폭 1000px 이상: 1280 미리보기) ── */
@container stage (min-width:1000px){
  .m-top{display:flex;flex-wrap:wrap;gap:0 20px;padding:12px 18px 0}
  .m-brand{height:auto}
  .clock{font-size:30px}
  .tabs{flex:none;padding:3px;margin-top:0;gap:2px;border-radius:var(--r-tray);background:var(--tray-bg);box-shadow:var(--tray-sh);overflow:visible}
  .tabs>button{flex:none;min-height:34px;padding:2px 14px;font-size:14px}
  .tabs .tsep{display:block;width:1px;margin:5px 3px;background:var(--line2)}
  .tabs>.ind{top:3px;bottom:3px}
  .tabs{order:1}
  .m-status{order:2;margin-left:auto;gap:8px;font-size:12.5px;color:var(--fg2)}
  .m-sbar{order:3}
  .m-map .t.xs:not(.f) b,.m-map .t.xs:not(.f) span{display:block}
  .m-map .t.xs b{font-size:11.5px}.m-map .t.xs span{font-size:10px}
  .m-status .basis{display:inline-flex}
  .m-status .bchip{display:none}
  .m-sbar{flex:1 0 100%;height:6px;margin:10px 0 10px}
  .m-strip{padding:0 18px 10px}
  .pp{width:28px;height:28px}
  .m-tools{gap:10px;padding:0 18px 10px;flex-wrap:nowrap}
  .m-search{flex:0 1 160px;min-width:120px}
  .m-search input{height:34px}
  .m-search svg{top:9px}
  .m-search kbd{display:block;position:absolute;right:8px;top:7px;font:500 11px var(--sans);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line2);border-radius:4px;padding:1px 6px}
  .m-search input:focus ~ kbd{display:none}
  .setbtn{display:none}
  .m-ctls,.m-ctls.open{display:contents;animation:none}
  .ctls-hd{display:none}
  .ctl{flex-direction:row;align-items:center;gap:6px}
  .m-ctls .seg{flex-wrap:nowrap}
  .m-ctls .ctl[data-ctl="palette"] .seg{display:inline-flex}
  .m-ctls .seg>button{min-height:26px;padding:2px 7px;flex:none}
  .ctl[data-ctl="topN"] .seg>button{padding:2px 6px}
  .ctl>span{font-size:12.5px}
  .ctl[data-ctl="palette"] .pl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ctl[data-ctl="palette"] .seg>button{padding:2px 7px}
  .ctl.dd{position:relative}
  .ctl.dd>.ddbtn{display:inline-flex;gap:6px;padding:0 9px 0 11px;color:var(--fg)}
  .ctl.dd>.ddbtn .caret{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--c-base) var(--c-inout)}
  .ctl.dd>.ddbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .ctl.dd>.seg{display:none}
  .ctl.dd.open>.seg{display:flex;position:absolute;top:calc(100% + 6px);left:0;z-index:45;flex-direction:column;min-width:128px;padding:4px;background:rgba(32,34,40,.99);box-shadow:inset 0 0 0 1px var(--line2),0 14px 40px rgba(0,0,0,.5);border-radius:12px;animation:popin var(--c-fast) var(--c-out)}
  .ctl.dd>.seg>.ind{display:none}
  .ctl.dd>.seg>button{justify-content:space-between;min-height:34px;padding:0 11px;text-align:left}
  .ctl.dd>.seg>button .ck{display:inline;opacity:0;transition:opacity var(--c-fast) var(--c-out)}
  .morep .ctl{flex-direction:column;align-items:stretch}
  .ctl.dd>.seg>button[aria-pressed="true"]{color:var(--amber)}
  .ctl.dd>.seg>button[aria-pressed="true"] .ck{opacity:1}
  .ctl.more{position:relative}
  .ctl.more>.morebtn{display:inline-flex}
  .morep{display:none}
  .ctl.more.open .morep{display:flex;position:absolute;top:calc(100% + 6px);right:0;z-index:45;width:300px;padding:12px 14px 14px;border-top:0;background:rgba(32,34,40,.99);box-shadow:inset 0 0 0 1px var(--line2),0 18px 50px rgba(0,0,0,.55);border-radius:12px;animation:popin var(--c-fast) var(--c-out)}
  .morep .seg{display:flex}
  .morep .seg>button{flex:1 1 0;min-height:30px}
  .m-xt{margin-left:auto}
  .m-xt .ikey{width:34px;height:34px}
  .m-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:0 18px 14px}
  .m-stagebar{min-height:36px}
  .mstat .capx{display:inline}
  .viewseg>button{min-width:0}
  .wgi .cs{height:30px}.wgm{height:30px}.wgadd{height:32px;width:34px}
  .m-map{height:420px;grid-auto-rows:40px}
  .m-table{height:420px}
  .m-side{padding-top:44px}
  .rw{min-height:30px}
  .morel{height:30px}
  .m-open{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;padding:6px 18px 18px}
  .m-open>h3{grid-column:1/-1}
  .acts>.key{height:36px}
  .pane-h .star,.pane-h .xk,.sp-head .star{width:34px;height:34px}
  .nws .cs,.tkp .cats .cs{height:34px}
  .cg{height:34px}
  .bmenu{left:auto;right:18px;width:300px}
}

/* ═════════════ 시안 페이지의 틀 (사이트 것이 아니에요) ═════════════ */
.dh{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:rgba(12,13,16,.95);box-shadow:0 1px 0 #23252b;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dh h1{margin:0 auto 0 0;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.dh .dc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.dh .seg>button{min-height:30px}
.dh .swrow.bare{color:var(--fg2)}
.dm{max-width:1320px;margin:0 auto;padding:16px 16px 40px}
.lead{max-width:84ch;margin:0 0 6px;color:var(--fg2);font-size:14px}
.lead b{color:var(--fg)}
.rec{display:flex;gap:10px;align-items:flex-start;max-width:84ch;margin:10px 0 18px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);box-shadow:inset 0 0 0 1px rgba(255,181,71,.35);font-size:13.5px;color:var(--fg)}
.rec b{color:var(--amber);white-space:nowrap}
.cols{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
.col{flex:0 1 390px;min-width:0;width:100%}
.col>h2,.sec>h2{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:-.01em}
.col>h2 small,.sec>h2 small{font-size:12px;font-weight:500;color:var(--muted)}
.col .stage{width:100%}
.notes{flex:0 1 380px;min-width:0;font-size:13px;color:var(--fg2)}
.notes h2{margin:0 0 8px;font-size:14px;font-weight:800}
.notes ol,.notes ul{margin:0;padding-left:18px}
.notes li{margin:0 0 6px}
.notes code,.mx code{font:600 11.5px/1 ui-monospace,Menlo,monospace;color:var(--fg);background:#1d1f25;padding:1px 4px;border-radius:4px;white-space:nowrap}
.scroller{overflow-x:auto;border-radius:14px}
.scroller .stage{width:100%;min-width:1280px}
body.desk .dm{max-width:none;padding-left:0;padding-right:0}
body.desk .dm>.lead,body.desk .dm>.rec,body.desk .sec{margin-left:16px;margin-right:16px}
body.desk .scroller{border-radius:0}
.sec{margin-top:34px}
.sec>p{margin:0 0 12px;color:var(--fg2);font-size:13px;max-width:90ch}
.mxw{overflow-x:auto}
.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:880px}
.mx th,.mx td{padding:10px 10px;vertical-align:middle;border-top:1px solid #23252b}
.mx thead th{font-weight:600;color:var(--muted);text-align:left;font-size:11.5px;white-space:nowrap}
.mx tbody th{text-align:left;font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--fg)}
.mx tbody th small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.mx td.vx{background:var(--page)}
.mx td .cap{display:block;margin-top:6px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.mx td.na{color:#4b4f58;text-align:center}
.mx .vt{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.mx .swrow{width:190px}
.cmp{border-collapse:collapse;font-size:13px;width:100%;max-width:980px}
.cmp th,.cmp td{text-align:left;padding:9px 10px;border-top:1px solid #23252b;vertical-align:top}
.cmp thead th{color:var(--muted);font-weight:600;font-size:12px}
.cmp tbody th{white-space:nowrap;color:var(--fg2);font-weight:600}
.cmp td b{color:var(--amber)}
.livemsg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%)}
/* 프레임 시트 (?sheet=frames) */
.fs{padding:14px;width:max-content}
.fs h1{margin:0 0 4px;font-size:20px;font-weight:800}
.fs .sub{margin:0 0 12px;font-size:12.5px;color:var(--fg2);max-width:1200px}
.ft{border-collapse:collapse;width:1240px;table-layout:fixed}
.ft th,.ft td{border-top:1px solid #2a2c33;padding:9px 10px;text-align:left;vertical-align:top;font-size:12px;line-height:1.45}
.ft thead th{font-size:11px;color:var(--muted);font-weight:600}
.ft td:first-child b{display:block;font-size:13.5px}
.ft td:first-child small{display:block;color:var(--muted);margin-top:3px}
.ft code{font:600 11px/1 ui-monospace,Menlo,monospace;background:#1d1f25;padding:1px 4px;border-radius:4px;white-space:nowrap}
.ft td.fr{padding:0}
.frs{display:flex;flex-wrap:wrap;gap:1px;background:#2a2c33}
.frs>.cell{flex:1 1 var(--fw,140px);min-width:0;padding:10px 10px 8px;background:var(--page);display:grid;gap:6px;justify-items:center;align-content:space-between}
.frs>.vtag{flex:0 0 26px;display:grid;place-items:center;background:#16171b;color:var(--muted);font-size:10.5px;font-weight:800}
.frs .cap{justify-self:start;font-size:10.5px;color:var(--muted);white-space:nowrap}
.frs .fanc{color:var(--amber)}
@media (max-width:700px){.dh{position:static}.dh h1{font-size:15px;flex:1 0 100%}.dm{padding:12px 10px 30px}}

<script>
(() => {
"use strict";
const Q = new URLSearchParams(location.search);
const SHEET = Q.get("sheet");
const root = document.documentElement;
const K = () => parseFloat(getComputedStyle(root).getPropertyValue("--k")) || 1;
const MS = { fast: 180, base: 320, slow: 560, dwell: 1120 };
const OUT = "cubic-bezier(.22,1,.36,1)";
const motionOf = (el) => ((el && el.closest && el.closest("[data-motion]")) || root).dataset.motion || "standard";

const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const $ = (r, s) => r.querySelector(s), $$ = (r, s) => [...r.querySelectorAll(s)];

document.addEventListener("touchstart", () => {}, { passive: true });   // Android Chrome: :active가 손가락에 바로 붙게

/* ── 아이콘 ── */
const CK = `<svg class="ck" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.6 3.6 7.4-8"/></svg>`;
const SPN = `<svg class="spn" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/></svg>`;
const WN = `<svg class="wn" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.6"/><path d="M10 6v5M10 14.1v.2"/></svg>`;
const I = {

  replay: `<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 10a6.4 6.4 0 1 0 1.9-4.6"/><path d="M3.3 3.4v3.5h3.5"/><path d="M10 6.6V10l2.4 1.6"/></svg>`,

const PAL = {
  krg: ["#12a15b", "#15814b", "#1f5a41", "#383c46", "#74303c", "#b8343f", "#ef3e4a"],

const swatch = (k) => `<span class="pal" aria-hidden="true"><b style="background:${PAL[k][0]}"></b><b style="background:${PAL[k][3]}"></b><b style="background:${PAL[k][6]}"></b></span>`;

/* ═════════════ 공통 동작 ═════════════ */
/* 글자 상자 상태 바꾸기: 나가는 글자 out(위로), 들어오는 글자 on(아래에서). aria-label은 지금 글자 */
function setSt(el, st) {
  $$(el, ".l.out").forEach(x => x.classList.remove("out"));

/* 세그먼트 · 밑줄 탭 · 시장 탭: 표시는 left/right 두 가장자리. 가는 쪽 가장자리가 먼저(fast), 뒤가 따라와요(base) */

    el.style.setProperty("--t", b.offsetTop + "px");
    el.style.setProperty("--b", (el.clientHeight - b.offsetTop - b.offsetHeight) + "px");

/* 비동기 버튼: 보통 → 하는 중(고리, 다시 안 눌려요) → 됐어요 ✓(두 번 slow 머문 뒤 보통) · 안 됐어요(누를 때까지 그대로) */
function wireAsync(el, { run, ms = 1300, bubble } = {}) {
  if (el._wired) return; el._wired = true;
  let n = 0;
  const say = (st) => {
    const msg = { done: el.dataset.sayDone, fail: el.dataset.sayFail }[st];
    if (msg) live(msg);
    if (bubble && msg) {
      bubble.innerHTML = (st === "done" ? CK : WN) + msg;
      bubble.classList.add("on");
      clearTimeout(bubble._t); bubble._t = later(() => bubble.classList.remove("on"), MS.dwell + MS.slow);
    }
  };
  el.addEventListener("click", () => {
    const st = el.dataset.st;
    if (st === "work" || st === "done") return;
    setSt(el, "work");
    later(() => {
      const ok = run ? run(n++) : (n++ % 2 === 0);
      setSt(el, ok ? "done" : "fail"); say(ok ? "done" : "fail");
      if (ok) later(() => setSt(el, "idle"), 2 * MS.slow);
    }, ms);
  });
}

/* 스위치 줄 (role=switch): 누르면 바뀌고, 트랙을 끌면 손잡이가 손가락을 따라와요. 놓으면 가까운 쪽으로 */

    t = Math.min(1, Math.max(0, t0 + dx / 18)); tg.style.setProperty("--t", t);
  });

    if (!down) return; down = false;
    if (el.classList.contains("drag")) { skip = true; tg.offsetWidth; el.classList.remove("drag"); tg.style.removeProperty("--t"); if ((t >= .5) !== isOn()) set(t >= .5); }

/* 키보드로 눌러도 가라앉아요 (Space · Enter를 누르고 있는 동안) */
document.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && e.target.matches && e.target.matches(".pr,.seg>button,.tabs>button,.swrow")) e.target.classList.add("is-press"); });

/* 굴러가는 숫자 ('화려하게'만): 바뀐 자리만 굴러요. 늘면 위로, 줄면 아래로. 자리 수 · 부호가 바뀌면 짧게 교차 */
function rollTo(el, text, dir) {
  const old = el.dataset.v ?? el.textContent;
  el.dataset.v = text;
  if (old === text) return;
  const fancy = motionOf(el) === "fancy";
  if (!fancy || old.length !== text.length || !dir) {
    el.textContent = text;
    if (fancy) el.animate({ opacity: [0, 1] }, { duration: MS.fast * K(), easing: OUT });
    return;
  }
  el.textContent = "";
  for (let i = 0; i < text.length; i++) {
    const a = old[i], b = text[i];
    const d = document.createElement("span"); d.className = "dg";
    const nn = document.createElement("span"); nn.textContent = b; d.append(nn);
    el.append(d);
    if (a === b) continue;
    if (/\d/.test(a) && /\d/.test(b)) {
      const o = document.createElement("span"); o.className = "o"; o.textContent = a; d.append(o);
      const opt = { duration: MS.base * K(), easing: OUT, delay: (text.length - 1 - i) * 40 * K(), fill: "both" };
      o.animate({ transform: ["translateY(0)", `translateY(${dir > 0 ? -100 : 100}%)`], opacity: [1, 0] }, opt).finished.then(() => o.remove(), () => {});
      nn.animate({ transform: [`translateY(${dir > 0 ? 100 : -100}%)`, "translateY(0)"], opacity: [0, 1] }, opt);

  }
}
const sgn = (s) => /^\+/.test(s) ? 1 : /^[−-]/.test(s) ? -1 : 0;
const pct = (s) => parseFloat(String(s).replace("−", "-").replace(/[^\d.+-]/g, "")) || 0;
const cls = (s) => sgn(s) > 0 ? "up" : sgn(s) < 0 ? "dn" : "flat";

/* ═════════════ 마크업 조각 (모형 · 상태 표 · 프레임이 같이 써요) ═════════════ */
const P = {
  seg: (items, sel, { mini = false, cls: c = "", label = "", data = "" } = {}) =>
    `<div class="seg ${mini ? "mini" : ""} ${c}" role="group" aria-label="${label}" ${data}><span class="ind" aria-hidden="true"></span>${items.map((t, i) => {

    }).join("")}</div>`,
  ut: (items, sel, label) => `<div class="ut fin" role="group" aria-label="${label}"><span class="ind" aria-hidden="true"></span>${items.map((t, i) => `<button type="button" aria-pressed="${i === sel}">${t}</button>`).join("")}</div>`,
  saveIcon: () => `<button type="button" class="key ikey async pr hit" data-st="idle" data-busy="work" data-keep-label="1" aria-label="이미지로 저장" title="이미지로 저장" data-say-done="저장했어요" data-say-fail="이미지를 못 만들었어요 · 다시 눌러 주세요"><span class="lb">${labels({ idle: I.img, work: SPN, done: CK, fail: WN })}</span></button>`,
  saveText: (cls = "") => `<button type="button" class="key async pr ${cls}" data-st="idle" data-busy="work" data-say-done="지도를 이미지로 저장했어요" data-say-fail="이미지를 못 만들었어요"><span class="lb">${labels({ idle: I.img + "이미지로 저장", work: [SPN + "만드는 중", "만드는 중"], done: [CK + "저장했어요", "저장했어요"], fail: [WN + "실패 · 다시", "실패 · 다시"] })}</span></button>`,
  sw: (label, on, hint = "") => `<div><button type="button" class="swrow" role="switch" aria-checked="${on}"><span>${label}</span><span class="tgl" aria-hidden="true"><i></i></span></button>${hint ? `<p class="hint" style="margin-top:6px">${hint}</p>` : ""}</div>`,
  cs: (label, n, on, attrs = "") => `<button type="button" class="cs pr" aria-pressed="${on}" ${attrs}>${label}${n != null ? `<span class="n">${n}</span>` : ""}</button>`,
  ct: (on) => `<button type="button" class="ct pr" aria-pressed="${on}"><span class="cw" aria-hidden="true">${CK}</span><span class="lb">${labels({ off: "추가", on: "추가됨" })}</span></button>`,
  star: (on, label = "관심종목") => `<button type="button" class="star pr hit" aria-pressed="${on}" aria-label="${label}">${I.star}</button>`,
  x: (label = "닫기") => `<button type="button" class="key ikey xk pr hit" aria-label="${label}">${I.x}</button>`,
  more: (n) => `<button type="button" class="morel pr" aria-expanded="false"><span class="lb">${labels({ c: `더보기 (${n}개)`, o: "접기" })}</span>${I.chev}</button>`,
  arm: () => `<button type="button" class="key arm2 async pr" data-st="idle" data-busy=""><span class="lb">${labels({ idle: "기본값으로", armed: [WN + "한 번 더 누르면 되돌려요", "한 번 더 누르면 기본값으로 되돌려요"], done: [CK + "기본값으로 돌렸어요", "기본값으로 돌렸어요"] })}</span><i class="drain" aria-hidden="true"></i></button>`,
};
function wireArm(el, onDo) {
  if (el._wired) return; el._wired = true;
  let t = 0, at = 0;
  el.addEventListener("click", () => {
    const st = el.dataset.st;
    if (st === "idle") { setSt(el, "armed"); at = performance.now(); t = later(() => el.dataset.st === "armed" && setSt(el, "idle"), 4000); }
    else if (st === "armed" && performance.now() - at > 400 * K()) { clearTimeout(t); onDo && onDo(); setSt(el, "done"); live("기본값으로 돌렸어요"); later(() => setSt(el, "idle"), 2 * MS.slow); }
  });
}

  if (el._wired) return; el._wired = true;
  setSt(el, "c");
  el.addEventListener("click", () => { const o = el.getAttribute("aria-expanded") !== "true"; el.setAttribute("aria-expanded", String(o)); setSt(el, o ? "o" : "c"); onToggle && onToggle(o); });
}
function wireChipset(box, onSel) {
  $$(box, ".cs").forEach(c => c.addEventListener("click", () => { $$(box, ".cs").forEach(x => x.setAttribute("aria-pressed", String(x === c))); onSel && onSel(c); }));
}
